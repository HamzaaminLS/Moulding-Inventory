    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;padding:0;background:#0a0c14;overflow-x:hidden}
    html,body{overscroll-behavior-y:contain}
    input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
    input[type=number]{-moz-appearance:textfield}
    ::-webkit-scrollbar{height:3px;width:3px}
    ::-webkit-scrollbar-thumb{background:#4f8cff44;border-radius:4px}
    @keyframes fadeInDown{from{opacity:0;transform:translate(-50%,-16px)}to{opacity:1;transform:translate(-50%,0)}}
    @keyframes fadeOut{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-16px)}}
    @keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    @keyframes syncPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.5}}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    @keyframes offlinePulse{0%,100%{opacity:1}50%{opacity:.7}}
    @keyframes backdropIn{from{opacity:0}to{opacity:1}}
    .toast-enter{animation:fadeInDown .3s cubic-bezier(.34,1.56,.64,1) forwards}
    .toast-exit{animation:fadeOut .25s ease forwards}
    .modal-bg{animation:backdropIn .2s ease forwards}

    button{transition:transform .1s ease, opacity .15s ease}

function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function fmtTS(ts){const d=new Date(ts),dd=String(d.getDate()).padStart(2,"0"),mm=String(d.getMonth()+1).padStart(2,"0"),yy=String(d.getFullYear()).slice(2);let h=d.getHours();const ap=h>=12?"PM":"AM";h=h%12||12;return`${dd}/${mm}/${yy} ${h}:${String(d.getMinutes()).padStart(2,"0")} ${ap}`}
function dlFile(b,f){const u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=f;document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(u)},150)}

function CBadge({color,CLR,size=12}){
  const c=CLR[color]||CLR.universal||{bg:"#888",fg:"#fff",lb:color};
  return <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",minWidth:size*3.2,height:size*1.7,borderRadius:5,background:c.bg,color:c.fg,fontSize:size*.85,fontWeight:900,letterSpacing:.5,padding:"0 7px",flexShrink:0,boxShadow:`0 2px 8px ${c.gw||"transparent"}`}}>{c.lb}</span>;
}
function SDot({syncing,dirty,okC,wnC,acc}){
  const c=syncing?acc:dirty?wnC:okC;
  return <span style={{display:"inline-block",width:7,height:7,borderRadius:"50%",background:c,marginRight:6,flexShrink:0,animation:syncing?"syncPulse .8s ease infinite":dirty?"pulse 1.5s ease infinite":"none",boxShadow:`0 0 6px ${c}`}}/>;
}

function PartRow({part,showProduct,showConfirm,stock,confirmed,editing,editVal,partAdjust,onSetEditing,onSetEditVal,onSetPartAdjust,onSaveStock,onAdjustStock,onToggleConfirm,theme,threshold,productThresholds,CLR,PRODUCTS}){
  const{dark,tx,txd,acc,okC,dnC,wnC,cb,card,S}=theme;
  const s=stock[part.id]||{};const isConf=!!confirmed[part.id];const isCross=!!part.products;
  const prodKey=isCross?"cross":part.p;
  const at=productThresholds[prodKey]!==undefined?productThresholds[prodKey]:threshold;
  return(
    <div style={{...S.crd,padding:"8px 10px",border:isConf?`1.5px solid ${okC}`:`1px solid ${cb}`,background:isConf?(dark?okC+"15":okC+"08"):card}}>
      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
        {showConfirm&&<span onClick={()=>onToggleConfirm(part.id)} style={{cursor:"pointer",fontSize:20,flexShrink:0}}>{isConf?"✅":"⬜"}</span>}
        {isConf&&!showConfirm&&<span style={{fontSize:14,flexShrink:0}}>✅</span>}
        <div style={{display:"flex",alignItems:"center",flexWrap:"wrap",gap:6,flex:1}}>
          <span style={{fontWeight:900,fontSize:18,lineHeight:1.1}}>{part.n}</span>
          {isCross&&<span style={{fontSize:10,background:acc+"22",color:acc,padding:"2px 6px",borderRadius:6,fontWeight:800}}>CROSS</span>}
          {showProduct&&<span style={{fontSize:10,background:txd+"33",color:txd,padding:"2px 6px",borderRadius:6,fontWeight:800}}>{part.products?"Cross":PRODUCTS[part.p]?.name||part.p}</span>}
          <span style={{fontSize:11,color:txd,fontWeight:800}}>×{part.per}/u</span>
        </div>
      </div>
      {part.c.map(c=>{
        const val=s[c]||0,adjKey=`${part.id}_${c}`,isEdit=editing===adjKey,sc=val<=at?dnC:okC;
        return(
          <div key={c} style={{marginBottom:6,padding:"6px 8px",background:dark?"#1f222e":"#f8f9fa",borderRadius:6,border:`1px solid ${dark?"#2d3142":"#e9ecef"}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:isEdit?0:4}}>
              <CBadge color={c} CLR={CLR} size={12}/>
              {isEdit?(
                <div style={{display:"flex",gap:4}}>
                  <input type="number" inputMode="numeric" autoFocus value={editVal} onChange={e=>onSetEditVal(e.target.value)}
                    onKeyDown={e=>{if(e.key==="Enter")onSaveStock(part.id,c);if(e.key==="Escape")onSetEditing(null)}}
                    style={{...S.inp,width:70,fontSize:15,fontWeight:900,textAlign:"center",height:32,padding:"4px"}}/>
                  <button onClick={()=>onSaveStock(part.id,c)} style={{...S.bSm(okC),padding:"0 12px",fontSize:14}}>✓</button>
                </div>
              ):(
                <span onClick={()=>{onSetEditing(adjKey);onSetEditVal(String(val))}}
                  style={{fontWeight:900,fontSize:20,color:sc,cursor:"pointer",borderBottom:`2px dashed ${txd}`,paddingBottom:1}}>
                  {val.toLocaleString()}
                </span>
              )}
            </div>
            {!isEdit&&(
              <div style={{display:"flex",gap:4,alignItems:"center"}}>
                <button onClick={()=>onAdjustStock(part.id,c,-1)} style={{...S.btn(dnC),flex:.7,height:32,fontSize:18,fontWeight:900,padding:0}}>−</button>
                <input type="number" inputMode="numeric" placeholder="Qty" value={partAdjust[adjKey]||""} onChange={e=>onSetPartAdjust(adjKey,e.target.value)}
                  style={{...S.inp,width:55,height:32,fontSize:13,textAlign:"center",fontWeight:800,padding:"0 2px"}}/>
                <button onClick={()=>onAdjustStock(part.id,c,1)} style={{...S.btn(okC),flex:.7,height:32,fontSize:18,fontWeight:900,padding:0}}>+</button>
                <button onClick={()=>onSetPartAdjust(adjKey,String((parseInt(partAdjust[adjKey])||0)+100))} style={{...S.bSm(acc),flex:1,height:32,fontSize:12,fontWeight:800,padding:0}}>+100</button>
                <button onClick={()=>onSetPartAdjust(adjKey,String((parseInt(partAdjust[adjKey])||0)+200))} style={{...S.bSm(acc),flex:1,height:32,fontSize:12,fontWeight:800,padding:0}}>+200</button>
                <button onClick={()=>onSetPartAdjust(adjKey,String((parseInt(partAdjust[adjKey])||0)+500))} style={{...S.bSm(acc),flex:1,height:32,fontSize:12,fontWeight:800,padding:0}}>+500</button>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function Modal({show,onClose,title,children,theme}){
  if(!show)return null;const{txd,S}=theme;
  return(<div className="modal-bg" style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,.75)",zIndex:200,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"40px 12px 20px",backdropFilter:"blur(6px)",overflowY:"auto"}} onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
    <div className="modal-card" style={{...S.crd,margin:0,maxWidth:440,width:"100%",padding:"18px 16px",borderRadius:16,maxHeight:"85vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div style={{fontSize:17,fontWeight:900}}>{title}</div>
        <button onClick={onClose} style={{background:"none",border:"none",color:txd,fontSize:20,cursor:"pointer",padding:"2px 6px"}}>✕</button>
      </div>{children}
    </div>
  </div>);
}

function MgrColors({CLR,onAdd,onEdit,onDel,theme,toast}){
  const{dark,tx,txd,acc,okC,dnC,S}=theme;
  const[nk,setNk]=useState("");const[nl,setNl]=useState("");const[nh,setNh]=useState("#ff6b6b");
  const[ek,setEk]=useState(null);const[el,setEl]=useState("");const[eh,setEh]=useState("");
  const[cd,setCd]=useState(null);
  return(<div>
    <div style={{fontSize:12,fontWeight:800,color:txd,marginBottom:8}}>Add/edit/delete colors for your parts.</div>
    {Object.entries(CLR).map(([k,v])=>(<div key={k} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",marginBottom:4,background:dark?"#0e1019":"#f5f6f9",borderRadius:8,border:`1px solid ${dark?"#1a1d2e":"#eceef3"}`}}>
      <div style={{width:28,height:28,borderRadius:6,background:v.bg,flexShrink:0}}/>
      {ek===k?(<div style={{flex:1,display:"flex",gap:4,alignItems:"center",flexWrap:"wrap"}}>
        <input value={el} onChange={e=>setEl(e.target.value)} style={{...S.inp,flex:1,minWidth:60,height:30,fontSize:12,padding:"2px 6px"}} placeholder="Label"/>
        <input type="color" value={eh} onChange={e=>setEh(e.target.value)} style={{width:30,height:30,border:"none",padding:0,cursor:"pointer",borderRadius:4}}/>
        <button onClick={()=>{onEdit(k,el,eh);setEk(null)}} style={{...S.bSm(okC),height:30}}>✓</button>
        <button onClick={()=>setEk(null)} style={{...S.bSm(dark?"#333":"#ddd",tx),height:30}}>✕</button>
      </div>):cd===k?(<div style={{flex:1,display:"flex",gap:4,alignItems:"center"}}>
        <span style={{fontSize:12,fontWeight:800,color:dnC}}>Delete {v.lb}?</span><div style={{flex:1}}/>
        <button onClick={()=>{onDel(k);setCd(null)}} style={{...S.bSm(dnC),height:28}}>Yes</button>
        <button onClick={()=>setCd(null)} style={{...S.bSm(dark?"#333":"#ddd",tx),height:28}}>No</button>
      </div>):(<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div><div style={{fontWeight:900,fontSize:13}}>{v.lb}</div><div style={{fontSize:10,color:txd}}>{k} · {v.bg}</div></div>
        <div style={{display:"flex",gap:4}}>
          <button onClick={()=>{setEk(k);setEl(v.lb);setEh(v.bg)}} style={S.iBtn}>✏️</button>
          {k!=="universal"&&<button onClick={()=>setCd(k)} style={{...S.iBtn,color:dnC+"aa"}}>🗑️</button>}
        </div>
      </div>)}
    </div>))}
    <div style={{marginTop:12,padding:"12px",background:dark?"#0e1019":"#f5f6f9",borderRadius:10,border:`1px solid ${dark?"#1a1d2e":"#eceef3"}`}}>
      <div style={{fontSize:11,fontWeight:900,color:acc,marginBottom:6}}>+ ADD COLOR</div>
      <div style={{display:"flex",gap:4,marginBottom:6}}>
        <input placeholder="Key (green)" value={nk} onChange={e=>setNk(e.target.value.toLowerCase().replace(/[^a-z0-9]/g,""))} style={{...S.inp,flex:1,height:34,fontSize:12}}/>
        <input placeholder="Label" value={nl} onChange={e=>setNl(e.target.value)} style={{...S.inp,flex:1,height:34,fontSize:12}}/>
        <input type="color" value={nh} onChange={e=>setNh(e.target.value)} style={{width:34,height:34,border:"none",padding:0,cursor:"pointer",borderRadius:6}}/>
      </div>
      <button onClick={()=>{if(!nk||!nl){toast("Fill both","err");return}if(CLR[nk]){toast("Exists","err");return}onAdd(nk,nl,nh);setNk("");setNl("")}} disabled={!nk||!nl} style={{...S.btn(okC),width:"100%",height:36,borderRadius:8,opacity:(!nk||!nl)?.5:1}}>Add Color</button>
    </div>
  </div>);
}

function MgrProducts({PRODUCTS,PARTS,onAdd,onEdit,onDel,theme,toast}){
  const{dark,tx,txd,acc,okC,dnC,S}=theme;
  const[nn,setNn]=useState("");const[ni,setNi]=useState("📦");
  const[ek,setEk]=useState(null);const[en,setEn]=useState("");const[ei,setEi]=useState("");
  const[cd,setCd]=useState(null);
  return(<div>
    <div style={{fontSize:12,fontWeight:800,color:txd,marginBottom:8}}>Each product = a tab. Add new products here.</div>
    {Object.entries(PRODUCTS).map(([k,v])=>(<div key={k} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",marginBottom:4,background:dark?"#0e1019":"#f5f6f9",borderRadius:8,border:`1px solid ${dark?"#1a1d2e":"#eceef3"}`}}>
      <span style={{fontSize:22}}>{v.icon}</span>
      {ek===k?(<div style={{flex:1,display:"flex",gap:4,alignItems:"center",flexWrap:"wrap"}}>
        <input value={en} onChange={e=>setEn(e.target.value)} style={{...S.inp,flex:1,minWidth:60,height:30,fontSize:12,padding:"2px 6px"}}/>
        <input value={ei} onChange={e=>setEi(e.target.value)} style={{...S.inp,width:40,height:30,fontSize:16,textAlign:"center",padding:"2px"}}/>
        <button onClick={()=>{onEdit(k,en,ei);setEk(null)}} style={{...S.bSm(okC),height:30}}>✓</button>
        <button onClick={()=>setEk(null)} style={{...S.bSm(dark?"#333":"#ddd",tx),height:30}}>✕</button>
      </div>):cd===k?(<div style={{flex:1,display:"flex",gap:4,alignItems:"center"}}>
        <span style={{fontSize:12,fontWeight:800,color:dnC}}>Delete {v.name} + parts?</span><div style={{flex:1}}/>
        <button onClick={()=>{onDel(k);setCd(null)}} style={{...S.bSm(dnC),height:28}}>Yes</button>
        <button onClick={()=>setCd(null)} style={{...S.bSm(dark?"#333":"#ddd",tx),height:28}}>No</button>
      </div>):(<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div><div style={{fontWeight:900,fontSize:14}}>{v.name}</div><div style={{fontSize:10,color:txd}}>{PARTS.filter(p=>p.p===k).length} parts</div></div>
        <div style={{display:"flex",gap:4}}>
          <button onClick={()=>{setEk(k);setEn(v.name);setEi(v.icon)}} style={S.iBtn}>✏️</button>
          <button onClick={()=>setCd(k)} style={{...S.iBtn,color:dnC+"aa"}}>🗑️</button>
        </div>
      </div>)}
    </div>))}
    <div style={{marginTop:12,padding:"12px",background:dark?"#0e1019":"#f5f6f9",borderRadius:10,border:`1px solid ${dark?"#1a1d2e":"#eceef3"}`}}>
      <div style={{fontSize:11,fontWeight:900,color:acc,marginBottom:6}}>+ ADD PRODUCT</div>
      <div style={{display:"flex",gap:4,marginBottom:6}}>
        <input placeholder="Name (Sparkle)" value={nn} onChange={e=>setNn(e.target.value)} style={{...S.inp,flex:1,height:34,fontSize:12}}/>
        <input placeholder="Icon" value={ni} onChange={e=>setNi(e.target.value)} style={{...S.inp,width:50,height:34,fontSize:16,textAlign:"center",padding:"2px"}}/>
      </div>
      <button onClick={()=>{if(!nn){toast("Enter name","err");return}const key=nn.toLowerCase().replace(/[^a-z0-9]/g,"");if(PRODUCTS[key]){toast("Exists","err");return}onAdd(key,nn,ni);setNn("");setNi("📦")}} disabled={!nn} style={{...S.btn(okC),width:"100%",height:36,borderRadius:8,opacity:!nn?.5:1}}>Add Product</button>
    </div>
  </div>);
}

      <div style={{fontSize:10,fontWeight:900,color:txd,marginBottom:4}}>COLORS:</div>

function MgrSubAsm({PRODUCTS,PARTS,CROSS,SUBASM,CLR,onAdd,onEdit,onDel,theme,toast}){
  const{dark,tx,txd,acc,okC,dnC,cb,S}=theme;
  const[sp,setSp]=useState(Object.keys(PRODUCTS)[0]||"");
  const[nn,setNn]=useState("");const[nc,setNc]=useState([]);const[ncomp,setNcomp]=useState([]);const[np,setNp]=useState(1);
  const[eid,setEid]=useState(null);const[en,setEn]=useState("");const[ec,setEc]=useState([]);const[ecomp,setEcomp]=useState([]);const[ep,setEp]=useState(1);
  const[cd,setCd]=useState(null);
  const ck=Object.keys(CLR);
  const tg=(a,s,c)=>a.includes(c)?s(a.filter(x=>x!==c)):s([...a,c]);
  const sa=SUBASM.filter(s=>s.p===sp);
  const availParts=[...PARTS.filter(p=>p.p===sp),...CROSS.filter(cp=>cp.products&&cp.products.includes(sp))];
  useEffect(()=>{if(!PRODUCTS[sp]){const k=Object.keys(PRODUCTS)[0];if(k)setSp(k)}},[PRODUCTS,sp]);
  const toggleComp=(arr,setArr,partId,part,colors)=>{
    const idx=arr.findIndex(x=>x.partId===partId);
    if(idx>=0)setArr(arr.filter(x=>x.partId!==partId));
    else{
      const cm={};
      if(part.c.length===1){(colors||[]).forEach(v=>cm[v]=part.c[0])}
      setArr([...arr,{partId,per:1,colorMap:cm}]);
    }
  };
  const setCompPer=(arr,setArr,partId,per)=>{
    setArr(arr.map(x=>x.partId===partId?{...x,per:parseInt(per)||1}:x));
  };
  const setCompVarColor=(arr,setArr,partId,variant,color)=>{
    setArr(arr.map(x=>{
      if(x.partId!==partId)return x;
      const cm={...(x.colorMap||{})};
      if(color)cm[variant]=color;else delete cm[variant];
      return{...x,colorMap:cm};
    }));
  };
  const renderCompColors=(comp,part,colors,arr,setArr)=>{
    if(!comp||!colors||colors.length===0)return null;
    const cm=comp.colorMap||{};
    return(<div style={{display:"flex",gap:3,flexWrap:"wrap",marginTop:3}} onClick={e=>e.stopPropagation()}>
      {colors.map(v=>{
        const val=cm[v]||comp.color||"";
        return(<div key={v} style={{display:"flex",alignItems:"center",gap:2,background:dark?"#0d0f18":"#f0f1f4",borderRadius:4,padding:"1px 4px"}}>
          <span style={{fontSize:8,fontWeight:900,color:CLR[v]?.bg||txd,minWidth:28}}>{CLR[v]?.lb||v}:</span>
          <select value={val} onChange={e=>setCompVarColor(arr,setArr,comp.partId,v,e.target.value)} style={{...S.inp,width:"auto",minWidth:50,height:20,fontSize:9,padding:"0 2px",border:"none",background:"transparent",color:tx}}>
            <option value="">Auto</option>
            {part.c.map(c=><option key={c} value={c}>{CLR[c]?.lb||c}</option>)}
          </select>
        </div>);
      })}
    </div>);
  };
  const compSummary=(s)=>s.components.map(comp=>{
    const pt=availParts.find(p=>p.id===comp.partId);if(!pt)return"-";
    const cm=comp.colorMap||{};
    const entries=Object.entries(cm);
    const mapped=entries.length>0?entries.map(([v,c])=>`${CLR[v]?.lb||v}\u2192${CLR[c]?.lb||c}`).join(", "):"";
    return pt.n+(mapped?` [${mapped}]`:(comp.color?` [${CLR[comp.color]?.lb||comp.color}]`:" [Auto]"))+(comp.per>1?` \u00d7${comp.per}`:"");
  }).join(", ");
  return(<div>
    <div style={{fontSize:12,fontWeight:800,color:txd,marginBottom:8}}>Sub-assemblies are assembled from parts first, then used in final product assembly.</div>
    <div style={{display:"flex",gap:4,marginBottom:10,overflowX:"auto",paddingBottom:4}}>
      {Object.entries(PRODUCTS).map(([k,v])=>(<button key={k} onClick={()=>setSp(k)} style={{...S.btn(sp===k?acc:"transparent",sp===k?"#fff":txd),padding:"5px 12px",fontSize:12,border:`1px solid ${sp===k?acc:cb}`,whiteSpace:"nowrap"}}>{v.icon} {v.name}</button>))}
    </div>
    {sa.map(s=>(<div key={s.id} style={{padding:"8px 10px",marginBottom:4,background:dark?"#0e1019":"#f5f6f9",borderRadius:8,border:`1px solid ${dark?"#1a1d2e":"#eceef3"}`}}>
      {eid===s.id?(<div>
        <input value={en} onChange={e=>setEn(e.target.value)} style={{...S.inp,marginBottom:6,height:32,fontSize:12}} placeholder="Name"/>
        <div style={{fontSize:10,fontWeight:900,color:txd,marginBottom:4}}>COLORS:</div>
        <div style={{display:"flex",gap:3,flexWrap:"wrap",marginBottom:6}}>{ck.map(c=>(<button key={c} onClick={()=>tg(ec,setEc,c)} style={{...S.bSm(ec.includes(c)?CLR[c]?.bg||"#888":"transparent",ec.includes(c)?"#fff":CLR[c]?.bg||"#888"),border:`1.5px solid ${CLR[c]?.bg||"#888"}`,padding:"3px 8px",fontSize:10}}>{CLR[c]?.lb||c}</button>))}</div>
        <div style={{fontSize:10,fontWeight:900,color:txd,marginBottom:4}}>COMPONENT PARTS (set color per variant):</div>
        {availParts.map(p=>{const sel=ecomp.find(x=>x.partId===p.id);return(<div key={p.id} style={{marginBottom:3,padding:"4px 6px",background:sel?(dark?"#1a2235":"#e8f0ff"):(dark?"#0a0c14":"#fff"),borderRadius:6,border:`1px solid ${sel?(acc+"44"):(dark?"#1a1d2e":"#eceef3")}`,cursor:"pointer"}} onClick={()=>toggleComp(ecomp,setEcomp,p.id,p,ec)}>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <span style={{fontSize:14}}>{sel?"✅":"⬜"}</span>
            <span style={{flex:1,fontSize:12,fontWeight:700}}>{p.n}</span>
            {sel&&<input type="number" value={sel.per} onChange={e=>{e.stopPropagation();setCompPer(ecomp,setEcomp,p.id,e.target.value)}} onClick={e=>e.stopPropagation()} style={{...S.inp,width:36,height:24,fontSize:11,textAlign:"center",padding:"1px"}}/>}
          </div>
          {sel&&renderCompColors(sel,p,ec,ecomp,setEcomp)}
        </div>)})
        }
        <div style={{display:"flex",gap:4,alignItems:"center",marginTop:6}}><span style={{fontSize:11,color:txd,fontWeight:800}}>Per product:</span>

// ═══  BOM EDITOR COMPONENT (NEW)  ═══
// ═══════════════════════════════════════
function BomEditor({pid,variantKey,profile,PRODUCTS,PARTS,CROSS,SUBASM,CLR,onSave,onClose,theme}){
  const{dark,tx,txd,acc,okC,dnC,cb,S}=theme;
  const subs=(SUBASM||[]).filter(s=>s.p===pid).map(s=>({...s,_isSub:true}));
  // Get parts consumed by sub-assemblies
  const saPartIds=new Set();subs.forEach(s=>(s.components||[]).forEach(c=>saPartIds.add(c.partId)));
  // Filter out parts used in sub-assemblies — only show direct parts + sub-assemblies
  const rawParts=[...PARTS.filter(p=>p.p===pid),...CROSS.filter(cp=>cp.products&&cp.products.includes(pid))];
  const directParts=rawParts.filter(p=>!saPartIds.has(p.id));
  const parts=[...directParts,...subs];
  const allColorKeys=Object.keys(CLR);
  
  // Variant color = the "base" color key for this variant
  const[baseColor,setBaseColor]=useState(variantKey||"");
  const[mapping,setMapping]=useState(()=>{
    if(profile)return{...profile};
    // Auto-fill
    const m={};
    parts.forEach(p=>{
      if(p.c.length===1){m[p.id]=p.c[0]}
      else if(variantKey&&p.c.includes(variantKey)){m[p.id]=variantKey}
      else{m[p.id]=p.c[0]||""}
    });
    return m;
  });
  // Track which parts are skipped (not deducted during assembly)
  const[skipped,setSkipped]=useState(()=>{
    if(!profile)return{};
    const sk={};
    Object.entries(profile).forEach(([k,v])=>{if(v==="_skip")sk[k]=true});
    return sk;
  });

  // When base color changes, re-auto-fill parts that match
  const changeBase=(newBase)=>{
    setBaseColor(newBase);
    setMapping(prev=>{
      const m={...prev};
      parts.forEach(p=>{
        if(skipped[p.id])return; // don't touch skipped parts
        if(p.c.length===1){m[p.id]=p.c[0]}
        else if(p.c.includes(newBase)){m[p.id]=newBase}
        // Keep existing override if part doesn't have new base
      });
      return m;
    });
  };

  const setPartColor=(partId,color)=>setMapping(m=>({...m,[partId]:color}));
  const toggleSkip=(partId,part)=>{
    setSkipped(sk=>{
      const ns={...sk};
      if(ns[partId]){delete ns[partId];/* restore a default color */setMapping(m=>{const nm={...m};if(part.c.includes(baseColor))nm[partId]=baseColor;else nm[partId]=part.c[0]||"";return nm})}
      else{ns[partId]=true;setMapping(m=>({...m,[partId]:"_skip"}))}
      return ns;
    });
  };

  // Get variant-eligible colors (colors used by colored parts of this product)
  const variantColors=useMemo(()=>{
    const s=new Set();
    parts.forEach(p=>p.c.forEach(c=>{if(c!=="universal"&&c!=="black"&&c!=="abs"&&c!=="purecrystal"&&c!=="orangecrystal"&&c!=="random"&&c!=="white")s.add(c)}));
    return[...s];
  },[parts]);

  const canSave=baseColor&&parts.every(p=>skipped[p.id]||mapping[p.id]);

  const handleSave=()=>{
    if(!canSave)return;
    // Build final mapping, marking skipped parts as "_skip"
    const finalMapping={...mapping};
    Object.keys(skipped).forEach(k=>{if(skipped[k])finalMapping[k]="_skip"});
    onSave(pid,baseColor,finalMapping);
  };

  return(<div>
    <div style={{fontSize:12,fontWeight:800,color:txd,marginBottom:10}}>
      Define which color each part uses for the <strong>{CLR[baseColor]?.lb||baseColor||"?"}</strong> variant of <strong>{PRODUCTS[pid]?.name}</strong>.
    </div>

    {/* Info about hidden sub-assembly parts */}
    {saPartIds.size>0&&<div style={{fontSize:11,fontWeight:700,color:"#f59e0b",marginBottom:10,padding:"6px 10px",background:"#f59e0b11",borderRadius:8,border:"1px solid #f59e0b22"}}>
      ⚠️ {saPartIds.size} part{saPartIds.size>1?"s":""} used in sub-assemblies {saPartIds.size>1?"are":"is"} hidden (managed via sub-assembly).
    </div>}

    <div style={{marginBottom:14}}>
      <div style={{fontSize:10,fontWeight:900,color:acc,marginBottom:6}}>VARIANT BASE COLOR</div>
      <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
        {variantColors.map(c=>(<button key={c} onClick={()=>changeBase(c)} style={{...S.btn(baseColor===c?CLR[c]?.bg||"#888":"transparent",baseColor===c?"#fff":CLR[c]?.bg||"#888"),border:`2px solid ${CLR[c]?.bg||"#888"}`,padding:"6px 10px",fontSize:11}}>{CLR[c]?.lb||c}</button>))}
        {/* Allow custom variant key */}
        {allColorKeys.filter(c=>!variantColors.includes(c)&&c!=="universal").length>0&&(
          <select value={variantColors.includes(baseColor)?"":(baseColor||"")} onChange={e=>{if(e.target.value)changeBase(e.target.value)}} style={{...S.inp,width:"auto",height:34,fontSize:11,padding:"4px 8px"}}>
            <option value="">More...</option>
            {allColorKeys.filter(c=>!variantColors.includes(c)&&c!=="universal").map(c=>(
              <option key={c} value={c}>{CLR[c]?.lb||c}</option>
            ))}
          </select>
        )}
      </div>
    </div>

    <div style={{fontSize:10,fontWeight:900,color:acc,marginBottom:6}}>PART → COLOR MAPPING</div>
    <div style={{maxHeight:"45vh",overflowY:"auto",marginBottom:12}}>
      {parts.map(p=>{
        const isSkip=!!skipped[p.id];
        const cur=isSkip?"":mapping[p.id]||"";
        const isOverride=!isSkip&&cur&&cur!=="_skip"&&cur!==baseColor&&p.c.length>1&&p.c.includes(baseColor);
        return(
          <div key={p.id} style={{padding:"8px 10px",marginBottom:3,background:isSkip?(dark?"#1a1018":"#fef2f2"):(dark?"#0e1019":"#f5f6f9"),borderRadius:8,border:`1px solid ${isSkip?(dnC+"33"):isOverride?(dnC+"55"):(dark?"#1a1d2e":"#eceef3")}`,opacity:isSkip?.6:1}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:isSkip?0:4}}>
              <span style={{fontWeight:800,fontSize:12,flex:1,textDecoration:isSkip?"line-through":"none"}}>{p.n}</span>
              {p.products&&<span style={{fontSize:9,background:acc+"22",color:acc,padding:"1px 5px",borderRadius:4,fontWeight:800}}>CROSS</span>}
              {p._isSub&&<span style={{fontSize:9,background:"#f59e0b22",color:"#f59e0b",padding:"1px 5px",borderRadius:4,fontWeight:800}}>SUB-ASSY</span>}
              {isOverride&&<span style={{fontSize:9,background:dnC+"22",color:dnC,padding:"1px 5px",borderRadius:4,fontWeight:800,marginLeft:4}}>OVERRIDE</span>}
              <button onClick={(e)=>{e.stopPropagation();toggleSkip(p.id,p)}} style={{...S.bSm(isSkip?dnC+"22":dark?"#1a1d2e":"#eee",isSkip?dnC:txd),border:`1px solid ${isSkip?dnC+"44":cb}`,fontSize:9,padding:"2px 6px",marginLeft:4}} title={isSkip?"Include this part":"Skip this part (won't deduct)"}>{isSkip?"🚫 Skipped":"Skip"}</button>
            </div>
            {!isSkip&&<div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
              {p.c.map(c=>(<button key={c} onClick={()=>setPartColor(p.id,c)} style={{
                ...S.bSm(cur===c?CLR[c]?.bg||"#888":"transparent",cur===c?"#fff":CLR[c]?.bg||"#888"),
                border:`1.5px solid ${CLR[c]?.bg||"#888"}`,padding:"3px 8px",fontSize:10,
                opacity:cur===c?1:.6
              }}>{CLR[c]?.lb||c}</button>))}
            </div>}
          </div>
        );
      })}
    </div>

    <div style={{display:"flex",gap:8}}>
      <button onClick={onClose} style={{...S.btn(dark?"#252836":"#e0e3ea",tx),flex:1,height:40,borderRadius:10}}>Cancel</button>
      <button onClick={handleSave} disabled={!canSave} style={{...S.btn(okC),flex:1,height:40,borderRadius:10,opacity:canSave?1:.5}}>💾 Save Recipe</button>
    </div>
  </div>);
}

function App(){
  const[dark,setDark]=useState(()=>{const s=localStorage.getItem(THEME_KEY);return s!==null?JSON.parse(s):true});
  
  const[CLR,setCLR]=useState(DEF_COLORS);
  const[PRODUCTS,setProducts]=useState(DEF_PRODUCTS);
  const[PARTS,setParts]=useState(DEF_PARTS);
  const[CROSS,setCross]=useState(DEF_CROSS);
  const[asmRules,setAsmRules]=useState(DEF_ASM);
  const[bomProfiles,setBomProfiles]=useState(DEF_BOM);
  const[SUBASM,setSubAsm]=useState(DEF_SUBASM);
  
  const[mainTab,setMainTab]=useState("dash");
  const[prodTab,setProdTab]=useState("sprinter");
  const[bomTab,setBomTab]=useState("sprinter");
  const[stock,setStock]=useState({});
  const[logs,setLogs]=useState([]);
  const[confirmed,setConfirmed]=useState({});
  const[notes,setNotes]=useState("");
  const[productNotes,setProductNotes]=useState({});
  const[threshold,setThreshold]=useState(600);
  const[productThresholds,setProductThresholds]=useState({});
  const[loaded,setLoaded]=useState(false);
  const[syncing,setSyncing]=useState(false);
  const[dirty,setDirty]=useState(false);
  const[connectionOk,setConnectionOk]=useState(true);
  const[lastSync,setLastSync]=useState(null);
  const[toast,setToast]=useState(null);
  const[toastAnim,setToastAnim]=useState("enter");
  const[editing,setEditing]=useState(null);
  const[editVal,setEditVal]=useState("");
  const[asmColor,setAsmColor]=useState({});
  const[asmQty,setAsmQty]=useState({});
  const[confirmAsm,setConfirmAsm]=useState(null);
  const[showClear,setShowClear]=useState(null);
  const[logFilter,setLogFilter]=useState("all");
  const[stockFilter,setStockFilter]=useState("all");
  const[editLogId,setEditLogId]=useState(null);
  const[editLogText,setEditLogText]=useState("");
  const[confirmUndo,setConfirmUndo]=useState(null);
  const[partAdjust,setPartAdjust]=useState({});
  const[searchQuery,setSearchQuery]=useState("");
  const[showManage,setShowManage]=useState(null);
  const[bomEditing,setBomEditing]=useState(null); // {pid, variantKey, profile}
  const[bomExpanded,setBomExpanded]=useState({});
  const[stockVerify,setStockVerify]=useState(false);
  const[dashExpanded,setDashExpanded]=useState({});
  const[showBomModal,setShowBomModal]=useState(false);
  const[saColor,setSaColor]=useState({});
  const[saQty,setSaQty]=useState({});
  const[confirmSaBuild,setConfirmSaBuild]=useState(null); // {saId, color, qty}

  const toastTimerRef=useRef(null);const notesRef=useRef(null);const productNotesRef=useRef({});
  const dirtyRef=useRef(false);const modalOpenRef=useRef(false);
  useEffect(()=>{modalOpenRef.current=!!showManage||!!bomEditing||showBomModal},[showManage,bomEditing,showBomModal,SUBASM]);
  useEffect(()=>{localStorage.setItem(THEME_KEY,JSON.stringify(dark))},[dark]);

  const allParts=useMemo(()=>[...PARTS,...CROSS],[PARTS,CROSS]);
  const allItems=useMemo(()=>[...PARTS,...CROSS,...SUBASM],[PARTS,CROSS,SUBASM]);
  // Get product parts (raw parts only, no sub-assemblies)
  const getProductParts=useCallback(pid=>[...PARTS.filter(p=>p.p===pid),...CROSS.filter(cp=>cp.products&&cp.products.includes(pid))],[PARTS,CROSS]);
  // Get sub-assemblies for a product
  const getProductSubAsm=useCallback(pid=>SUBASM.filter(s=>s.p===pid),[SUBASM]);
  // Get parts that are NOT consumed by any sub-assembly (direct parts for final assembly)
  const getDirectParts=useCallback(pid=>{
    const sa=SUBASM.filter(s=>s.p===pid);
    const saPartIds=new Set();sa.forEach(s=>s.components.forEach(c=>saPartIds.add(c.partId)));
    return getProductParts(pid).filter(p=>!saPartIds.has(p.id));
  },[SUBASM,getProductParts]);
  // Get all things needed for final assembly: direct parts + sub-assemblies (as virtual parts)
  const getAsmRequirements=useCallback(pid=>{
    const direct=getDirectParts(pid);
    const subs=getProductSubAsm(pid).map(s=>({...s,_isSub:true}));
    return[...direct,...subs];
  },[getDirectParts,getProductSubAsm]);
  
  // ═══ BOM-AWARE COLOR RESOLUTION ═══
  const getPartColorForAsm=useCallback((part,color,pid)=>{
    // First check BOM profile
    const bp=bomProfiles[pid]?.[color];
    if(bp&&bp[part.id]){
      if(bp[part.id]==="_skip")return "_skip"; // part is skipped
      return bp[part.id];
    }
    // Fallback: original logic
    if(part.c.length===1)return part.c[0];
    if(part.c.includes(color))return color;
    const r=asmRules[pid];
    if(r&&r[color]){for(const[,to]of Object.entries(r[color])){if(part.c.includes(to))return to}}
    return null;
  },[asmRules,bomProfiles]);

  const getAsmColors=useCallback(pid=>{
    const dp=getDirectParts(pid); // only direct parts (sub-assembly-consumed parts excluded)
    const sa=getProductSubAsm(pid);
    // If BOM profiles exist, those are the assemblable variants
    const bpKeys=Object.keys(bomProfiles[pid]||{});
    if(bpKeys.length>0){
      // Only allow colors that have complete BOM profiles (direct parts + sub-assemblies)
      return bpKeys.filter(c=>{
        const bp=bomProfiles[pid][c];
        const partsOk=dp.every(p=>bp[p.id]==="_skip"||( bp[p.id]&&p.c.includes(bp[p.id]) ));
        const subsOk=sa.every(s=>!bp[s.id]||bp[s.id]==="_skip"||s.c.includes(bp[s.id]));
        return partsOk&&subsOk;
      });
    }
    // Fallback: old auto-detect
    const pp=getProductParts(pid);
    const ac=new Set();
    pp.forEach(p=>p.c.forEach(c=>{if(c!=="universal"&&c!=="black"&&c!=="abs"&&c!=="purecrystal"&&c!=="orangecrystal"&&c!=="random"&&c!=="white")ac.add(c)}));
    return[...ac].filter(c=>pp.every(p=>getPartColorForAsm(p,c,pid)!==null));
  },[getDirectParts,getProductParts,getProductSubAsm,getPartColorForAsm,bomProfiles]);

  const calcMax=useCallback((pid,color,stk)=>{
    const reqs=getAsmRequirements(pid);let m=Infinity;
    for(const p of reqs){
      if(p._isSub){
        const sc=getPartColorForAsm(p,color,pid)||color;
        if(sc==="_skip")continue; // skipped part
        const saStk=stk[p.id]?.[sc]||0;
        m=Math.min(m,Math.floor(saStk/(p.per||1)));
      } else {
        const mp=getPartColorForAsm(p,color,pid);
        if(mp==="_skip")continue; // skipped part
        if(!mp)return 0;
        m=Math.min(m,Math.floor((stk[p.id]?.[mp]||0)/(p.per||1)));
      }
    }
    return m===Infinity?0:m;
  },[getAsmRequirements,getPartColorForAsm]);
  // Calculate max sub-assemblies buildable
  const calcSubAsmMax=useCallback((sa,color,stk)=>{
    let m=Infinity;
    for(const comp of sa.components){
      const part=allParts.find(p=>p.id===comp.partId);
      if(!part)return 0;
      const mc=(comp.colorMap&&comp.colorMap[color])||comp.color||( part.c.includes(color)?color:(part.c.length===1?part.c[0]:null) );
      if(!mc)return 0;
      m=Math.min(m,Math.floor((stk[comp.partId]?.[mc]||0)/(comp.per||1)));
    }
    return m===Infinity?0:m;
  },[allParts]);

  const showToast=useCallback((msg,type="ok")=>{clearTimeout(toastTimerRef.current);setToastAnim("enter");setToast({msg,type});toastTimerRef.current=setTimeout(()=>{setToastAnim("exit");setTimeout(()=>setToast(null),250)},2200)},[]);

  const serialize=useCallback(()=>({stock,logs:logs.slice(0,2000),confirmed,notes,productNotes,productThresholds,threshold,colors:CLR,products:PRODUCTS,parts:PARTS,crossParts:CROSS,asmRules,bomProfiles,subAssemblies:SUBASM,updatedAt:Date.now()}),[stock,logs,confirmed,notes,productNotes,productThresholds,threshold,CLR,PRODUCTS,PARTS,CROSS,asmRules,bomProfiles,SUBASM]);
  const serializeRef=useRef(serialize);serializeRef.current=serialize;

  const loadData=useCallback((d)=>{
    if(d.colors)setCLR(p=>({...DEF_COLORS,...d.colors}));
    if(d.products)setProducts(d.products);if(d.parts)setParts(d.parts);
    if(d.crossParts!==undefined)setCross(d.crossParts||[]);if(d.asmRules)setAsmRules(d.asmRules||{});
    if(d.bomProfiles!==undefined)setBomProfiles(d.bomProfiles||{});
    if(d.subAssemblies!==undefined)setSubAsm(d.subAssemblies||[]);
    const ap=[...(d.parts||DEF_PARTS),...(d.crossParts||DEF_CROSS)];
    const saList=d.subAssemblies||[];
    const mg={};ap.forEach(p=>{mg[p.id]={};p.c.forEach(c=>{mg[p.id][c]=0})});
    saList.forEach(s=>{mg[s.id]={};s.c.forEach(c=>{mg[s.id][c]=0})});
    Object.keys(d.stock||{}).forEach(k=>{if(mg[k]||ap.find(p=>p.id===k)||saList.find(s=>s.id===k))mg[k]={...(mg[k]||{}),...d.stock[k]}});
    setStock(mg);setLogs(d.logs||[]);setConfirmed(d.confirmed||{});
    if(d.threshold)setThreshold(d.threshold);if(d.productThresholds)setProductThresholds(d.productThresholds);
    if(d.notes!=null)setNotes(d.notes);if(d.productNotes)setProductNotes(d.productNotes);
    return mg;
  },[]);

  // --- FIREBASE PULL ---
  const pullCloud=useCallback(async()=>{

    {/* BOM Editor Modal */}
    <Modal show={!!bomEditing} onClose={()=>{setBomEditing(null);setShowBomModal(true)}} title={`📋 ${bomEditing?((bomEditing.variantKey?'Edit':'New')+' Recipe — '+(PRODUCTS[bomEditing.pid]?.name||'')):''}`} theme={theme}>
      {bomEditing&&<BomEditor pid={bomEditing.pid} variantKey={bomEditing.variantKey} profile={bomEditing.profile} PRODUCTS={PRODUCTS} PARTS={PARTS} CROSS={CROSS} SUBASM={SUBASM} CLR={CLR} onSave={(pid,vk,mapping)=>{saveBomProfile(pid,vk,mapping);setShowBomModal(true)}} onClose={()=>{setBomEditing(null);setShowBomModal(true)}} theme={theme}/>}
    </Modal>

    {/* BOM Manager Modal (from Settings) */}
    <Modal show={showBomModal} onClose={()=>setShowBomModal(false)} title="📋 BOM / Recipes" theme={theme}>
      <div style={{margin:"-8px -8px 0"}}>
        <div style={{display:"flex",gap:0,overflowX:"auto",borderBottom:`1px solid ${cb}`,marginBottom:10}}>
          {Object.keys(PRODUCTS).map(pid=>(<button key={pid} onClick={()=>setBomTab(pid)} style={{padding:"8px 10px",whiteSpace:"nowrap",background:"none",border:"none",borderBottom:bomTab===pid?`2.5px solid ${acc}`:"2.5px solid transparent",color:bomTab===pid?acc:txd,fontSize:12,fontWeight:bomTab===pid?900:700,fontFamily:"'Nunito',sans-serif",cursor:"pointer",display:"flex",alignItems:"center",gap:4}}><span style={{fontSize:13}}>{PRODUCTS[pid].icon}</span>{PRODUCTS[pid].name}</button>))}
        </div>
        {renderBom()}
      </div>
    </Modal>

    <Modal show={showManage==="colors"} onClose={()=>setShowManage(null)} title="🎨 Colors" theme={theme}><MgrColors CLR={CLR} onAdd={addColor} onEdit={editColor} onDel={deleteColor} theme={theme} toast={showToast}/></Modal>
    <Modal show={showManage==="products"} onClose={()=>setShowManage(null)} title="📦 Products" theme={theme}><MgrProducts PRODUCTS={PRODUCTS} PARTS={PARTS} onAdd={addProduct} onEdit={editProduct} onDel={deleteProduct} theme={theme} toast={showToast}/></Modal>
    <Modal show={showManage==="parts"} onClose={()=>setShowManage(null)} title="🔩 Parts" theme={theme}><MgrParts PRODUCTS={PRODUCTS} PARTS={PARTS} CLR={CLR} onAdd={addPart} onEdit={editPart} onDel={deletePart} theme={theme} toast={showToast}/></Modal>
    <Modal show={showManage==="links"} onClose={()=>setShowManage(null)} title="🔗 Cross-Links" theme={theme}><MgrCross PRODUCTS={PRODUCTS} CROSS={CROSS} CLR={CLR} onAdd={addCross} onEdit={editCross} onDel={deleteCross} theme={theme} toast={showToast}/></Modal>
    <Modal show={showManage==="subasm"} onClose={()=>setShowManage(null)} title="🔧 Sub-Assemblies" theme={theme}><MgrSubAsm PRODUCTS={PRODUCTS} PARTS={PARTS} CROSS={CROSS} SUBASM={SUBASM} CLR={CLR} onAdd={addSubAsm} onEdit={editSubAsm} onDel={deleteSubAsm} theme={theme} toast={showToast}/></Modal>

    <div style={{background:dark?"#0d0f18ee":"#ffffffee",borderBottom:`1px solid ${dark?"#1a1d2e":"#e0e3ea"}`,position:"sticky",top:0,zIndex:95,backdropFilter:"blur(16px)"}}>
      <div style={{padding:"6px 12px",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:`1px solid ${dark?"#ffffff08":"#00000008"}`}}>
        <div style={{display:"flex",alignItems:"center"}}><SDot syncing={syncing} dirty={dirty} okC={okC} wnC={wnC} acc={acc}/><span style={{fontSize:11,fontWeight:800,color:syncing?acc:dirty?wnC:okC,letterSpacing:.5}}>{syncing?"SYNCING":dirty?"SAVING":"SYNCED"}</span></div>
        <button onClick={()=>pushCloud()} disabled={syncing||!dirty} style={{...S.bSm(dirty?wnC+"22":acc+"15",dirty?wnC:acc),padding:"4px 12px",fontSize:11,opacity:(!dirty&&!syncing)?.4:1,border:`1px solid ${dirty?wnC+"44":acc+"33"}`,borderRadius:8}}>{syncing?"⏳":"☁️"} {dirty?"Save":"Synced"}</button>
      </div>
      <div style={{padding:"8px 12px 6px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{fontSize:17,fontWeight:900,display:"flex",alignItems:"center",gap:6}}>🏭 Little Star</div>
        <button onClick={()=>setDark(!dark)} style={{background:dark?"#ffffff10":"#0000000a",border:"none",color:txd,fontSize:16,cursor:"pointer",padding:"4px 8px",borderRadius:8}}>{dark?"☀️":"🌙"}</button>
      </div>
    </div>

    {/* Sub-nav for Assembly */}
    {mainTab==="products"&&(<div style={S.subNav}>{Object.keys(PRODUCTS).map(pid=>(<button key={pid} onClick={()=>{setProdTab(pid);setSearchQuery("")}} style={S.subNI(prodTab===pid)}><span style={{fontSize:13}}>{PRODUCTS[pid].icon}</span>{PRODUCTS[pid].name}</button>))}<button onClick={()=>{setProdTab("cross");setSearchQuery("")}} style={S.subNI(prodTab==="cross")}><span style={{fontSize:13}}>🔗</span>Cross</button></div>)}

    {/* Search bar */}
    {["products","stock"].includes(mainTab)&&(<div style={{padding:"8px 10px 0",position:"relative"}}><input type="text" placeholder="Search parts..." value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} style={{...S.inp,height:38,fontSize:13,fontWeight:700,paddingLeft:34}}/><span style={{position:"absolute",left:20,top:"50%",transform:"translateY(-30%)",fontSize:14,opacity:.5,pointerEvents:"none"}}>🔍</span>{searchQuery&&<span onClick={()=>setSearchQuery("")} style={{position:"absolute",right:20,top:"50%",transform:"translateY(-30%)",fontSize:16,cursor:"pointer",opacity:.5}}>✕</span>}</div>)}

    <div style={{paddingBottom:8}}>
      {mainTab==="dash"&&renderDash()}
      {mainTab==="products"&&prodTab!=="cross"&&PRODUCTS[prodTab]&&renderProd(prodTab)}
      {mainTab==="products"&&prodTab==="cross"&&renderCross()}
      {mainTab==="stock"&&renderStock()}
      {mainTab==="log"&&renderLog()}
      {mainTab==="settings"&&renderSettings()}
    </div>

    <nav style={S.nav}>{[{k:"dash",i:"📊",l:"Dash"},{k:"products",i:"🏭",l:"Assembly"},{k:"stock",i:"📦",l:"Stock"},{k:"log",i:"📝",l:"Logs"},{k:"settings",i:"⚙️",l:"Settings"}].map(n=>(<button key={n.k} onClick={()=>{setMainTab(n.k);setSearchQuery("")}} style={S.nI(mainTab===n.k)}>{mainTab===n.k&&<div style={{position:"absolute",top:-1,left:"25%",right:"25%",height:2.5,borderRadius:2,background:acc,boxShadow:`0 0 8px ${acc}66`}}/>}<span style={{fontSize:17,marginBottom:1}}>{n.i}</span>{n.l}</button>))}</nav>
  </div>);
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);

</script>
</body>
</html>
