const CROSS_PARTS=[
  {id:"cx_pipe",n:"Stroller & Tolo Pipe",c:["universal"],per:1,products:["stroller","tolo"]}
];

const ALL_PARTS=[...PARTS,...CROSS_PARTS];

function getProductParts(pid){
  const own=PARTS.filter(p=>p.p===pid);
  const cross=CROSS_PARTS.filter(cp=>cp.products.includes(pid));
  return[...own,...cross];
}

function getPartColorForAsm(part,asmColor){
  if(part.c.includes("universal"))return "universal";
  if(part.c.includes(asmColor))return asmColor;
  if(asmColor==="red"&&part.c.includes("darkblue"))return "darkblue";
  return null;
}

function getAssemblableColors(pid){
  const pp=getProductParts(pid);
  const allC=new Set();
  pp.forEach(p=>p.c.forEach(c=>{if(c!=="universal")allC.add(c)}));
  if(pid==="stroller"){
    return["pink","blue","red"].filter(color=>
      pp.every(p=>getPartColorForAsm(p,color)!==null)
    );
  }
  return[...allC].filter(color=>pp.every(p=>p.c.includes(color)||p.c.includes("universal")));
}

function initStock(){
  const s={};
  ALL_PARTS.forEach(p=>{s[p.id]={};p.c.forEach(c=>{s[p.id][c]=0})});
  return s;
}

function calcMax(pid,color,stock){
  const pp=getProductParts(pid);
  let m=Infinity;
  for(const p of pp){
    const mapped=getPartColorForAsm(p,color);
    if(!mapped)return 0;
    m=Math.min(m,Math.floor((stock[p.id]?.[mapped]||0)/(p.per||1)));
  }
  return m===Infinity?0:m;
}

function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function fmtTS(ts){
  const d=new Date(ts);
  const dd=String(d.getDate()).padStart(2,"0"),mm=String(d.getMonth()+1).padStart(2,"0"),yy=String(d.getFullYear()).slice(2);
  let h=d.getHours();const ap=h>=12?"PM":"AM";h=h%12||12;
  return`${dd}/${mm}/${yy} ${h}:${String(d.getMinutes()).padStart(2,"0")} ${ap}`;
}

function downloadFile(blob,filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},150);
}

function ColorBadge({color,size=16}){
  const c=CLR[color]||CLR.universal;
  return <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",minWidth:size*3.2,height:size*1.8,borderRadius:8,background:c.bg,color:c.fg,fontSize:size*0.9,fontWeight:900,letterSpacing:.5,padding:"0 10px",flexShrink:0}}>{c.lb}</span>;
}

function PartRow({part,showProduct,showConfirm,stock,confirmed,editing,editVal,partAdjust,
  onSetEditing,onSetEditVal,onSetPartAdjust,onSaveStock,onAdjustStock,onToggleConfirm,theme, threshold, itemThresholds}){
  
  // NOTE: Added 'card' here to fix the blank screen bug
  const{dark,tx,txd,acc,okC,dnC,cb,card,S}=theme;
  
  const s=stock[part.id]||{};
  const isConf=!!confirmed[part.id];
  const isCross=!!part.products;
  const activeThreshold = itemThresholds[part.id] !== undefined ? itemThresholds[part.id] : threshold;

  return(
    <div style={{...S.crd, padding: "16px 14px", border: isConf ? `2px solid ${okC}` : `1px solid ${cb}`, background: isConf ? (dark ? okC+"15" : okC+"08") : card}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
        {showConfirm&&<span onClick={()=>onToggleConfirm(part.id)} style={{cursor:"pointer",fontSize:28, flexShrink:0}}>{isConf?"✅":"⬜"}</span>}
        {isConf&&!showConfirm&&<span style={{fontSize:20, flexShrink:0}}>✅</span>}
        <div style={{flex: 1}}>
          <div style={{fontWeight:900,fontSize:18, lineHeight:1.2}}>{part.n}</div>
          <div style={{display:"flex",gap:8,marginTop:6,flexWrap:"wrap"}}>
            {isCross&&<span style={{fontSize:11,background:acc+"22",color:acc,padding:"3px 8px",borderRadius:8,fontWeight:800}}>CROSS</span>}
            {showProduct&&<span style={{fontSize:11,background:txd+"33",color:txd,padding:"3px 8px",borderRadius:8,fontWeight:800}}>{part.products?"Cross":PRODUCTS[part.p]?.name||part.p}</span>}
            <span style={{fontSize:12,color:txd,fontWeight:800}}>×{part.per}/unit</span>
          </div>
        </div>
      </div>

      {part.c.map(c=>{
        const val=s[c]||0;
        const adjKey=`${part.id}_${c}`;
        const isEdit=editing===adjKey;
        const stockColor = val <= activeThreshold ? dnC : okC;
        
        return(
          <div key={c} style={{marginBottom:16, padding:"14px 12px", background: dark ? "#1f222e" : "#f8f9fa", borderRadius:12, border:`1px solid ${dark?"#2d3142":"#e9ecef"}`}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14}}>
              <ColorBadge color={c} size={16}/>
              {isEdit?(
                <div style={{display:"flex", gap:8}}>
                  <input type="number" inputMode="numeric" autoFocus value={editVal}
                    onChange={e=>onSetEditVal(e.target.value)}
                    onKeyDown={e=>{if(e.key==="Enter")onSaveStock(part.id,c);if(e.key==="Escape")onSetEditing(null)}}
                    style={{...S.inp, width:100, fontSize:20, fontWeight:900, textAlign:"center", height: 44}}/>
                  <button onClick={()=>onSaveStock(part.id,c)} style={{...S.bSm(okC), padding:"0 16px", fontSize: 16}}>✓</button>
                </div>
              ):(
                <span onClick={()=>{onSetEditing(adjKey);onSetEditVal(String(val))}}
                  style={{fontWeight:900,fontSize:28,color:stockColor,cursor:"pointer",borderBottom:`2px dashed ${txd}`,paddingBottom:2}}>
                  {val.toLocaleString()}
                </span>
              )}
            </div>

            {!isEdit&&(
              <div>
                <input type="number" inputMode="numeric" placeholder="Qty amount..."
                  value={partAdjust[adjKey]||""}
                  onChange={e=>onSetPartAdjust(adjKey,e.target.value)}
                  style={{...S.inp, width:"100%", height: 48, fontSize:18, textAlign:"center", fontWeight:800, marginBottom:8}}/>
                
                <div style={{display:"flex", gap:8, marginBottom: 14}}>
                  <button onClick={()=>onSetPartAdjust(adjKey, String((parseInt(partAdjust[adjKey])||0) + 100))} style={{...S.bSm(acc), flex:1, height:40, fontSize:14, fontWeight:900}}>+100</button>
                  <button onClick={()=>onSetPartAdjust(adjKey, String((parseInt(partAdjust[adjKey])||0) + 200))} style={{...S.bSm(acc), flex:1, height:40, fontSize:14, fontWeight:900}}>+200</button>
                  <button onClick={()=>onSetPartAdjust(adjKey, String((parseInt(partAdjust[adjKey])||0) + 500))} style={{...S.bSm(acc), flex:1, height:40, fontSize:14, fontWeight:900}}>+500</button>
                </div>

                <div style={{display:"flex", gap:10}}>
                  <button onClick={()=>onAdjustStock(part.id,c,-1)} style={{...S.btn(dnC), flex:1, height:52, fontSize:28, fontWeight:900}}>−</button>
                  <button onClick={()=>onAdjustStock(part.id,c,1)} style={{...S.btn(okC), flex:1, height:52, fontSize:28, fontWeight:900}}>+</button>
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function App(){
  const [dark, setDark] = useState(() => {
    const saved = localStorage.getItem(THEME_KEY);
    return saved !== null ? JSON.parse(saved) : true;
  });
  
  const[mainTab,setMainTab]=useState("products");
  const[prodTab,setProdTab]=useState("sprinter");
  const[stock,setStock]=useState(initStock);
  const[logs,setLogs]=useState([]);
  const[confirmed,setConfirmed]=useState({});
  
  const[notes,setNotes]=useState("");
  const[productNotes,setProductNotes]=useState({});
  
  const[threshold,setThreshold]=useState(600);
  const[itemThresholds,setItemThresholds]=useState({});
  
  const[loaded,setLoaded]=useState(false);
  const[syncing,setSyncing]=useState(false);
  const[dirty,setDirty]=useState(false);
  const[lastSync,setLastSync]=useState(null);
  const[toast,setToast]=useState(null);
  const[editing,setEditing]=useState(null);
  const[editVal,setEditVal]=useState("");
  const[asmColor,setAsmColor]=useState({});
  const[asmQty,setAsmQty]=useState({});
  const[confirmAsm,setConfirmAsm]=useState(null);
  const[showClear,setShowClear]=useState(false);
  const[logFilter,setLogFilter]=useState("all");
  const[stockFilter,setStockFilter]=useState("all");
  const[editLogId,setEditLogId]=useState(null);
  const[editLogText,setEditLogText]=useState("");
  const[partAdjust,setPartAdjust]=useState({});
  const[searchQuery,setSearchQuery]=useState("");
  const[showItemThresholds,setShowItemThresholds]=useState(false);
  
  const debounceRef=useRef(null);
  const notesRef=useRef(null);
  const productNotesRef=useRef({});

  useEffect(() => {
    localStorage.setItem(THEME_KEY, JSON.stringify(dark));
  }, [dark]);

  const showToast=useCallback((msg,type="ok")=>{
    setToast({msg,type});setTimeout(()=>setToast(null),2500);
  },[]);

  const serialize=useCallback(()=>({
    stock,logs:logs.slice(0,2000),confirmed,notes,productNotes,itemThresholds,threshold,updatedAt:Date.now()
  }),[stock,logs,confirmed,notes,productNotes,itemThresholds,threshold]);

  const pullCloud=useCallback(async()=>{
    setSyncing(true);
    try{
      const r=await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,{headers:{"X-Master-Key":API_KEY}});
      const j=await r.json();
      if(j.record&&j.record.stock){
        const d=j.record;
        
        const localRaw = localStorage.getItem(STORE_KEY);
        let localD = null;
        if(localRaw) { try { localD = JSON.parse(localRaw); } catch(e){} }
        
        if (localD && localD.updatedAt && d.updatedAt && localD.updatedAt > d.updatedAt) {
            setDirty(true);
            setSyncing(false);
            showToast("Local offline changes found. Please save.");
            return true;
        }

        const merged={...initStock()};
        Object.keys(d.stock||{}).forEach(k=>{if(merged[k]||ALL_PARTS.find(p=>p.id===k))merged[k]={...(merged[k]||{}),...d.stock[k]}});
        
        setStock(merged);
        setLogs(d.logs||[]);
        setConfirmed(d.confirmed||{});
        if(d.threshold) setThreshold(d.threshold);
        if(d.itemThresholds) setItemThresholds(d.itemThresholds);
        if(d.notes!=null) setNotes(d.notes);
        if(d.productNotes) setProductNotes(d.productNotes);
        
        localStorage.setItem(STORE_KEY,JSON.stringify({...d,stock:merged}));
        setLastSync(new Date());setDirty(false);setSyncing(false);return true;
      }
    }catch(e){console.error("Pull err:",e)}
    setSyncing(false);return false;
  },[]);

  const pushCloud=useCallback(async(data)=>{
    setSyncing(true);
    try{
      const payload=data||serialize();
      const r=await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{method:"PUT",headers:{"Content-Type":"application/json","X-Master-Key":API_KEY},body:JSON.stringify(payload)});
      if(r.ok){localStorage.setItem(STORE_KEY,JSON.stringify(payload));setLastSync(new Date());setDirty(false);showToast("Saved to Cloud!")}
      else showToast("Cloud save failed","err");
    }catch(e){showToast("Network error (Saved Offline)","wnC")}
    setSyncing(false);
  },[serialize,showToast]);

  const markDirty=useCallback(()=>{
    setDirty(true);
    clearTimeout(debounceRef.current);
    debounceRef.current=setTimeout(()=>{
      const data=serialize();
      localStorage.setItem(STORE_KEY,JSON.stringify(data));
    },500);
  },[serialize]);

  useEffect(()=>{
    const init=async()=>{
      const local=localStorage.getItem(STORE_KEY);
      if(local){try{
        const d=JSON.parse(local);
        const merged={...initStock()};
        Object.keys(d.stock||{}).forEach(k=>{if(merged[k]||ALL_PARTS.find(p=>p.id===k))merged[k]={...(merged[k]||{}),...d.stock[k]}});
        setStock(merged);setLogs(d.logs||[]);setConfirmed(d.confirmed||{});
        setThreshold(d.threshold||600);
        setItemThresholds(d.itemThresholds||{});
        setNotes(d.notes||"");
        setProductNotes(d.productNotes||{});
      }catch(e){}}
      setLoaded(true);await pullCloud();
    };init();
  },[pullCloud]);

  const mkLog=(action,detail,product)=>({id:genId(),ts:Date.now(),a:action,d:detail,p:product});

  const doAssemble=(pid)=>{
    const aColors=getAssemblableColors(pid);
    const color=asmColor[pid]||aColors[0];const qty=parseInt(asmQty[pid])||0;
    if(!color){showToast("No assemblable color","err");return}
    if(qty<=0){showToast("Enter quantity","err");return}
    setConfirmAsm({pid,color,qty});
  };

  const confirmDoAssemble=()=>{
    const{pid,color,qty}=confirmAsm;
    const pp=getProductParts(pid);const ns={...stock};
    pp.forEach(p=>{
      const mapped=getPartColorForAsm(p,color);
      if(!mapped)return;
      if(!ns[p.id])ns[p.id]={};
      ns[p.id][mapped]=Math.max(0,(ns[p.id][mapped]||0)-qty*(p.per||1));
    });
    const pName=PRODUCTS[pid]?.name||pid;
    const entry=mkLog("assemble",`${qty} ${CLR[color]?.lb||color} ${pName}${qty>1?"s":""}`,pid);
    const nl=[entry,...logs].slice(0,2000);
    setStock(ns);setLogs(nl);setAsmQty(q=>({...q,[pid]:""}));setConfirmAsm(null);markDirty();
    showToast(`Assembled ${qty} ${CLR[color]?.lb} ${pName}!`);
  };

  const saveStock=(partId,color)=>{
    const val=parseInt(editVal);if(isNaN(val)){showToast("Enter number","err");return}
    const ns={...stock};if(!ns[partId])ns[partId]={};
    const old=ns[partId][color]||0;const nv=Math.max(0,val);
    ns[partId]={...ns[partId],[color]:nv};
    const part=ALL_PARTS.find(p=>p.id===partId);
    const entry=mkLog("stock_edit",`${part?.n||partId} [${CLR[color]?.lb||color}]: ${old} \u2192 ${nv}`,part?.p||"cross");
    const nl=[entry,...logs].slice(0,2000);
    setStock(ns);setLogs(nl);setEditing(null);setEditVal("");markDirty();showToast("Stock updated");
  };

  const adjustStock=(pid,ck,delta)=>{
    const iv=partAdjust[`${pid}_${ck}`];
    const amt=iv?parseInt(iv):Math.abs(delta);
    if(isNaN(amt))return;
    const ad=delta>0?amt:-amt;
    const ns={...stock};if(!ns[pid])ns[pid]={};
    const old=ns[pid][ck]||0;const nv=Math.max(0,old+ad);
    ns[pid]={...ns[pid],[ck]:nv};
    const part=ALL_PARTS.find(p=>p.id===pid);
    const entry=mkLog("adjust",`${part?.n||pid} [${CLR[ck]?.lb||ck}]: ${old} \u2192 ${nv} (${nv>old?"+":""}${nv-old})`,part?.p||"cross");
    const nl=[entry,...logs].slice(0,2000);
    setStock(ns);setLogs(nl);markDirty();
    setPartAdjust(prev=>({...prev,[`${pid}_${ck}`]:""}));
  };

  const toggleConfirm=(partId)=>{
    const nc={...confirmed};
    if(nc[partId])delete nc[partId];else nc[partId]=Date.now();
    setConfirmed(nc);markDirty();
  };
  
  const resetConfirm=()=>{setConfirmed({});markDirty();showToast("Confirmations reset")};
  
  const confirmAll=()=>{
    const nc={};
    ALL_PARTS.forEach(p=>nc[p.id]=Date.now());
    setConfirmed(nc);
    markDirty();
    showToast("All parts confirmed");
  };

  const deleteLog=(lid)=>{setLogs(logs.filter(l=>l.id!==lid));markDirty()};
  const clearLogs=()=>{setLogs([]);markDirty();showToast("Logs cleared")};
  const saveLogEdit=(lid)=>{
    const nl=logs.map(l=>l.id===lid?{...l,d:editLogText,editedAt:Date.now()}:l);
    setLogs(nl);setEditLogId(null);markDirty();showToast("Log updated");
  };

  const handleNotes=(val)=>{
    setNotes(val);clearTimeout(notesRef.current);
    notesRef.current=setTimeout(()=>markDirty(),800);
  };
  
  const handleProductNotes=(pid, val)=>{
    setProductNotes(prev => ({...prev, [pid]: val}));
    clearTimeout(productNotesRef.current[pid]);
    productNotesRef.current[pid] = setTimeout(() => markDirty(), 800);
  };

  const doExportJSON=()=>{
    const payload=serialize();payload.exportedAt=new Date().toISOString();
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    downloadFile(blob,`littlestar_backup_${new Date().toISOString().slice(0,10)}.json`);
  };

  const doExportCSV=()=>{
    let csv="Product,Part,Color,Stock\n";
    ALL_PARTS.forEach(part=>{
      const prod=part.p==="cross"?"cross":(PRODUCTS[part.p]?.name||part.p);
      part.c.forEach(c=>{
        csv+=`"${prod}","${part.n}","${CLR[c]?.lb||c}",${stock[part.id]?.[c]||0}\n`;
      });
    });
    CROSS_PARTS.forEach(cp=>{
      cp.c.forEach(c=>{
        csv+=`"Cross (${cp.products.map(p=>PRODUCTS[p]?.name).join(' & ')})","${cp.n}","${CLR[c]?.lb||c}",${stock[cp.id]?.[c]||0}\n`;
      });
    });
    const blob=new Blob([csv],{type:"text/csv"});
    downloadFile(blob,`littlestar_stock_${new Date().toISOString().slice(0,10)}.csv`);
  };

  const handleImport=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(d.stock){
          const merged={...initStock()};
          Object.keys(d.stock).forEach(k=>{if(merged[k])merged[k]={...merged[k],...d.stock[k]}});
          setStock(merged);setLogs(d.logs||[]);setConfirmed(d.confirmed||{});
          if(d.threshold)setThreshold(d.threshold);
          if(d.itemThresholds)setItemThresholds(d.itemThresholds);
          if(d.notes!=null)setNotes(d.notes);
          if(d.productNotes)setProductNotes(d.productNotes);
          markDirty();showToast("Imported successfully!");
        }else showToast("Invalid format","err");
      }catch(err){showToast("Error reading file","err")}
    };reader.readAsText(file);e.target.value="";
  };

  const wipeData=()=>{setStock(initStock());setLogs([]);setConfirmed({});setNotes("");setProductNotes({});setItemThresholds({});markDirty();showToast("All data wiped","err")};

  const dataSize=useMemo(()=>{
    const j=JSON.stringify(serialize());return(new Blob([j]).size/1024).toFixed(1);
  },[serialize]);

  const bg=dark?"#0f1117":"#f3f4f6";
  const card=dark?"#1a1d27":"#ffffff";
  const cb=dark?"#2a2d3a":"#e0e0e0";
  const tx=dark?"#e8e8e8":"#1a1a1a";
  const txd=dark?"#8b8fa3":"#888888";
  const acc="#4f8cff";
  const okC="#22c55e";const dnC="#ef4444";const wnC="#f59e0b";

  const S={
    app:{fontFamily:"'Nunito',sans-serif",background:bg,color:tx,minHeight:"100vh",maxWidth:520,margin:"0 auto",paddingBottom:72,fontSize:15,WebkitFontSmoothing:"antialiased"},
    crd:{background:card,border:`1px solid ${cb}`,borderRadius:12,margin:"6px 10px",padding:"10px 12px"},
    btn:(b,c="#fff")=>({background:b,color:c,border:"none",borderRadius:10,padding:"10px 16px",fontWeight:800,fontSize:15,fontFamily:"'Nunito',sans-serif",cursor:"pointer",display:"inline-flex",alignItems:"center",justifyContent:"center",gap:5}),
    bSm:(b,c="#fff")=>({background:b,color:c,border:"none",borderRadius:8,padding:"8px 14px",fontWeight:800,fontSize:14,fontFamily:"'Nunito',sans-serif",cursor:"pointer",display:"inline-flex",alignItems:"center",justifyContent:"center"}),
    inp:{background:dark?"#252836":"#f0f0ec",border:`1.5px solid ${cb}`,borderRadius:10,padding:"10px 12px",color:tx,fontSize:16,fontFamily:"'Nunito',sans-serif",width:"100%",boxSizing:"border-box",outline:"none"},
    lbl:{fontSize:12,fontWeight:800,color:txd,marginBottom:4,display:"block",textTransform:"uppercase",letterSpacing:.5},
    tag:(c)=>({display:"inline-block",padding:"3px 10px",borderRadius:12,fontSize:12,fontWeight:800,background:c+"22",color:c}),
    iBtn:{background:"none",border:"none",color:txd,fontSize:20,cursor:"pointer",padding:"4px 8px",borderRadius:8},
    nav:{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:520,background:dark?"#161822":"#fff",borderTop:`1px solid ${cb}`,display:"flex",zIndex:100},
    nI:(a)=>({flex:1,padding:"10px 0 12px",textAlign:"center",background:"none",border:"none",color:a?acc:txd,fontSize:11,fontWeight:a?900:700,fontFamily:"'Nunito',sans-serif",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:4}),
    toast:{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",background:toast?.type==="err"?dnC:okC,color:"#fff",padding:"12px 24px",borderRadius:12,fontWeight:800,fontSize:14,zIndex:9999,boxShadow:"0 6px 24px rgba(0,0,0,.4)",fontFamily:"'Nunito',sans-serif",maxWidth:"90%",textAlign:"center"},
    subNav:{display:"flex",overflowX:"auto",gap:0,background:dark?"#161822cc":"#ffffffcc",backdropFilter:"blur(8px)",borderBottom:`1px solid ${cb}`,position:"sticky",top:0,zIndex:90},
    subNI:(a)=>({padding:"12px 16px",whiteSpace:"nowrap",background:"none",border:"none",borderBottom:a?`3px solid ${acc}`:"3px solid transparent",color:a?acc:txd,fontSize:14,fontWeight:a?900:700,fontFamily:"'Nunito',sans-serif",cursor:"pointer",display:"flex",alignItems:"center",gap:6}),
  };

  // NOTE: Added 'card' to theme here so it can be passed down correctly!
  const theme={dark,tx,txd,acc,okC,dnC,cb,card,S};

  const handleSetPartAdjust=useCallback((key,val)=>{
    setPartAdjust(prev=>({...prev,[key]:val}));
  },[]);

  if(!loaded)return(
    <div style={{...S.app,display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"}}>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:48,marginBottom:12}}>🏭</div>
        <div style={{fontSize:22,fontWeight:900}}>Little Star</div>
        <div style={{color:txd,marginTop:6,fontSize:15}}>Loading Inventory...</div>
      </div>
    </div>
  );

  const partRowProps={
    stock,confirmed,editing,editVal,partAdjust,
    onSetEditing:setEditing,onSetEditVal:setEditVal,onSetPartAdjust:handleSetPartAdjust,
    onSaveStock:saveStock,onAdjustStock:adjustStock,onToggleConfirm:toggleConfirm,theme,threshold,itemThresholds
  };

  const renderProductView=(pid)=>{
    let pp=getProductParts(pid);
    if(searchQuery) {
        pp = pp.filter(p => p.n.toLowerCase().includes(searchQuery.toLowerCase()));
    }
    const aColors=getAssemblableColors(pid);
    const colored=pp.filter(p=>!p.c.includes("universal"));
    const univ=pp.filter(p=>p.c.includes("universal"));
    const selColor=asmColor[pid]||aColors[0]||"";
    
    return(
      <div>
        <div style={{...S.crd,border:`2px solid ${acc}44`, padding:"16px 14px"}}>
          <div style={{fontSize:16,fontWeight:900,marginBottom:12}}>⚙️ Assemble {PRODUCTS[pid]?.name}</div>
          <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
            {aColors.map(c=>(
              <button key={c} onClick={()=>setAsmColor(a=>({...a,[pid]:c}))}
                style={{...S.btn(selColor===c?CLR[c].bg:"transparent",selColor===c?"#fff":CLR[c].bg),border:`2px solid ${CLR[c].bg}`,padding:"8px 12px",fontSize:14,flex:1,minWidth:70}}>
                {CLR[c].lb}
              </button>
            ))}
          </div>
          <div style={{display:"flex",gap:8,marginBottom:10}}>
            <input type="number" inputMode="numeric" placeholder="Quantity..." value={asmQty[pid]||""} onChange={e=>setAsmQty(q=>({...q,[pid]:e.target.value}))}
              style={{...S.inp,flex:1,fontSize:18,height:50,fontWeight:800,textAlign:"center"}}/>
            <button onClick={()=>doAssemble(pid)} style={{...S.btn(okC),fontSize:16,padding:"0 20px",height:50}}>✅ Make</button>
          </div>
          <div style={{display:"flex",gap:10,flexWrap:"wrap",justifyContent:"center"}}>
            {aColors.map(c=>{
              const mx=calcMax(pid,c,stock);
              return <span key={c} style={{fontSize:12,fontWeight:800,color:CLR[c].bg}}>Can make {mx} {CLR[c].lb}</span>;
            })}
          </div>
        </div>
        
        {colored.length>0&&<div style={{padding:"12px 14px 4px",fontSize:13,fontWeight:900,color:txd,textTransform:"uppercase",letterSpacing:1}}>Colored Parts ({colored.length})</div>}
        {colored.map(p=><PartRow key={p.id} part={p} {...partRowProps}/>)}
        
        {univ.length>0&&<div style={{padding:"12px 14px 4px",fontSize:13,fontWeight:900,color:txd,textTransform:"uppercase",letterSpacing:1}}>Universal Parts ({univ.length})</div>}
        {univ.map(p=><PartRow key={p.id} part={p} {...partRowProps}/>)}
        
        {pp.length===0&&<div style={{...S.crd,textAlign:"center",color:txd, padding:20, fontSize:16}}>No parts match "{searchQuery}"</div>}
        
        {/* 10-line Product Specific Notes */}
        <div style={{ padding: "16px 14px 20px" }}>
            <div style={{ fontSize: 13, fontWeight: 900, color: txd, textTransform: "uppercase", marginBottom: 8, letterSpacing:1 }}>📝 {PRODUCTS[pid]?.name} Notes</div>
            <textarea
                rows="10"
                placeholder={`Add any specific notes for ${PRODUCTS[pid]?.name} here...`}
                value={productNotes[pid] || ""}
                onChange={e => handleProductNotes(pid, e.target.value)}
                style={{ ...S.inp, minHeight: 200, resize: "vertical", lineHeight: 1.5, fontSize: 16 }}
            />
        </div>
      </div>
    );
  };

  const renderCrossView=()=>{
    let cp = CROSS_PARTS;
    if (searchQuery) cp = cp.filter(p => p.n.toLowerCase().includes(searchQuery.toLowerCase()));
    
    return(
      <div>
        <div style={{padding:"14px 14px 6px",fontSize:16,fontWeight:900}}>🔗 Cross-Compatible Parts</div>
        <div style={{padding:"0 14px 10px",fontSize:14,color:txd}}>Shared stock across multiple products.</div>
        
        {cp.map(p=><PartRow key={p.id} part={p} {...partRowProps}/>)}
        {cp.length===0&&<div style={{...S.crd,textAlign:"center",color:txd, padding:20, fontSize:16}}>No parts match "{searchQuery}"</div>}
        
        {/* 10-line Cross Parts Notes */}
        <div style={{ padding: "16px 14px 20px" }}>
            <div style={{ fontSize: 13, fontWeight: 900, color: txd, textTransform: "uppercase", marginBottom: 8, letterSpacing:1 }}>📝 Cross Parts Notes</div>
            <textarea
                rows="10"
                placeholder="Add notes for shared/cross parts here..."
                value={productNotes["cross"] || ""}
                onChange={e => handleProductNotes("cross", e.target.value)}
                style={{ ...S.inp, minHeight: 200, resize: "vertical", lineHeight: 1.5, fontSize: 16 }}
            />
        </div>
      </div>
    );
  };

  const renderStockView=()=>{
    const prods=stockFilter==="all"?["sprinter","stroller","twilight","tolo","cross"]:[stockFilter];
    return(
      <div>
        <div style={{padding:"14px 14px 6px",fontSize:16,fontWeight:900}}>📦 Stock Overview</div>
        <div style={{padding:"0 14px 10px",fontSize:14,color:txd}}>Tap any number to edit manually.</div>
        <div style={{display:"flex",gap:6,padding:"0 12px 12px",overflowX:"auto"}}>
          {["all","sprinter","stroller","twilight","tolo"].map(f=>(
            <button key={f} onClick={()=>setStockFilter(f)}
              style={{...S.btn(stockFilter===f?acc:"transparent",stockFilter===f?"#fff":txd),padding:"8px 14px",fontSize:13,border:`2px solid ${stockFilter===f?acc:cb}`,whiteSpace:"nowrap"}}>
              {f==="all"?"All":PRODUCTS[f]?.name}
            </button>
          ))}
        </div>
        {prods.map(pid=>{
          let parts=pid==="cross"?CROSS_PARTS:PARTS.filter(p=>p.p===pid);
          if (searchQuery) parts = parts.filter(p => p.n.toLowerCase().includes(searchQuery.toLowerCase()));
          
          if(parts.length===0)return null;
          return(
            <div key={pid}>
              <div style={{padding:"10px 14px 4px",fontSize:13,fontWeight:900,color:txd,textTransform:"uppercase",letterSpacing:1}}>
                {pid==="cross"?"🔗 Cross":PRODUCTS[pid]?.icon+" "+PRODUCTS[pid]?.name} ({parts.length})
              </div>
              {parts.map(p=><PartRow key={p.id} part={p} showProduct={stockFilter==="all"} {...partRowProps}/>)}
            </div>
          );
        })}
      </div>
    );
  };

  const renderLogView=()=>{
    const filtered=logFilter==="all"?logs:logs.filter(l=>l.p===logFilter);
    return(
      <div>
        <div style={{padding:"14px 14px 6px",fontSize:16,fontWeight:900}}>📋 Activity Log</div>
        <div style={{display:"flex",gap:6,padding:"0 12px 12px",overflowX:"auto"}}>
          {["all","sprinter","stroller","twilight","tolo","cross"].map(f=>(
            <button key={f} onClick={()=>setLogFilter(f)}
              style={{...S.btn(logFilter===f?acc:"transparent",logFilter===f?"#fff":txd),padding:"8px 14px",fontSize:13,border:`2px solid ${logFilter===f?acc:cb}`,whiteSpace:"nowrap"}}>
              {f==="all"?"All":f==="cross"?"Cross":PRODUCTS[f]?.name}
            </button>
          ))}
        </div>
        {filtered.length===0&&<div style={{...S.crd,textAlign:"center",color:txd,padding:30,fontSize:16}}>No activity yet</div>}
        {filtered.slice(0,100).map(l=>(
          <div key={l.id} style={{...S.crd,padding:"14px", marginBottom:8}}>
            <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
              <div style={{flex:1}}>
                <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:6}}>
                  <span style={S.tag(l.a==="assemble"?okC:l.a==="adjust"||l.a==="stock_edit"?acc:wnC)}>{l.a}</span>
                  {l.p&&<span style={{fontSize:11,color:txd,fontWeight:800}}>{PRODUCTS[l.p]?.name||l.p}</span>}
                </div>
                {editLogId===l.id?(
                  <div style={{marginTop:8}}>
                    <input value={editLogText} onChange={e=>setEditLogText(e.target.value)}
                      onKeyDown={e=>{if(e.key==="Enter")saveLogEdit(l.id);if(e.key==="Escape")setEditLogId(null)}}
                      autoFocus style={{...S.inp,marginBottom:8,fontSize:16}}/>
                    <div style={{display:"flex",gap:8}}>
                      <button onClick={()=>saveLogEdit(l.id)} style={{...S.btn(okC), flex:1}}>Save</button>
                      <button onClick={()=>setEditLogId(null)} style={{...S.btn(dark?"#444":"#ccc",tx), flex:1}}>Cancel</button>
                    </div>
                  </div>
                ):(
                  <div style={{fontSize:15,fontWeight:800,lineHeight:1.4}}>{l.d}</div>
                )}
                <div style={{fontSize:12,color:txd,marginTop:6,fontWeight:600}}>
                  {fmtTS(l.ts)}
                  {l.editedAt&&<span style={{marginLeft:8,fontStyle:"italic"}}>(edited {fmtTS(l.editedAt)})</span>}
                </div>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                <button onClick={()=>{setEditLogId(l.id);setEditLogText(l.d)}} style={S.iBtn}>✏️</button>
                <button onClick={()=>deleteLog(l.id)} style={{...S.iBtn,color:dnC+"aa"}}>🗑️</button>
              </div>
            </div>
          </div>
        ))}
        {logs.length>0&&<div style={{padding:"12px 14px"}}><button onClick={clearLogs} style={{...S.btn("transparent", dnC), border:`2px solid ${dnC}`, width:"100%",fontSize:15}}>🗑️ Clear All Logs</button></div>}
      </div>
    );
  };

  const renderConfirmView=()=>{
    const prodIds=["sprinter","stroller","twilight","tolo"];
    return(
      <div>
        <div style={{padding:"14px 14px 6px",fontSize:16,fontWeight:900}}>✅ Confirm Stock</div>
        <div style={{padding:"0 14px 10px",fontSize:14,color:txd}}>Tick parts you've physically verified.</div>
        <div style={{padding:"4px 12px 12px", display:"flex", gap:10}}>
          <button onClick={resetConfirm} style={{...S.btn("transparent",wnC), border:`2px solid ${wnC}`, flex:1,fontSize:14}}>🔄 Clear All</button>
          <button onClick={confirmAll} style={{...S.btn(okC),flex:1,fontSize:14}}>✅ Confirm All</button>
        </div>
        {prodIds.map(pid=>{
          let pp=getProductParts(pid);
          if (searchQuery) pp = pp.filter(p => p.n.toLowerCase().includes(searchQuery.toLowerCase()));
          if(pp.length===0) return null;
          
          const confCount=pp.filter(p=>confirmed[p.id]).length;
          return(
            <div key={pid}>
              <div style={{padding:"10px 14px 4px",fontSize:13,fontWeight:900,color:txd,textTransform:"uppercase",letterSpacing:1,display:"flex",justifyContent:"space-between"}}>
                <span>{PRODUCTS[pid]?.icon} {PRODUCTS[pid]?.name}</span>
                <span style={{color:confCount===pp.length?okC:wnC}}>{confCount}/{pp.length}</span>
              </div>
              {pp.map(p=>(
                <div key={p.id} onClick={()=>toggleConfirm(p.id)} style={{...S.crd,padding:"16px 14px",display:"flex",alignItems:"center",gap:14,cursor:"pointer", background: confirmed[p.id] ? okC+"15" : card, border: confirmed[p.id] ? `2px solid ${okC}` : `1px solid ${cb}`}}>
                  <span style={{fontSize:32}}>{confirmed[p.id]?"✅":"⬜"}</span>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:900,fontSize:16}}>{p.n}</div>
                    <div style={{fontSize:12,color:txd,marginTop:4,fontWeight:700}}>{p.c.map(c=>CLR[c]?.lb).join(", ")}</div>
                  </div>
                  {confirmed[p.id]&&<span style={{fontSize:11,color:okC,fontWeight:900}}>{fmtTS(confirmed[p.id])}</span>}
                </div>
              ))}
            </div>
          );
        })}
        
        {(() => {
          let cp = CROSS_PARTS;
          if (searchQuery) cp = cp.filter(p => p.n.toLowerCase().includes(searchQuery.toLowerCase()));
          if(cp.length===0) return null;
          return (
            <div>
              <div style={{padding:"10px 14px 4px",fontSize:13,fontWeight:900,color:txd,textTransform:"uppercase",letterSpacing:1}}>🔗 Cross-Compatible</div>
              {cp.map(cp=>(
                <div key={cp.id} onClick={()=>toggleConfirm(cp.id)} style={{...S.crd,padding:"16px 14px",display:"flex",alignItems:"center",gap:14,cursor:"pointer", background: confirmed[cp.id] ? okC+"15" : card, border: confirmed[cp.id] ? `2px solid ${okC}` : `1px solid ${cb}`}}>
                  <span style={{fontSize:32}}>{confirmed[cp.id]?"✅":"⬜"}</span>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:900,fontSize:16}}>{cp.n}</div>
                    <div style={{fontSize:12,color:txd,marginTop:4,fontWeight:700}}>Shared: {cp.products.map(p=>PRODUCTS[p]?.name).join(" & ")}</div>
                  </div>
                </div>
              ))}
            </div>
          )
        })()}
      </div>
    );
  };

  const renderSettingsView=()=>(
    <div>
      <div style={{padding:"14px 14px 6px",fontSize:16,fontWeight:900}}>⚙️ Settings</div>
      <div style={S.crd}>
        <label style={S.lbl}>Cloud Sync</label>
        <div style={{fontSize:13,color:txd,marginBottom:10}}>Pull latest data from cloud (if partner updated).</div>
        <button onClick={pullCloud} disabled={syncing} style={{...S.btn(acc),width:"100%",height:50}}>
          {syncing?"Syncing...":"⬇️ Download from Cloud"}
        </button>
        {lastSync&&<div style={{fontSize:12,color:txd,marginTop:8,textAlign:"center",fontWeight:700}}>Last sync: {fmtTS(lastSync.getTime())}</div>}
      </div>

      <div style={S.crd}>
        <label style={S.lbl}>Export Data</label>
        <div style={{display:"flex",gap:8}}>
          <button onClick={doExportJSON} style={{...S.btn(acc),flex:1,height:48}}>📥 JSON</button>
          <button onClick={doExportCSV} style={{...S.btn(okC),flex:1,height:48}}>📊 CSV</button>
        </div>
      </div>

      <div style={S.crd}>
        <label style={S.lbl}>Import Data</label>
        <label style={{...S.btn(wnC),cursor:"pointer",width:"100%",height:50,justifyContent:"center"}}>
          📤 Import JSON Backup
          <input type="file" accept=".json" onChange={handleImport} style={{display:"none"}}/>
        </label>
      </div>

      <div style={S.crd}>
        <label style={S.lbl}>Global Low Stock Threshold</label>
        <div style={{fontSize:13,color:txd,marginBottom:8}}>Items at or below this number show in red.</div>
        <input type="number" inputMode="numeric" value={threshold} onChange={e=>{setThreshold(parseInt(e.target.value)||0);markDirty()}}
          style={{...S.inp,fontSize:20,fontWeight:900,textAlign:"center",height:50}}/>
      </div>
      
      {/* Individual Thresholds Section */}
      <div style={S.crd}>
        <label style={S.lbl}>Individual Part Thresholds</label>
        <div style={{fontSize:13,color:txd,marginBottom:10}}>Set custom red-line limits for specific items.</div>
        <button onClick={() => setShowItemThresholds(!showItemThresholds)} style={{...S.btn(dark?"#2d3142":"#e9ecef", tx), width: "100%", height:50}}>
             {showItemThresholds ? "Hide Individual Settings" : "⚙️ Configure Items"}
        </button>
        
        {showItemThresholds && (
           <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 10, maxHeight: 500, overflowY: "auto", padding:"4px" }}>
              {ALL_PARTS.map(p => (
                 <div key={p.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", paddingBottom: 10, borderBottom: `1px solid ${cb}` }}>
                    <div style={{flex: 1, paddingRight: 10}}>
                       <div style={{fontSize: 14, fontWeight: 800}}>{p.n}</div>
                       <div style={{fontSize: 11, color: txd, fontWeight: 700}}>{PRODUCTS[p.p]?.name || "Cross"}</div>
                    </div>
                    <input type="number" placeholder={`Def: ${threshold}`}
                       value={itemThresholds[p.id] !== undefined ? itemThresholds[p.id] : ""}
                       onChange={e => {
                          const val = e.target.value === "" ? undefined : parseInt(e.target.value);
                          setItemThresholds(prev => {
                             const next = {...prev};
                             if (val === undefined) delete next[p.id]; else next[p.id] = val;
                             return next;
                          });
                          markDirty();
                       }}
                       style={{...S.inp, width: 100, fontSize: 16, fontWeight: 800, textAlign: "center"}}
                    />
                 </div>
              ))}
           </div>
        )}
      </div>

      <div style={S.crd}>
        <label style={S.lbl}>General Notes</label>
        <textarea rows={6} value={notes} onChange={e=>handleNotes(e.target.value)} placeholder="Shared general notes..."
          style={{...S.inp,minHeight:140,resize:"vertical",lineHeight:1.5}}/>
      </div>

      <div style={S.crd}>
        <label style={S.lbl}>Theme</label>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>setDark(true)} style={{...S.btn(dark?acc:cb,dark?"#fff":tx),flex:1,height:48}}>🌙 Dark</button>
          <button onClick={()=>setDark(false)} style={{...S.btn(!dark?acc:cb,!dark?"#fff":tx),flex:1,height:48}}>☀️ Light</button>
        </div>
      </div>

      <div style={S.crd}>
        <label style={S.lbl}>Data Size</label>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{flex:1,height:12,borderRadius:6,background:cb,overflow:"hidden"}}>
            <div style={{width:`${Math.min(100,parseFloat(dataSize)/100*100)}%`,height:"100%",borderRadius:6,background:parseFloat(dataSize)>80?dnC:parseFloat(dataSize)>50?wnC:okC}}/>
          </div>
          <span style={{fontSize:14,fontWeight:800}}>{dataSize} KB / 100 KB</span>
        </div>
      </div>

      <div style={{padding:"14px 14px 4px",fontSize:15,fontWeight:900,color:dnC}}>Danger Zone</div>
      <div style={{...S.crd,borderColor:dnC+"44"}}>
        <button onClick={()=>setShowClear(true)} style={{...S.btn(dnC),width:"100%",height:50}}>🚨 Clear All Data</button>
      </div>
    </div>
  );

  return(
    <div style={S.app}>
      {toast&&<div style={S.toast}>{toast.msg}</div>}

      {showClear&&(
        <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,.85)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div style={{...S.crd,margin:0,maxWidth:360,width:"100%",textAlign:"center",padding:"32px 24px"}}>
            <div style={{fontSize:54,marginBottom:12}}>⚠️</div>
            <h2 style={{marginTop:0,color:dnC,fontSize:26,fontWeight:900}}>CLEAR ALL DATA?</h2>
            <p style={{color:tx,marginBottom:24,fontSize:16,fontWeight:700}}>This permanently deletes ALL stock, logs, notes, and confirmations.</p>
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              <button onClick={()=>setShowClear(false)} style={{...S.btn(okC),width:"100%",height:54,fontSize:18}}>✅ Cancel</button>
              <button onClick={()=>{wipeData();setShowClear(false)}} style={{...S.btn("transparent",dnC),border:`2px solid ${dnC}`,width:"100%",height:54,fontSize:18}}>🚨 Yes, Delete Everything</button>
            </div>
          </div>
        </div>
      )}

      {confirmAsm&&(
        <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,.8)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div style={{...S.crd,margin:0,maxWidth:360,width:"100%",textAlign:"center",padding:"30px 24px"}}>
            <div style={{fontSize:48,marginBottom:10}}>{PRODUCTS[confirmAsm.pid]?.icon}</div>
            <div style={{fontSize:20,fontWeight:900,marginBottom:6}}>Confirm Assembly</div>
            <div style={{fontSize:16,color:txd,marginBottom:20}}>
              Make <strong style={{color:CLR[confirmAsm.color]?.bg}}>{confirmAsm.qty} {CLR[confirmAsm.color]?.lb}</strong> {PRODUCTS[confirmAsm.pid]?.name}{confirmAsm.qty>1?"s":""}?
              {confirmAsm.color==="red"&&confirmAsm.pid==="stroller"&&(
                <div style={{fontSize:13,marginTop:6,fontWeight:800,color:CLR.darkblue.bg}}>Uses Red + D.Blue parts</div>
              )}
              {calcMax(confirmAsm.pid,confirmAsm.color,stock)<confirmAsm.qty&&(
                <div style={{color:wnC,fontSize:13,marginTop:6,fontWeight:900}}>⚠️ Some parts will drop below 0</div>
              )}
            </div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setConfirmAsm(null)} style={{...S.btn(dark?"#333":"#ddd",tx),flex:1,height:50,fontSize:16}}>Cancel</button>
              <button onClick={confirmDoAssemble} style={{...S.btn(okC),flex:1,height:50,fontSize:16}}>Confirm</button>
            </div>
          </div>
        </div>
      )}

      <div style={{background:dark?"#161822":"#fff",borderBottom:`1px solid ${cb}`,position:"sticky",top:0,zIndex:95}}>
        <div style={{background:acc+"15",borderBottom:`1px solid ${acc}44`,padding:"10px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:13,fontWeight:900,color:dirty?wnC:okC, letterSpacing:1}}>
            {dirty?"⚠️ UNSAVED CHANGES":"✓ ALL SYNCED"}
          </span>
          <button onClick={()=>pushCloud()} disabled={syncing||!dirty}
            style={{...S.bSm(dirty?wnC:acc),padding:"8px 16px",fontSize:13,opacity:(!dirty&&!syncing)?.5:1}}>
            {syncing?"Saving...":"☁️ Save to Cloud"}
          </button>
        </div>
        <div style={{padding:"14px 16px 12px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{fontSize:20,fontWeight:900,display:"flex",alignItems:"center",gap:8}}>
            🏭 Little Star
          </div>
          <button onClick={()=>setDark(!dark)} style={{background:"none",border:"none",color:txd,fontSize:22,cursor:"pointer",padding:4}}>{dark?"☀️":"🌙"}</button>
        </div>
      </div>

      {mainTab==="products"&&(
        <div style={S.subNav}>
          {Object.keys(PRODUCTS).map(pid=>(
            <button key={pid} onClick={()=>{setProdTab(pid); setSearchQuery("")}} style={S.subNI(prodTab===pid)}>
              <span style={{fontSize:16}}>{PRODUCTS[pid].icon}</span>{PRODUCTS[pid].name}
            </button>
          ))}
          <button onClick={()=>{setProdTab("cross"); setSearchQuery("")}} style={S.subNI(prodTab==="cross")}>
            <span style={{fontSize:16}}>🔗</span>Cross
          </button>
        </div>
      )}

      {/* Global Search Bar */}
      {["products", "stock", "confirm"].includes(mainTab) && (
        <div style={{padding: "12px 14px 0"}}>
           <input type="text" placeholder="🔍 Search parts..." value={searchQuery} onChange={(e)=>setSearchQuery(e.target.value)} 
             style={{...S.inp, height: 50, fontSize: 16, fontWeight: 700, background: dark ? "#1a1d27" : "#fff", border: `2px solid ${acc}66`}} />
        </div>
      )}

      <div style={{paddingBottom:8}}>
        {mainTab==="products"&&prodTab!=="cross"&&renderProductView(prodTab)}
        {mainTab==="products"&&prodTab==="cross"&&renderCrossView()}
        {mainTab==="stock"&&renderStockView()}
        {mainTab==="log"&&renderLogView()}
        {mainTab==="confirm"&&renderConfirmView()}
        {mainTab==="settings"&&renderSettingsView()}
      </div>

      <nav style={S.nav}>
        {[
          {k:"products",i:"🏭",l:"Assembly"},
          {k:"stock",i:"📦",l:"Stock"},
          {k:"log",i:"📋",l:"Logs"},
          {k:"confirm",i:"✅",l:"Verify"},
          {k:"settings",i:"⚙️",l:"Settings"}
        ].map(n=>(
          <button key={n.k} onClick={()=>{setMainTab(n.k); setSearchQuery("")}} style={S.nI(mainTab===n.k)}>
            <span style={{fontSize:22, marginBottom:4}}>{n.i}</span>{n.l}
          </button>
        ))}
      </nav>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
