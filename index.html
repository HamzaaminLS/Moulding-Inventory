<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Little Star Inventory</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Little Star">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%230f1117'/><text x='50' y='68' text-anchor='middle' font-size='52'>⭐</text></svg>">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;padding:0;background:#0a0c14;overflow-x:hidden}
    html,body{overscroll-behavior-y:contain}
    input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
    input[type=number]{-moz-appearance:textfield}
    ::-webkit-scrollbar{height:3px;width:3px}
    ::-webkit-scrollbar-thumb{background:#4f8cff44;border-radius:4px}
    @keyframes fadeInDown{from{opacity:0;transform:translate(-50%,-16px)}to{opacity:1;transform:translate(-50%,0)}}
    @keyframes fadeOut{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-16px)}}
    @keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    @keyframes syncPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.5}}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    @keyframes backdropIn{from{opacity:0}to{opacity:1}}
    .toast-enter{animation:fadeInDown .3s cubic-bezier(.34,1.56,.64,1) forwards}
    .toast-exit{animation:fadeOut .25s ease forwards}
    .modal-bg{animation:backdropIn .2s ease forwards}
    .modal-card{animation:slideUp .3s cubic-bezier(.34,1.56,.64,1) forwards}
    button{transition:transform .1s ease, opacity .15s ease}
    button:active:not(:disabled){transform:scale(.96) !important}
    input:focus,textarea:focus{border-color:#4f8cff !important;outline:none}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useCallback,useRef,useMemo}=React;

// --- FIREBASE CONFIGURATION ---
// IMPORTANT: If saving fails, change this URL to: "https://mouldingv2-default-rtdb.asia-southeast1.firebasedatabase.app"

const FB_PATH="/inventory/main";
const STORE_KEY="littlestar-inv-v4";
const THEME_KEY="littlestar-theme";

const DEF_COLORS={

  blue:{bg:"#60a5fa",fg:"#fff",lb:"Blue",gw:"rgba(96,165,250,.3)"},

const DEF_PRODUCTS={sprinter:{name:"Sprinter",icon:"\ud83c\udfcd\ufe0f"},stroller:{name:"Stroller",icon:"\ud83d\udc76"},twilight:{name:"Twilight",icon:"\ud83c\udf19"},tolo:{name:"Tolo",icon:"\ud83d\ude97"}};

const DEF_PARTS=[{id:"sp_body",n:"Body",p:"sprinter",c:["pink", "blue"],per:1},{id:"sp_capnip",n:"Cap / Nip1 / Nip2",p:"sprinter",c:["pink", "blue"],per:1},{id:"sp_fwheel",n:"Front Wheel",p:"sprinter",c:["pink", "blue"],per:1},{id:"sp_handlecell",n:"Handle / Cell",p:"sprinter",c:["pink", "blue"],per:1},{id:"sp_bwheel",n:"Back Wheel",p:"sprinter",c:["pink", "blue"],per:1},{id:"sp_madgad",n:"Madgad",p:"sprinter",c:["pink", "blue"],per:1},{id:"sp_wcap",n:"Wheel Cap",p:"sprinter",c:["pink", "blue"],per:1},{id:"sp_takeseat",n:"Take / Seat Ring",p:"sprinter",c:["pink", "blue"],per:1},{id:"sp_mutthi",n:"Mutthi",p:"sprinter",c:["pink", "blue"],per:1},{id:"sp_wring",n:"Wheel Ring",p:"sprinter",c:["pink", "blue"],per:1},{id:"sp_chashmahr",n:"Chashma / Handle Ring",p:"sprinter",c:["pink", "blue"],per:1},{id:"sp_take",n:"Take",p:"sprinter",c:["pink", "blue"],per:1},{id:"sp_smirror",n:"Side Mirror",p:"sprinter",c:["pink", "blue"],per:1},{id:"sp_seat",n:"Seat",p:"sprinter",c:["pink", "blue"],per:1},{id:"sp_silencer",n:"Silencer",p:"sprinter",c:["pink", "blue"],per:1},{id:"sp_mirror",n:"Mirror",p:"sprinter",c:["pink", "blue"],per:1},{id:"sp_shade",n:"Shade",p:"sprinter",c:["pink", "blue"],per:1},{id:"sp_pedal",n:"Pedal",p:"sprinter",c:["pink", "blue"],per:1},{id:"sp_btncrys",n:"Button / SM (Crystal)",p:"sprinter",c:["universal"],per:1},{id:"sp_hlglass",n:"Headlight Glass (Crystal)",p:"sprinter",c:["universal"],per:1},{id:"sp_chokri",n:"Chokri",p:"sprinter",c:["universal"],per:1},{id:"sp_chashmaabs",n:"Chashma (ABS)",p:"sprinter",c:["universal"],per:1},{id:"st_body",n:"Body",p:"stroller",c:["pink", "blue", "red"],per:1},{id:"st_footrest",n:"Footrest",p:"stroller",c:["universal"],per:1},{id:"st_wheel",n:"Wheel",p:"stroller",c:["universal"],per:1},{id:"st_arm",n:"Arm",p:"stroller",c:["pink", "blue", "red"],per:1},{id:"st_bumper",n:"Bumper",p:"stroller",c:["pink", "blue", "darkblue"],per:1},{id:"st_take",n:"Take",p:"stroller",c:["pink", "blue", "darkblue"],per:1},{id:"st_bonnet",n:"Bonnet",p:"stroller",c:["pink", "blue", "darkblue"],per:1},{id:"st_wrsq",n:"Wheel Ring Square",p:"stroller",c:["pink", "blue", "darkblue"],per:1},{id:"st_steerring",n:"Steering Ring",p:"stroller",c:["pink", "blue", "red"],per:1},{id:"st_seat",n:"Seat",p:"stroller",c:["pink", "blue", "darkblue"],per:1},{id:"st_steerup",n:"Steering Upper",p:"stroller",c:["pink", "blue", "darkblue"],per:1},{id:"st_steerlow",n:"Steering Lower",p:"stroller",c:["pink", "blue", "darkblue"],per:1},{id:"st_smirror",n:"Side Mirror",p:"stroller",c:["pink", "blue", "darkblue"],per:1},{id:"st_rlcrys",n:"Rearlight / SM (Crystal)",p:"stroller",c:["universal"],per:1},{id:"st_hlglass",n:"Headlight Glass (Crystal)",p:"stroller",c:["universal"],per:1},{id:"st_rearabs",n:"Rear / Exhaust / Logo (ABS)",p:"stroller",c:["universal"],per:1},{id:"st_takepc",n:"Take Piece (3)",p:"stroller",c:["pink", "blue", "darkblue"],per:1},{id:"st_armlockb",n:"Armlock(2) / Bailcha(3)",p:"stroller",c:["pink", "blue", "darkblue"],per:1},{id:"st_hlfabs",n:"HL / Foglight / Radiator (ABS)",p:"stroller",c:["universal"],per:1},{id:"st_bailcha",n:"Bailcha (Misc)",p:"stroller",c:["universal"],per:1},{id:"tw_body",n:"Body",p:"twilight",c:["pink", "blue"],per:1},{id:"tw_wheel",n:"Wheel",p:"twilight",c:["universal"],per:1},{id:"tw_take",n:"Take",p:"twilight",c:["pink", "blue"],per:1},{id:"tw_abc123",n:"Abc 123",p:"twilight",c:["universal"],per:1},{id:"tw_bonnet",n:"Bonnet / LR44 PP",p:"twilight",c:["pink", "blue"],per:1},{id:"tw_steering",n:"Steering",p:"twilight",c:["pink", "blue"],per:1},{id:"tw_seattrunk",n:"Seat / Trunk",p:"twilight",c:["pink", "blue"],per:1},{id:"tw_glasscap",n:"Glasscap / Ring / Punja / Patti / Btn / Tail",p:"twilight",c:["pink", "blue"],per:1},{id:"tw_pipe",n:"Pipe",p:"twilight",c:["universal"],per:1},{id:"tw_abcback",n:"Abc Black Back",p:"twilight",c:["universal"],per:1},{id:"tw_baja",n:"Baja / 2Piece / Kaan",p:"twilight",c:["pink", "blue"],per:1},{id:"tw_wcap",n:"Wheelcap",p:"twilight",c:["pink", "blue"],per:1},{id:"tw_iwcap",n:"Inner Wheelcap",p:"twilight",c:["pink", "blue"],per:1},{id:"tw_petglass",n:"Pet Glass",p:"twilight",c:["universal"],per:1},{id:"to_body",n:"Body",p:"tolo",c:["pink", "blue"],per:1},{id:"to_bonnet",n:"Bonnet",p:"tolo",c:["pink", "blue"],per:1},{id:"to_wheelwc",n:"Wheel / Wheel Cap",p:"tolo",c:["universal"],per:1},{id:"to_seatbump",n:"Seat / Bumper",p:"tolo",c:["pink", "blue"],per:1},{id:"to_take",n:"Take",p:"tolo",c:["pink", "blue"],per:1},{id:"to_wcap",n:"WheelCap",p:"tolo",c:["pink", "blue"],per:1},{id:"to_steering",n:"Steering",p:"tolo",c:["pink", "blue"],per:1},{id:"to_armface",n:"Arm / Arm Holder / Take Face",p:"tolo",c:["pink", "blue"],per:1},{id:"to_hlglass",n:"Headlight Glass",p:"tolo",c:["universal"],per:1},{id:"to_hlinner",n:"HL Inner / Music Piece / Baja Cap",p:"tolo",c:["pink", "blue"],per:1}];
const DEF_CROSS=[{id:"cx_pipe",n:"Stroller & Tolo Pipe",c:["universal"],per:1,products:["stroller","tolo"]}];
const DEF_ASM={stroller:{red:{darkblue:"darkblue"}}};

function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function fmtTS(ts){const d=new Date(ts),dd=String(d.getDate()).padStart(2,"0"),mm=String(d.getMonth()+1).padStart(2,"0"),yy=String(d.getFullYear()).slice(2);let h=d.getHours();const ap=h>=12?"PM":"AM";h=h%12||12;return`${dd}/${mm}/${yy} ${h}:${String(d.getMinutes()).padStart(2,"0")} ${ap}`}
function dlFile(b,f){const u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=f;document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(u)},150)}

function CBadge({color,CLR,size=12}){
  const c=CLR[color]||CLR.universal||{bg:"#888",fg:"#fff",lb:color};
  return <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",minWidth:size*3.2,height:size*1.7,borderRadius:5,background:c.bg,color:c.fg,fontSize:size*.85,fontWeight:900,letterSpacing:.5,padding:"0 7px",flexShrink:0,boxShadow:`0 2px 8px ${c.gw||"transparent"}`}}>{c.lb}</span>;
}
function SDot({syncing,dirty,okC,wnC,acc}){
  const c=syncing?acc:dirty?wnC:okC;
  return <span style={{display:"inline-block",width:7,height:7,borderRadius:"50%",background:c,marginRight:6,flexShrink:0,animation:syncing?"syncPulse .8s ease infinite":dirty?"pulse 1.5s ease infinite":"none",boxShadow:`0 0 6px ${c}`}}/>;
}

function PartRow({part,showProduct,showConfirm,stock,confirmed,editing,editVal,partAdjust,onSetEditing,onSetEditVal,onSetPartAdjust,onSaveStock,onAdjustStock,onToggleConfirm,theme,threshold,productThresholds,CLR,PRODUCTS}){
  const{dark,tx,txd,acc,okC,dnC,cb,card,S}=theme;
  const s=stock[part.id]||{};const isConf=!!confirmed[part.id];const isCross=!!part.products;
  const prodKey=isCross?"cross":part.p;
  const at=productThresholds[prodKey]!==undefined?productThresholds[prodKey]:threshold;
  return(
    <div style={{...S.crd,padding:"8px 10px",border:isConf?`1.5px solid ${okC}`:`1px solid ${cb}`,background:isConf?(dark?okC+"15":okC+"08"):card}}>
      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
        {showConfirm&&<span onClick={()=>onToggleConfirm(part.id)} style={{cursor:"pointer",fontSize:20,flexShrink:0}}>{isConf?"✅":"⬜"}</span>}
        {isConf&&!showConfirm&&<span style={{fontSize:14,flexShrink:0}}>✅</span>}
        <div style={{display:"flex",alignItems:"center",flexWrap:"wrap",gap:6,flex:1}}>
          <span style={{fontWeight:900,fontSize:18,lineHeight:1.1}}>{part.n}</span>
          {isCross&&<span style={{fontSize:10,background:acc+"22",color:acc,padding:"2px 6px",borderRadius:6,fontWeight:800}}>CROSS</span>}
          {showProduct&&<span style={{fontSize:10,background:txd+"33",color:txd,padding:"2px 6px",borderRadius:6,fontWeight:800}}>{part.products?"Cross":PRODUCTS[part.p]?.name||part.p}</span>}
          <span style={{fontSize:11,color:txd,fontWeight:800}}>×{part.per}/u</span>
        </div>
      </div>
      {part.c.map(c=>{
        const val=s[c]||0,adjKey=`${part.id}_${c}`,isEdit=editing===adjKey,sc=val<=at?dnC:okC;
        return(
          <div key={c} style={{marginBottom:6,padding:"6px 8px",background:dark?"#1f222e":"#f8f9fa",borderRadius:6,border:`1px solid ${dark?"#2d3142":"#e9ecef"}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:isEdit?0:4}}>
              <CBadge color={c} CLR={CLR} size={12}/>
              {isEdit?(
                <div style={{display:"flex",gap:4}}>
                  <input type="number" inputMode="numeric" autoFocus value={editVal} onChange={e=>onSetEditVal(e.target.value)}
                    onKeyDown={e=>{if(e.key==="Enter")onSaveStock(part.id,c);if(e.key==="Escape")onSetEditing(null)}}
                    style={{...S.inp,width:70,fontSize:15,fontWeight:900,textAlign:"center",height:32,padding:"4px"}}/>
                  <button onClick={()=>onSaveStock(part.id,c)} style={{...S.bSm(okC),padding:"0 12px",fontSize:14}}>✓</button>
                </div>
              ):(
                <span onClick={()=>{onSetEditing(adjKey);onSetEditVal(String(val))}}
                  style={{fontWeight:900,fontSize:20,color:sc,cursor:"pointer",borderBottom:`2px dashed ${txd}`,paddingBottom:1}}>
                  {val.toLocaleString()}
                </span>
              )}
            </div>
            {!isEdit&&(
              <div style={{display:"flex",gap:4,alignItems:"center"}}>
                <button onClick={()=>onAdjustStock(part.id,c,-1)} style={{...S.btn(dnC),flex:.7,height:32,fontSize:18,fontWeight:900,padding:0}}>−</button>
                <input type="number" inputMode="numeric" placeholder="Qty" value={partAdjust[adjKey]||""} onChange={e=>onSetPartAdjust(adjKey,e.target.value)}
                  style={{...S.inp,width:55,height:32,fontSize:13,textAlign:"center",fontWeight:800,padding:"0 2px"}}/>
                <button onClick={()=>onAdjustStock(part.id,c,1)} style={{...S.btn(okC),flex:.7,height:32,fontSize:18,fontWeight:900,padding:0}}>+</button>
                <button onClick={()=>onSetPartAdjust(adjKey,String((parseInt(partAdjust[adjKey])||0)+100))} style={{...S.bSm(acc),flex:1,height:32,fontSize:12,fontWeight:800,padding:0}}>+100</button>
                <button onClick={()=>onSetPartAdjust(adjKey,String((parseInt(partAdjust[adjKey])||0)+200))} style={{...S.bSm(acc),flex:1,height:32,fontSize:12,fontWeight:800,padding:0}}>+200</button>
                <button onClick={()=>onSetPartAdjust(adjKey,String((parseInt(partAdjust[adjKey])||0)+500))} style={{...S.bSm(acc),flex:1,height:32,fontSize:12,fontWeight:800,padding:0}}>+500</button>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function Modal({show,onClose,title,children,theme}){
  if(!show)return null;const{txd,S}=theme;
  return(<div className="modal-bg" style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,.75)",zIndex:200,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"40px 12px 20px",backdropFilter:"blur(6px)",overflowY:"auto"}} onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
    <div className="modal-card" style={{...S.crd,margin:0,maxWidth:440,width:"100%",padding:"18px 16px",borderRadius:16,maxHeight:"85vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div style={{fontSize:17,fontWeight:900}}>{title}</div>
        <button onClick={onClose} style={{background:"none",border:"none",color:txd,fontSize:20,cursor:"pointer",padding:"2px 6px"}}>✕</button>
      </div>{children}
    </div>
  </div>);
}

function MgrColors({CLR,onAdd,onEdit,onDel,theme,toast}){
  const{dark,tx,txd,acc,okC,dnC,S}=theme;
  const[nk,setNk]=useState("");const[nl,setNl]=useState("");const[nh,setNh]=useState("#ff6b6b");
  const[ek,setEk]=useState(null);const[el,setEl]=useState("");const[eh,setEh]=useState("");
  const[cd,setCd]=useState(null);
  return(<div>
    <div style={{fontSize:12,fontWeight:800,color:txd,marginBottom:8}}>Add/edit/delete colors for your parts.</div>
    {Object.entries(CLR).map(([k,v])=>(<div key={k} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",marginBottom:4,background:dark?"#0e1019":"#f5f6f9",borderRadius:8,border:`1px solid ${dark?"#1a1d2e":"#eceef3"}`}}>
      <div style={{width:28,height:28,borderRadius:6,background:v.bg,flexShrink:0}}/>
      {ek===k?(<div style={{flex:1,display:"flex",gap:4,alignItems:"center",flexWrap:"wrap"}}>
        <input value={el} onChange={e=>setEl(e.target.value)} style={{...S.inp,flex:1,minWidth:60,height:30,fontSize:12,padding:"2px 6px"}} placeholder="Label"/>
        <input type="color" value={eh} onChange={e=>setEh(e.target.value)} style={{width:30,height:30,border:"none",padding:0,cursor:"pointer",borderRadius:4}}/>
        <button onClick={()=>{onEdit(k,el,eh);setEk(null)}} style={{...S.bSm(okC),height:30}}>✓</button>
        <button onClick={()=>setEk(null)} style={{...S.bSm(dark?"#333":"#ddd",tx),height:30}}>✕</button>
      </div>):cd===k?(<div style={{flex:1,display:"flex",gap:4,alignItems:"center"}}>
        <span style={{fontSize:12,fontWeight:800,color:dnC}}>Delete {v.lb}?</span><div style={{flex:1}}/>
        <button onClick={()=>{onDel(k);setCd(null)}} style={{...S.bSm(dnC),height:28}}>Yes</button>
        <button onClick={()=>setCd(null)} style={{...S.bSm(dark?"#333":"#ddd",tx),height:28}}>No</button>
      </div>):(<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div><div style={{fontWeight:900,fontSize:13}}>{v.lb}</div><div style={{fontSize:10,color:txd}}>{k} · {v.bg}</div></div>
        <div style={{display:"flex",gap:4}}>
          <button onClick={()=>{setEk(k);setEl(v.lb);setEh(v.bg)}} style={S.iBtn}>✏️</button>
          {k!=="universal"&&<button onClick={()=>setCd(k)} style={{...S.iBtn,color:dnC+"aa"}}>🗑️</button>}
        </div>
      </div>)}
    </div>))}
    <div style={{marginTop:12,padding:"12px",background:dark?"#0e1019":"#f5f6f9",borderRadius:10,border:`1px solid ${dark?"#1a1d2e":"#eceef3"}`}}>
      <div style={{fontSize:11,fontWeight:900,color:acc,marginBottom:6}}>+ ADD COLOR</div>
      <div style={{display:"flex",gap:4,marginBottom:6}}>
        <input placeholder="Key (green)" value={nk} onChange={e=>setNk(e.target.value.toLowerCase().replace(/[^a-z0-9]/g,""))} style={{...S.inp,flex:1,height:34,fontSize:12}}/>
        <input placeholder="Label" value={nl} onChange={e=>setNl(e.target.value)} style={{...S.inp,flex:1,height:34,fontSize:12}}/>
        <input type="color" value={nh} onChange={e=>setNh(e.target.value)} style={{width:34,height:34,border:"none",padding:0,cursor:"pointer",borderRadius:6}}/>
      </div>
      <button onClick={()=>{if(!nk||!nl){toast("Fill both","err");return}if(CLR[nk]){toast("Exists","err");return}onAdd(nk,nl,nh);setNk("");setNl("")}} disabled={!nk||!nl} style={{...S.btn(okC),width:"100%",height:36,borderRadius:8,opacity:(!nk||!nl)?.5:1}}>Add Color</button>
    </div>
  </div>);
}

function MgrProducts({PRODUCTS,PARTS,onAdd,onEdit,onDel,theme,toast}){
  const{dark,tx,txd,acc,okC,dnC,S}=theme;
  const[nn,setNn]=useState("");const[ni,setNi]=useState("📦");
  const[ek,setEk]=useState(null);const[en,setEn]=useState("");const[ei,setEi]=useState("");
  const[cd,setCd]=useState(null);
  return(<div>
    <div style={{fontSize:12,fontWeight:800,color:txd,marginBottom:8}}>Each product = a tab. Add Sparkle etc here.</div>
    {Object.entries(PRODUCTS).map(([k,v])=>(<div key={k} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",marginBottom:4,background:dark?"#0e1019":"#f5f6f9",borderRadius:8,border:`1px solid ${dark?"#1a1d2e":"#eceef3"}`}}>
      <span style={{fontSize:22}}>{v.icon}</span>
      {ek===k?(<div style={{flex:1,display:"flex",gap:4,alignItems:"center",flexWrap:"wrap"}}>
        <input value={en} onChange={e=>setEn(e.target.value)} style={{...S.inp,flex:1,minWidth:60,height:30,fontSize:12,padding:"2px 6px"}}/>
        <input value={ei} onChange={e=>setEi(e.target.value)} style={{...S.inp,width:40,height:30,fontSize:16,textAlign:"center",padding:"2px"}}/>
        <button onClick={()=>{onEdit(k,en,ei);setEk(null)}} style={{...S.bSm(okC),height:30}}>✓</button>
        <button onClick={()=>setEk(null)} style={{...S.bSm(dark?"#333":"#ddd",tx),height:30}}>✕</button>
      </div>):cd===k?(<div style={{flex:1,display:"flex",gap:4,alignItems:"center"}}>
        <span style={{fontSize:12,fontWeight:800,color:dnC}}>Delete {v.name} + parts?</span><div style={{flex:1}}/>

// ═══════════════ MAIN APP ═══════════════
function App(){
  const[dark,setDark]=useState(()=>{const s=localStorage.getItem(THEME_KEY);return s!==null?JSON.parse(s):true});
  
  const[CLR,setCLR]=useState(DEF_COLORS);
  const[PRODUCTS,setProducts]=useState(DEF_PRODUCTS);
  const[PARTS,setParts]=useState(DEF_PARTS);
  const[CROSS,setCross]=useState(DEF_CROSS);
  const[asmRules,setAsmRules]=useState(DEF_ASM);
  
  const[mainTab,setMainTab]=useState("products");
  const[prodTab,setProdTab]=useState("sprinter");
  const[stock,setStock]=useState({});
  const[logs,setLogs]=useState([]);
  const[confirmed,setConfirmed]=useState({});
  const[notes,setNotes]=useState("");
  const[productNotes,setProductNotes]=useState({});
  const[threshold,setThreshold]=useState(600);
  const[productThresholds,setProductThresholds]=useState({});
  const[loaded,setLoaded]=useState(false);
  const[syncing,setSyncing]=useState(false);
  const[dirty,setDirty]=useState(false);
  const[lastSync,setLastSync]=useState(null);
  const[toast,setToast]=useState(null);
  const[toastAnim,setToastAnim]=useState("enter");
  const[editing,setEditing]=useState(null);
  const[editVal,setEditVal]=useState("");
  const[asmColor,setAsmColor]=useState({});
  const[asmQty,setAsmQty]=useState({});
  const[confirmAsm,setConfirmAsm]=useState(null);
  const[showClear,setShowClear]=useState(false);
  const[logFilter,setLogFilter]=useState("all");
  const[stockFilter,setStockFilter]=useState("all");
  const[editLogId,setEditLogId]=useState(null);
  const[editLogText,setEditLogText]=useState("");
  const[partAdjust,setPartAdjust]=useState({});
  const[searchQuery,setSearchQuery]=useState("");
  const[showManage,setShowManage]=useState(null);

  const toastTimerRef=useRef(null);const notesRef=useRef(null);const productNotesRef=useRef({});
  const dirtyRef=useRef(false);const modalOpenRef=useRef(false);
  useEffect(()=>{modalOpenRef.current=!!showManage},[showManage]);
  useEffect(()=>{localStorage.setItem(THEME_KEY,JSON.stringify(dark))},[dark]);

  const allParts=useMemo(()=>[...PARTS,...CROSS],[PARTS,CROSS]);
  const getProductParts=useCallback(pid=>[...PARTS.filter(p=>p.p===pid),...CROSS.filter(cp=>cp.products&&cp.products.includes(pid))],[PARTS,CROSS]);
  const getPartColorForAsm=useCallback((part,color,pid)=>{if(part.c.includes("universal"))return"universal";if(part.c.includes(color))return color;const r=asmRules[pid];if(r&&r[color]){for(const[,to]of Object.entries(r[color])){if(part.c.includes(to))return to}}return null},[asmRules]);
  const getAsmColors=useCallback(pid=>{const pp=getProductParts(pid);const ac=new Set();pp.forEach(p=>p.c.forEach(c=>{if(c!=="universal")ac.add(c)}));return[...ac].filter(c=>pp.every(p=>getPartColorForAsm(p,c,pid)!==null))},[getProductParts,getPartColorForAsm]);
  const calcMax=useCallback((pid,color,stk)=>{const pp=getProductParts(pid);let m=Infinity;for(const p of pp){const mp=getPartColorForAsm(p,color,pid);if(!mp)return 0;m=Math.min(m,Math.floor((stk[p.id]?.[mp]||0)/(p.per||1)))}return m===Infinity?0:m},[getProductParts,getPartColorForAsm]);

  const showToast=useCallback((msg,type="ok")=>{clearTimeout(toastTimerRef.current);setToastAnim("enter");setToast({msg,type});toastTimerRef.current=setTimeout(()=>{setToastAnim("exit");setTimeout(()=>setToast(null),250)},2200)},[]);

  const serialize=useCallback(()=>({stock,logs:logs.slice(0,2000),confirmed,notes,productNotes,productThresholds,threshold,colors:CLR,products:PRODUCTS,parts:PARTS,crossParts:CROSS,asmRules,updatedAt:Date.now()}),[stock,logs,confirmed,notes,productNotes,productThresholds,threshold,CLR,PRODUCTS,PARTS,CROSS,asmRules]);
  const serializeRef=useRef(serialize);serializeRef.current=serialize;

  const loadData=useCallback((d)=>{
    if(d.colors)setCLR(p=>({...DEF_COLORS,...d.colors}));
    if(d.products)setProducts(d.products);if(d.parts)setParts(d.parts);
    if(d.crossParts!==undefined)setCross(d.crossParts||[]);if(d.asmRules)setAsmRules(d.asmRules||{});
    const ap=[...(d.parts||DEF_PARTS),...(d.crossParts||DEF_CROSS)];
    const mg={};ap.forEach(p=>{mg[p.id]={};p.c.forEach(c=>{mg[p.id][c]=0})});
    Object.keys(d.stock||{}).forEach(k=>{if(mg[k]||ap.find(p=>p.id===k))mg[k]={...(mg[k]||{}),...d.stock[k]}});
    setStock(mg);setLogs(d.logs||[]);setConfirmed(d.confirmed||{});
    if(d.threshold)setThreshold(d.threshold);if(d.productThresholds)setProductThresholds(d.productThresholds);
    if(d.notes!=null)setNotes(d.notes);if(d.productNotes)setProductNotes(d.productNotes);
    return mg;
  },[]);

  // --- FIREBASE PULL ---
  const pullCloud=useCallback(async()=>{
    if(modalOpenRef.current)return false;
    setSyncing(true);
    try{
      const r=await fetch(`${FB_URL}${FB_PATH}.json?_t=${Date.now()}`,{cache:"no-store"});
      if(!r.ok){
         console.error("Firebase Pull Error:", r.status, await r.text());
         setSyncing(false); return false;
      }
      const d=await r.json();
      if(d&&(d.stock||d.products)){
        loadData(d);
        localStorage.setItem(STORE_KEY,JSON.stringify(d));
        setLastSync(new Date());setDirty(false);dirtyRef.current=false;setSyncing(false);return true;
      }
    }catch(e){console.error("Pull Network Error:",e)}
    setSyncing(false);return false;
  },[loadData]);

  // --- FIREBASE PUSH (WITH DEBUGGER) ---
  const pushCloud=useCallback(async data=>{
    setSyncing(true);
    try{
      const payload=data||serializeRef.current();
      const r=await fetch(`${FB_URL}${FB_PATH}.json`,{
         method:"PUT",
         headers:{"Content-Type":"application/json"},
         body:JSON.stringify(payload)
      });
      if(r.ok){
         localStorage.setItem(STORE_KEY,JSON.stringify(payload));
         setLastSync(new Date());setDirty(false);dirtyRef.current=false;
         showToast("☁️ Synced!");
      } else {
         const errText = await r.text();
         console.error("Firebase Save Rejected:", r.status, errText);
         showToast("Save failed - Check Console","err");
      }
    }catch(e){
      console.error("Save Network Error:", e);
      showToast("Offline","wrn");
    }
    setSyncing(false);
  },[showToast]);

  const markDirty=useCallback((ov={})=>{
    setDirty(true);dirtyRef.current=true;
    const d={stock:ov.stock||stock,logs:(ov.logs||logs).slice(0,2000),confirmed:ov.confirmed||confirmed,
      notes:ov.notes!==undefined?ov.notes:notes,productNotes:ov.productNotes||productNotes,
      productThresholds:ov.productThresholds||productThresholds,threshold:ov.threshold!==undefined?ov.threshold:threshold,
      colors:ov.colors||CLR,products:ov.products||PRODUCTS,parts:ov.parts||PARTS,crossParts:ov.crossParts||CROSS,
      asmRules:ov.asmRules||asmRules,updatedAt:Date.now()};
    localStorage.setItem(STORE_KEY,JSON.stringify(d));pushCloud(d);
  },[stock,logs,confirmed,notes,productNotes,productThresholds,threshold,CLR,PRODUCTS,PARTS,CROSS,asmRules,pushCloud]);

  // --- REAL-TIME EVENT SOURCE ---
  useEffect(()=>{
    let es=null;let reconnectTimer=null;
    const connect=()=>{
      try{
        es=new EventSource(`${FB_URL}${FB_PATH}.json`);
        es.addEventListener("put",(ev)=>{
          try{
            const payload=JSON.parse(ev.data);
            const d=payload.data;
            if(!d)return;
            if(dirtyRef.current)return; 
            if(payload.path === "/") {
               if(d.stock || d.products) {
                  loadData(d);
                  localStorage.setItem(STORE_KEY,JSON.stringify(d));
                  setLastSync(new Date());setDirty(false);dirtyRef.current=false;
               }
            } else {
               if(!dirtyRef.current) pullCloud();
            }
          }catch(e){}
        });
        es.addEventListener("patch",(ev)=>{
          if(!dirtyRef.current) pullCloud();
        });
        es.onerror=()=>{
          es.close();
          reconnectTimer=setTimeout(connect,3000);
        };
      }catch(e){reconnectTimer=setTimeout(connect,5000)}
    };
    connect();

    const onWake = () => {
      if (document.visibilityState === "visible") {
        if (es && es.readyState !== 1) { 
          es.close(); pullCloud(); connect();
        }
      }
    };
    document.addEventListener("visibilitychange", onWake);

    return()=>{
      if(es)es.close();
      clearTimeout(reconnectTimer);
      document.removeEventListener("visibilitychange", onWake);
    };
  },[pullCloud, loadData]);

  const renderLog=()=>{const fl=logFilter==="all"?logs:logs.filter(l=>l.p===logFilter);return(<div><div style={{padding:"10px 10px 4px",fontSize:15,fontWeight:900}}>📋 Log</div><div style={{display:"flex",gap:4,padding:"0 8px 8px",overflowX:"auto"}}>{["all",...Object.keys(PRODUCTS),"cross"].map(f=>(<button key={f} onClick={()=>setLogFilter(f)} style={{...S.btn(logFilter===f?acc:"transparent",logFilter===f?"#fff":txd),padding:"4px 10px",fontSize:12,border:`1px solid ${logFilter===f?acc:cb}`,whiteSpace:"nowrap"}}>{f==="all"?"All":f==="cross"?"Cross":PRODUCTS[f]?.name||f}</button>))}</div>{!fl.length&&<div style={{...S.crd,textAlign:"center",color:txd,padding:16,fontSize:13}}>No activity</div>}{fl.slice(0,100).map(l=>(<div key={l.id} style={{...S.crd,padding:"10px 12px",marginBottom:2}}><div style={{display:"flex",alignItems:"flex-start",gap:8}}><div style={{paddingTop:5,flexShrink:0}}><div style={{width:8,height:8,borderRadius:"50%",background:l.a==="assemble"?okC:l.a==="adjust"||l.a==="stock_edit"?acc:wnC}}/></div><div style={{flex:1,minWidth:0}}><div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:2}}><span style={S.tag(l.a==="assemble"?okC:l.a==="adjust"||l.a==="stock_edit"?acc:wnC)}>{l.a}</span>{l.p&&<span style={{fontSize:10,color:txd,fontWeight:800}}>{PRODUCTS[l.p]?.name||l.p}</span>}</div>{editLogId===l.id?(<div style={{marginTop:4}}><input value={editLogText} onChange={e=>setEditLogText(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")saveLogEdit(l.id);if(e.key==="Escape")setEditLogId(null)}} autoFocus style={{...S.inp,marginBottom:4,fontSize:13}}/><div style={{display:"flex",gap:4}}><button onClick={()=>saveLogEdit(l.id)} style={{...S.bSm(okC),flex:1}}>Save</button><button onClick={()=>setEditLogId(null)} style={{...S.bSm(dark?"#444":"#ccc",tx),flex:1}}>Cancel</button></div></div>):(<div style={{fontSize:13,fontWeight:800,lineHeight:1.3}}>{l.d}</div>)}<div style={{fontSize:10,color:txd,marginTop:2,fontWeight:600}}>{fmtTS(l.ts)}</div></div><div style={{display:"flex",flexDirection:"column",gap:4}}><button onClick={()=>{setEditLogId(l.id);setEditLogText(l.d)}} style={S.iBtn}>✏️</button><button onClick={()=>deleteLog(l.id)} style={{...S.iBtn,color:dnC+"aa"}}>🗑️</button></div></div></div>))}{logs.length>0&&<div style={{padding:"8px 10px"}}><button onClick={clearLogs} style={{...S.btn("transparent",dnC),border:`1px solid ${dnC}`,width:"100%",fontSize:12}}>🗑️ Clear All</button></div>}</div>)};

  const renderConfirm=()=>{const pk=Object.keys(PRODUCTS);const tp=allParts.length,tc=allParts.filter(p=>confirmed[p.id]).length;const pct=tp?Math.round(tc/tp*100):0;return(<div><div style={{padding:"10px 10px 4px",fontSize:15,fontWeight:900}}>✅ Verify</div><div style={{...S.crd,padding:"12px 14px"}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:12,fontWeight:900}}>Progress</span><span style={{fontSize:14,fontWeight:900,color:pct===100?okC:pct>50?wnC:txd}}>{pct}%</span></div><div style={{height:6,borderRadius:3,background:dark?"#1a1d2a":"#e8eaef",overflow:"hidden"}}><div style={{width:`${pct}%`,height:"100%",borderRadius:3,background:pct===100?okC:pct>50?wnC:acc,transition:"width .4s"}}/></div><div style={{fontSize:10,color:txd,marginTop:4,fontWeight:700}}>{tc}/{tp}</div></div><div style={{padding:"4px 8px 8px",display:"flex",gap:6}}><button onClick={resetConfirm} style={{...S.btn("transparent",wnC),border:`1.5px solid ${wnC}44`,flex:1,fontSize:12,borderRadius:10}}>🔄 Clear</button><button onClick={confirmAll} style={{...S.btn(okC),flex:1,fontSize:12,borderRadius:10}}>✅ All</button></div>{pk.map(pid=>{let pp=getProductParts(pid);if(searchQuery)pp=pp.filter(p=>p.n.toLowerCase().includes(searchQuery.toLowerCase()));if(!pp.length)return null;const cc=pp.filter(p=>confirmed[p.id]).length;return(<div key={pid}><div style={{padding:"6px 10px 2px",fontSize:11,fontWeight:900,color:txd,textTransform:"uppercase",display:"flex",justifyContent:"space-between"}}><span>{PRODUCTS[pid]?.icon} {PRODUCTS[pid]?.name}</span><span style={{color:cc===pp.length?okC:wnC}}>{cc}/{pp.length}</span></div>{pp.map(p=>(<div key={p.id} onClick={()=>toggleConfirm(p.id)} style={{...S.crd,padding:"10px",display:"flex",alignItems:"center",gap:8,cursor:"pointer",background:confirmed[p.id]?okC+"15":card,border:confirmed[p.id]?`1px solid ${okC}`:`1px solid ${cb}`}}><span style={{fontSize:20}}>{confirmed[p.id]?"✅":"⬜"}</span><div style={{flex:1}}><div style={{fontWeight:900,fontSize:13}}>{p.n}</div><div style={{fontSize:10,color:txd,marginTop:2,fontWeight:700}}>{p.c.map(c=>CLR[c]?.lb||c).join(", ")}</div></div></div>))}</div>)})}</div>)};

  const renderSettings=()=>(<div>
    <div style={{padding:"12px 12px 4px",fontSize:15,fontWeight:900}}>⚙️ Settings</div>
    <div style={{padding:"8px 10px 2px",fontSize:10,fontWeight:900,color:acc,letterSpacing:.5}}>🔧 MANAGE</div>
    <div style={S.crd}><div style={{display:"flex",flexDirection:"column",gap:6}}>
      {[{k:"colors",i:"🎨",l:"Colors",d:Object.keys(CLR).length},{k:"products",i:"📦",l:"Products",d:Object.keys(PRODUCTS).length},{k:"parts",i:"🔩",l:"Parts",d:PARTS.length},{k:"links",i:"🔗",l:"Cross-Links",d:CROSS.length}].map(m=>(<button key={m.k} onClick={()=>setShowManage(m.k)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:dark?"#0e1019":"#f5f6f9",borderRadius:10,border:`1px solid ${dark?"#1a1d2e":"#eceef3"}`,cursor:"pointer",textAlign:"left",fontFamily:"'Nunito',sans-serif"}}><span style={{fontSize:20}}>{m.i}</span><div style={{flex:1}}><div style={{fontWeight:900,fontSize:14,color:tx}}>{m.l}</div><div style={{fontSize:11,color:txd,fontWeight:700}}>{m.d} items</div></div><span style={{color:txd,fontSize:16}}>›</span></button>))}
    </div></div>
    <div style={S.crd}><label style={S.lbl}>Cloud Sync</label><button onClick={pullCloud} disabled={syncing} style={{...S.btn(acc),width:"100%",height:38,borderRadius:10}}>{syncing?"Syncing...":"⬇️ Pull from Cloud"}</button>{lastSync&&<div style={{fontSize:10,color:txd,marginTop:5,textAlign:"center",fontWeight:700}}>Last: {fmtTS(lastSync.getTime())}</div>}</div>
    <div style={S.crd}><label style={S.lbl}>Export</label><div style={{display:"flex",gap:6}}><button onClick={doExportJSON} style={{...S.btn(acc),flex:1,height:38,borderRadius:10}}>📥 JSON</button><button onClick={doExportCSV} style={{...S.btn(okC),flex:1,height:38,borderRadius:10}}>📊 CSV</button></div></div>
    <div style={S.crd}><label style={S.lbl}>Import</label><label style={{...S.btn(wnC),cursor:"pointer",width:"100%",height:38,justifyContent:"center",borderRadius:10}}>📤 Import JSON<input type="file" accept=".json" onChange={handleImport} style={{display:"none"}}/></label></div>
    <div style={S.crd}><label style={S.lbl}>Low Stock Threshold</label><input type="number" inputMode="numeric" value={threshold} onChange={e=>{const v=parseInt(e.target.value)||0;setThreshold(v);markDirty({threshold:v})}} style={{...S.inp,fontSize:16,fontWeight:900,textAlign:"center",height:42}}/></div>
    <div style={S.crd}><label style={S.lbl}>Product Thresholds</label><div style={{display:"flex",flexDirection:"column",gap:6}}>{[...Object.keys(PRODUCTS),"cross"].map(p=>(<div key={p} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:dark?"#0e1019":"#f5f6f9",padding:"8px 10px",borderRadius:8,border:`1px solid ${dark?"#1a1d2e":"#eceef3"}`}}><div style={{fontSize:13,fontWeight:800}}>{p==="cross"?"🔗 Cross":`${PRODUCTS[p]?.icon||""} ${PRODUCTS[p]?.name||p}`}</div><input type="number" placeholder={`${threshold}`} value={productThresholds[p]!==undefined?productThresholds[p]:""} onChange={e=>{const v=e.target.value===""?undefined:parseInt(e.target.value);const n={...productThresholds};if(v===undefined)delete n[p];else n[p]=v;setProductThresholds(n);markDirty({productThresholds:n})}} style={{...S.inp,width:72,fontSize:13,fontWeight:800,textAlign:"center",height:30,padding:"2px"}}/></div>))}</div></div>
    <div style={S.crd}><label style={S.lbl}>Notes</label><textarea rows={6} value={notes} onChange={e=>handleNotes(e.target.value)} placeholder="Shared notes..." style={{...S.inp,minHeight:80,resize:"vertical",lineHeight:1.5,borderRadius:10}}/></div>
    <div style={S.crd}><label style={S.lbl}>Theme</label><div style={{display:"flex",gap:6}}><button onClick={()=>setDark(true)} style={{...S.btn(dark?acc:cb,dark?"#fff":tx),flex:1,height:38,borderRadius:10}}>🌙 Dark</button><button onClick={()=>setDark(false)} style={{...S.btn(!dark?acc:cb,!dark?"#fff":tx),flex:1,height:38,borderRadius:10}}>☀️ Light</button></div></div>
    <div style={S.crd}><label style={S.lbl}>Data</label><span style={{fontSize:12,fontWeight:800}}>{dataSize} KB</span></div>
    <div style={{padding:"12px 12px 2px",fontSize:10,fontWeight:900,color:dnC}}>DANGER ZONE</div>
    <div style={{...S.crd,borderColor:dnC+"33"}}><button onClick={()=>setShowClear(true)} style={{...S.btn(dnC),width:"100%",height:40,borderRadius:10}}>🚨 Clear All Data</button></div>
  </div>);

  // ═══ MAIN RENDER ═══
  return(<div style={S.app}>
    {toast&&<div className={toastAnim==="enter"?"toast-enter":"toast-exit"} style={S.toast}>{toast.msg}</div>}
    {showClear&&(<div className="modal-bg" style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,.8)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:20,backdropFilter:"blur(6px)"}}><div className="modal-card" style={{...S.crd,margin:0,maxWidth:300,width:"100%",textAlign:"center",padding:"24px 20px",borderRadius:16}}><div style={{fontSize:44,marginBottom:8}}>⚠️</div><h2 style={{marginTop:0,color:dnC,fontSize:20,fontWeight:900}}>CLEAR ALL?</h2><p style={{color:txd,marginBottom:18,fontSize:13,fontWeight:700}}>Deletes stock, logs, notes.</p><div style={{display:"flex",flexDirection:"column",gap:8}}><button onClick={()=>setShowClear(false)} style={{...S.btn(okC),width:"100%",height:42,fontSize:14,borderRadius:10}}>✅ Cancel</button><button onClick={()=>{wipeData();setShowClear(false)}} style={{...S.btn("transparent",dnC),border:`2px solid ${dnC}`,width:"100%",height:42,fontSize:14,borderRadius:10}}>🚨 Delete</button></div></div></div>)}
    {confirmAsm&&(<div className="modal-bg" style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,.75)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:20,backdropFilter:"blur(6px)"}}><div className="modal-card" style={{...S.crd,margin:0,maxWidth:300,width:"100%",textAlign:"center",padding:"24px 20px",borderRadius:16}}><div style={{fontSize:40,marginBottom:8}}>{PRODUCTS[confirmAsm.pid]?.icon}</div><div style={{fontSize:17,fontWeight:900,marginBottom:6}}>Confirm Assembly</div><div style={{fontSize:13,color:txd,marginBottom:16,lineHeight:1.4}}>Make <strong style={{color:CLR[confirmAsm.color]?.bg}}>{confirmAsm.qty} {CLR[confirmAsm.color]?.lb}</strong> {PRODUCTS[confirmAsm.pid]?.name}{confirmAsm.qty>1?"s":""}?{calcMax(confirmAsm.pid,confirmAsm.color,stock)<confirmAsm.qty&&(<div style={{color:wnC,fontSize:11,marginTop:4,fontWeight:900}}>⚠️ Parts will go below 0</div>)}</div><div style={{display:"flex",gap:8}}><button onClick={()=>setConfirmAsm(null)} style={{...S.btn(dark?"#252836":"#e0e3ea",tx),flex:1,height:40,fontSize:13,borderRadius:10}}>Cancel</button><button onClick={confirmDoAssemble} style={{...S.btn(okC),flex:1,height:40,fontSize:13,borderRadius:10}}>Confirm</button></div></div></div>)}

    <Modal show={showManage==="colors"} onClose={()=>setShowManage(null)} title="🎨 Colors" theme={theme}><MgrColors CLR={CLR} onAdd={addColor} onEdit={editColor} onDel={deleteColor} theme={theme} toast={showToast}/></Modal>
    <Modal show={showManage==="products"} onClose={()=>setShowManage(null)} title="📦 Products" theme={theme}><MgrProducts PRODUCTS={PRODUCTS} PARTS={PARTS} onAdd={addProduct} onEdit={editProduct} onDel={deleteProduct} theme={theme} toast={showToast}/></Modal>
    <Modal show={showManage==="parts"} onClose={()=>setShowManage(null)} title="🔩 Parts" theme={theme}><MgrParts PRODUCTS={PRODUCTS} PARTS={PARTS} CLR={CLR} onAdd={addPart} onEdit={editPart} onDel={deletePart} theme={theme} toast={showToast}/></Modal>
    <Modal show={showManage==="links"} onClose={()=>setShowManage(null)} title="🔗 Cross-Links" theme={theme}><MgrCross PRODUCTS={PRODUCTS} CROSS={CROSS} CLR={CLR} onAdd={addCross} onEdit={editCross} onDel={deleteCross} theme={theme} toast={showToast}/></Modal>

    <div style={{background:dark?"#0d0f18ee":"#ffffffee",borderBottom:`1px solid ${dark?"#1a1d2e":"#e0e3ea"}`,position:"sticky",top:0,zIndex:95,backdropFilter:"blur(16px)"}}>
      <div style={{padding:"6px 12px",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:`1px solid ${dark?"#ffffff08":"#00000008"}`}}>
        <div style={{display:"flex",alignItems:"center"}}><SDot syncing={syncing} dirty={dirty} okC={okC} wnC={wnC} acc={acc}/><span style={{fontSize:11,fontWeight:800,color:syncing?acc:dirty?wnC:okC,letterSpacing:.5}}>{syncing?"SYNCING":dirty?"SAVING":"SYNCED"}</span></div>
        <button onClick={()=>pushCloud()} disabled={syncing||!dirty} style={{...S.bSm(dirty?wnC+"22":acc+"15",dirty?wnC:acc),padding:"4px 12px",fontSize:11,opacity:(!dirty&&!syncing)?.4:1,border:`1px solid ${dirty?wnC+"44":acc+"33"}`,borderRadius:8}}>{syncing?"⏳":"☁️"} {dirty?"Save":"Synced"}</button>
      </div>
      <div style={{padding:"8px 12px 6px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{fontSize:17,fontWeight:900,display:"flex",alignItems:"center",gap:6}}>🏭 Little Star</div>
        <button onClick={()=>setDark(!dark)} style={{background:dark?"#ffffff10":"#0000000a",border:"none",color:txd,fontSize:16,cursor:"pointer",padding:"4px 8px",borderRadius:8}}>{dark?"☀️":"🌙"}</button>
      </div>
    </div>

    {mainTab==="products"&&(<div style={S.subNav}>{Object.keys(PRODUCTS).map(pid=>(<button key={pid} onClick={()=>{setProdTab(pid);setSearchQuery("")}} style={S.subNI(prodTab===pid)}><span style={{fontSize:13}}>{PRODUCTS[pid].icon}</span>{PRODUCTS[pid].name}</button>))}<button onClick={()=>{setProdTab("cross");setSearchQuery("")}} style={S.subNI(prodTab==="cross")}><span style={{fontSize:13}}>🔗</span>Cross</button></div>)}

    {["products","stock","confirm"].includes(mainTab)&&(<div style={{padding:"8px 10px 0",position:"relative"}}><input type="text" placeholder="Search parts..." value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} style={{...S.inp,height:38,fontSize:13,fontWeight:700,paddingLeft:34}}/><span style={{position:"absolute",left:20,top:"50%",transform:"translateY(-30%)",fontSize:14,opacity:.5,pointerEvents:"none"}}>🔍</span>{searchQuery&&<span onClick={()=>setSearchQuery("")} style={{position:"absolute",right:20,top:"50%",transform:"translateY(-30%)",fontSize:16,cursor:"pointer",opacity:.5}}>✕</span>}</div>)}

    <div style={{paddingBottom:8}}>
      {mainTab==="products"&&prodTab!=="cross"&&PRODUCTS[prodTab]&&renderProd(prodTab)}
      {mainTab==="products"&&prodTab==="cross"&&renderCross()}
      {mainTab==="stock"&&renderStock()}
      {mainTab==="log"&&renderLog()}
      {mainTab==="confirm"&&renderConfirm()}
      {mainTab==="settings"&&renderSettings()}
    </div>

    <nav style={S.nav}>{[{k:"products",i:"🏭",l:"Assembly"},{k:"stock",i:"📦",l:"Stock"},{k:"log",i:"📋",l:"Logs"},{k:"confirm",i:"✅",l:"Verify"},{k:"settings",i:"⚙️",l:"Settings"}].map(n=>(<button key={n.k} onClick={()=>{setMainTab(n.k);setSearchQuery("")}} style={S.nI(mainTab===n.k)}>{mainTab===n.k&&<div style={{position:"absolute",top:-1,left:"25%",right:"25%",height:2.5,borderRadius:2,background:acc,boxShadow:`0 0 8px ${acc}66`}}/>}<span style={{fontSize:17,marginBottom:1}}>{n.i}</span>{n.l}</button>))}</nav>
  </div>);
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);

</script>
</body>
</html>
