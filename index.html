    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;padding:0;background:#0a0c14;overflow-x:hidden}
    html,body{overscroll-behavior-y:contain}
    input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
    input[type=number]{-moz-appearance:textfield}
    ::-webkit-scrollbar{height:3px;width:3px}
    ::-webkit-scrollbar-thumb{background:#4f8cff44;border-radius:4px}
    @keyframes fadeInDown{from{opacity:0;transform:translate(-50%,-16px)}to{opacity:1;transform:translate(-50%,0)}}
    @keyframes fadeOut{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-16px)}}
    @keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    @keyframes syncPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.5}}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    @keyframes backdropIn{from{opacity:0}to{opacity:1}}
    .toast-enter{animation:fadeInDown .3s cubic-bezier(.34,1.56,.64,1) forwards}
    .toast-exit{animation:fadeOut .25s ease forwards}
    .modal-bg{animation:backdropIn .2s ease forwards}
    .modal-card{animation:slideUp .3s cubic-bezier(.34,1.56,.64,1) forwards}
    button{transition:transform .1s ease, opacity .15s ease}
    button:active:not(:disabled){transform:scale(.96) !important}

function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function fmtTS(ts){const d=new Date(ts),dd=String(d.getDate()).padStart(2,"0"),mm=String(d.getMonth()+1).padStart(2,"0"),yy=String(d.getFullYear()).slice(2);let h=d.getHours();const ap=h>=12?"PM":"AM";h=h%12||12;return`${dd}/${mm}/${yy} ${h}:${String(d.getMinutes()).padStart(2,"0")} ${ap}`}
function dlFile(b,f){const u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=f;document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(u)},150)}

function CBadge({color,CLR,size=11}){
  const c=CLR[color]||CLR.universal||{bg:"#888",fg:"#fff",lb:color};
  return <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",minWidth:size*3,height:size*1.6,borderRadius:4,background:c.bg,color:c.fg,fontSize:size*.85,fontWeight:900,letterSpacing:.4,padding:"0 5px",flexShrink:0,boxShadow:`0 1px 4px ${c.gw||"transparent"}`}}>{c.lb}</span>;
}
function SDot({syncing,dirty,okC,wnC,acc}){
  const c=syncing?acc:dirty?wnC:okC;
  return <span style={{display:"inline-block",width:7,height:7,borderRadius:"50%",background:c,marginRight:5,flexShrink:0,animation:syncing?"syncPulse .8s ease infinite":dirty?"pulse 1.5s ease infinite":"none",boxShadow:`0 0 6px ${c}`}}/>;
}

function PartRow({part,showProduct,showConfirm,stock,confirmed,editing,editVal,partAdjust,onSetEditing,onSetEditVal,onSetPartAdjust,onSaveStock,onAdjustStock,onToggleConfirm,theme,threshold,productThresholds,CLR,PRODUCTS}){
  const{dark,tx,txd,acc,okC,dnC,wnC,cb,card,S}=theme;
  const s=stock[part.id]||{};const isConf=!!confirmed[part.id];const isCross=!!part.products;
  const prodKey=isCross?"cross":part.p;
  const at=productThresholds[prodKey]!==undefined?productThresholds[prodKey]:threshold;
  return(
    <div style={{...S.crd,padding:"7px 9px",border:isConf?`1.5px solid ${okC}`:`1px solid ${cb}`,background:isConf?(dark?okC+"15":okC+"08"):card}}>
      <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:4}}>
        {showConfirm&&<span onClick={()=>onToggleConfirm(part.id)} style={{cursor:"pointer",fontSize:18,flexShrink:0}}>{isConf?"✅":"⬜"}</span>}
        {isConf&&!showConfirm&&<span style={{fontSize:12,flexShrink:0}}>✅</span>}
        <div style={{display:"flex",alignItems:"center",flexWrap:"wrap",gap:4,flex:1}}>
          <span style={{fontWeight:900,fontSize:14,lineHeight:1.1}}>{part.n}</span>
          {isCross&&<span style={{fontSize:9,background:acc+"22",color:acc,padding:"1px 5px",borderRadius:5,fontWeight:800}}>CROSS</span>}
          {showProduct&&<span style={{fontSize:9,background:txd+"33",color:txd,padding:"1px 5px",borderRadius:5,fontWeight:800}}>{part.products?"Cross":PRODUCTS[part.p]?.name||part.p}</span>}
          <span style={{fontSize:10,color:txd,fontWeight:800}}>×{part.per}/u</span>
        </div>
      </div>
      {part.c.map(c=>{
        const val=s[c]||0,adjKey=`${part.id}_${c}`,isEdit=editing===adjKey,sc=val<=at?dnC:okC;
        return(
          <div key={c} style={{marginBottom:4,padding:"5px 7px",background:dark?"#1f222e":"#f8f9fa",borderRadius:6,border:`1px solid ${dark?"#2d3142":"#e9ecef"}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:isEdit?0:3}}>
              <CBadge color={c} CLR={CLR} size={11}/>
              {isEdit?(
                <div style={{display:"flex",gap:3}}>
                  <input type="number" inputMode="numeric" autoFocus value={editVal} onChange={e=>onSetEditVal(e.target.value)}
                    onKeyDown={e=>{if(e.key==="Enter")onSaveStock(part.id,c);if(e.key==="Escape")onSetEditing(null)}}
                    style={{...S.inp,width:65,fontSize:14,fontWeight:900,textAlign:"center",height:30,padding:"3px"}}/>
                  <button onClick={()=>onSaveStock(part.id,c)} style={{...S.bSm(okC),padding:"0 10px",fontSize:13}}>✓</button>
                </div>
              ):(
                <span onClick={()=>{onSetEditing(adjKey);onSetEditVal(String(val))}}
                  style={{fontWeight:900,fontSize:18,color:sc,cursor:"pointer",borderBottom:`2px dashed ${txd}`,paddingBottom:1}}>
                  {val.toLocaleString()}
                </span>
              )}
            </div>
            {!isEdit&&(
              <div style={{display:"flex",gap:3,alignItems:"center"}}>
                <button onClick={()=>onAdjustStock(part.id,c,-1)} style={{...S.btn(dnC),flex:.6,height:30,fontSize:16,fontWeight:900,padding:0}}>−</button>
                <input type="number" inputMode="numeric" placeholder="Qty" value={partAdjust[adjKey]||""} onChange={e=>onSetPartAdjust(adjKey,e.target.value)}
                  style={{...S.inp,width:48,height:30,fontSize:12,textAlign:"center",fontWeight:800,padding:"0 2px"}}/>
                <button onClick={()=>onAdjustStock(part.id,c,1)} style={{...S.btn(okC),flex:.6,height:30,fontSize:16,fontWeight:900,padding:0}}>+</button>
                <button onClick={()=>onSetPartAdjust(adjKey,String((parseInt(partAdjust[adjKey])||0)+100))} style={{...S.bSm(acc),flex:1,height:30,fontSize:11,fontWeight:800,padding:0}}>+100</button>
                <button onClick={()=>onSetPartAdjust(adjKey,String((parseInt(partAdjust[adjKey])||0)+200))} style={{...S.bSm(acc),flex:1,height:30,fontSize:11,fontWeight:800,padding:0}}>+200</button>
                <button onClick={()=>onSetPartAdjust(adjKey,String((parseInt(partAdjust[adjKey])||0)+500))} style={{...S.bSm(acc),flex:1,height:30,fontSize:11,fontWeight:800,padding:0}}>+500</button>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function Modal({show,onClose,title,children,theme}){
  if(!show)return null;const{txd,S}=theme;
  return(<div className="modal-bg" style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,.75)",zIndex:200,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"40px 10px 20px",backdropFilter:"blur(6px)",overflowY:"auto"}} onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
    <div className="modal-card" style={{...S.crd,margin:0,maxWidth:440,width:"100%",padding:"14px 12px",borderRadius:14,maxHeight:"85vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div style={{fontSize:15,fontWeight:900}}>{title}</div>
        <button onClick={onClose} style={{background:"none",border:"none",color:txd,fontSize:18,cursor:"pointer",padding:"2px 6px"}}>✕</button>
      </div>{children}
    </div>
  </div>);
}

function MgrColors({CLR,onAdd,onEdit,onDel,theme,toast}){
  const{dark,tx,txd,acc,okC,dnC,S}=theme;
  const[nk,setNk]=useState("");const[nl,setNl]=useState("");const[nh,setNh]=useState("#ff6b6b");
  const[ek,setEk]=useState(null);const[el,setEl]=useState("");const[eh,setEh]=useState("");
  const[cd,setCd]=useState(null);
  return(<div>
    <div style={{fontSize:11,fontWeight:800,color:txd,marginBottom:6}}>Add/edit/delete colors for your parts.</div>
    {Object.entries(CLR).map(([k,v])=>(<div key={k} style={{display:"flex",alignItems:"center",gap:6,padding:"6px 8px",marginBottom:3,background:dark?"#0e1019":"#f5f6f9",borderRadius:7,border:`1px solid ${dark?"#1a1d2e":"#eceef3"}`}}>
      <div style={{width:24,height:24,borderRadius:5,background:v.bg,flexShrink:0}}/>
      {ek===k?(<div style={{flex:1,display:"flex",gap:3,alignItems:"center",flexWrap:"wrap"}}>
        <input value={el} onChange={e=>setEl(e.target.value)} style={{...S.inp,flex:1,minWidth:50,height:28,fontSize:11,padding:"2px 5px"}} placeholder="Label"/>
        <input type="color" value={eh} onChange={e=>setEh(e.target.value)} style={{width:28,height:28,border:"none",padding:0,cursor:"pointer",borderRadius:4}}/>
        <button onClick={()=>{onEdit(k,el,eh);setEk(null)}} style={{...S.bSm(okC),height:28}}>✓</button>
        <button onClick={()=>setEk(null)} style={{...S.bSm(dark?"#333":"#ddd",tx),height:28}}>✕</button>
      </div>):cd===k?(<div style={{flex:1,display:"flex",gap:3,alignItems:"center"}}>
        <span style={{fontSize:11,fontWeight:800,color:dnC}}>Delete {v.lb}?</span><div style={{flex:1}}/>
        <button onClick={()=>{onDel(k);setCd(null)}} style={{...S.bSm(dnC),height:26}}>Yes</button>
        <button onClick={()=>setCd(null)} style={{...S.bSm(dark?"#333":"#ddd",tx),height:26}}>No</button>
      </div>):(<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div><div style={{fontWeight:900,fontSize:12}}>{v.lb}</div><div style={{fontSize:9,color:txd}}>{k} · {v.bg}</div></div>
        <div style={{display:"flex",gap:3}}>
          <button onClick={()=>{setEk(k);setEl(v.lb);setEh(v.bg)}} style={S.iBtn}>✏️</button>
          {k!=="universal"&&<button onClick={()=>setCd(k)} style={{...S.iBtn,color:dnC+"aa"}}>🗑️</button>}
        </div>
      </div>)}
    </div>))}
    <div style={{marginTop:10,padding:"10px",background:dark?"#0e1019":"#f5f6f9",borderRadius:8,border:`1px solid ${dark?"#1a1d2e":"#eceef3"}`}}>
      <div style={{fontSize:10,fontWeight:900,color:acc,marginBottom:5}}>+ ADD COLOR</div>
      <div style={{display:"flex",gap:3,marginBottom:5}}>
        <input placeholder="Key (green)" value={nk} onChange={e=>setNk(e.target.value.toLowerCase().replace(/[^a-z0-9]/g,""))} style={{...S.inp,flex:1,height:32,fontSize:11}}/>
        <input placeholder="Label" value={nl} onChange={e=>setNl(e.target.value)} style={{...S.inp,flex:1,height:32,fontSize:11}}/>
        <input type="color" value={nh} onChange={e=>setNh(e.target.value)} style={{width:32,height:32,border:"none",padding:0,cursor:"pointer",borderRadius:5}}/>
      </div>
      <button onClick={()=>{if(!nk||!nl){toast("Fill both","err");return}if(CLR[nk]){toast("Exists","err");return}onAdd(nk,nl,nh);setNk("");setNl("")}} disabled={!nk||!nl} style={{...S.btn(okC),width:"100%",height:34,borderRadius:7,opacity:(!nk||!nl)?.5:1}}>Add Color</button>
    </div>
  </div>);
}

function MgrProducts({PRODUCTS,PARTS,onAdd,onEdit,onDel,theme,toast}){

  const[nn,setNn]=useState("");const[ni,setNi]=useState("📦");
  const[ek,setEk]=useState(null);const[en,setEn]=useState("");const[ei,setEi]=useState("");
  const[cd,setCd]=useState(null);

// ═══ BOM EDITOR ═══
function BomEditor({pid,variantKey,profile,PRODUCTS,PARTS,CROSS,CLR,onSave,onClose,theme}){
  const{dark,tx,txd,acc,okC,dnC,cb,S}=theme;
  const parts=[...PARTS.filter(p=>p.p===pid),...CROSS.filter(cp=>cp.products&&cp.products.includes(pid))];
  const allColorKeys=Object.keys(CLR);
  const[baseColor,setBaseColor]=useState(variantKey||"");
  const[mapping,setMapping]=useState(()=>{
    if(profile)return{...profile};
    const m={};
    parts.forEach(p=>{
      if(p.c.length===1){m[p.id]=p.c[0]}
      else if(variantKey&&p.c.includes(variantKey)){m[p.id]=variantKey}
      else{m[p.id]=p.c[0]||""}
    });
    return m;
  });
  const changeBase=(newBase)=>{
    setBaseColor(newBase);
    setMapping(prev=>{
      const m={...prev};
      parts.forEach(p=>{
        if(p.c.length===1){m[p.id]=p.c[0]}
        else if(p.c.includes(newBase)){m[p.id]=newBase}
      });
      return m;
    });
  };
  const setPartColor=(partId,color)=>setMapping(m=>({...m,[partId]:color}));
  const variantColors=useMemo(()=>{
    const s=new Set();
    parts.forEach(p=>p.c.forEach(c=>{if(c!=="universal"&&c!=="black"&&c!=="abs"&&c!=="purecrystal"&&c!=="orangecrystal"&&c!=="random"&&c!=="white")s.add(c)}));
    return[...s];
  },[parts]);
  const canSave=baseColor&&parts.every(p=>mapping[p.id]);
  return(<div>
    <div style={{fontSize:11,fontWeight:800,color:txd,marginBottom:8}}>
      Define which color each part uses for the <strong>{CLR[baseColor]?.lb||baseColor||"?"}</strong> variant of <strong>{PRODUCTS[pid]?.name}</strong>.
    </div>
    <div style={{marginBottom:10}}>
      <div style={{fontSize:9,fontWeight:900,color:acc,marginBottom:4}}>VARIANT BASE COLOR</div>
      <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
        {variantColors.map(c=>(<button key={c} onClick={()=>changeBase(c)} style={{...S.btn(baseColor===c?CLR[c]?.bg||"#888":"transparent",baseColor===c?"#fff":CLR[c]?.bg||"#888"),border:`2px solid ${CLR[c]?.bg||"#888"}`,padding:"5px 8px",fontSize:10}}>{CLR[c]?.lb||c}</button>))}
        {allColorKeys.filter(c=>!variantColors.includes(c)&&c!=="universal").length>0&&(
          <select value={variantColors.includes(baseColor)?"":(baseColor||"")} onChange={e=>{if(e.target.value)changeBase(e.target.value)}} style={{...S.inp,width:"auto",height:30,fontSize:10,padding:"3px 6px"}}>
            <option value="">More...</option>
            {allColorKeys.filter(c=>!variantColors.includes(c)&&c!=="universal").map(c=>(<option key={c} value={c}>{CLR[c]?.lb||c}</option>))}
          </select>
        )}
      </div>
    </div>
    <div style={{fontSize:9,fontWeight:900,color:acc,marginBottom:4}}>PART → COLOR MAPPING</div>
    <div style={{maxHeight:"40vh",overflowY:"auto",marginBottom:10}}>
      {parts.map(p=>{
        const cur=mapping[p.id]||"";
        const isOverride=cur&&cur!==baseColor&&p.c.length>1&&p.c.includes(baseColor);
        return(
          <div key={p.id} style={{padding:"6px 8px",marginBottom:2,background:dark?"#0e1019":"#f5f6f9",borderRadius:6,border:`1px solid ${isOverride?(dnC+"55"):(dark?"#1a1d2e":"#eceef3")}`}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:3}}>
              <span style={{fontWeight:800,fontSize:11,flex:1}}>{p.n}</span>
              {p.products&&<span style={{fontSize:8,background:acc+"22",color:acc,padding:"1px 4px",borderRadius:3,fontWeight:800}}>CROSS</span>}
              {isOverride&&<span style={{fontSize:8,background:dnC+"22",color:dnC,padding:"1px 4px",borderRadius:3,fontWeight:800,marginLeft:3}}>OVERRIDE</span>}
            </div>
            <div style={{display:"flex",gap:2,flexWrap:"wrap"}}>
              {p.c.map(c=>(<button key={c} onClick={()=>setPartColor(p.id,c)} style={{
                ...S.bSm(cur===c?CLR[c]?.bg||"#888":"transparent",cur===c?"#fff":CLR[c]?.bg||"#888"),
                border:`1.5px solid ${CLR[c]?.bg||"#888"}`,padding:"2px 6px",fontSize:9,
                opacity:cur===c?1:.6
              }}>{CLR[c]?.lb||c}</button>))}
            </div>
          </div>
        );
      })}
    </div>
    <div style={{display:"flex",gap:6}}>
      <button onClick={onClose} style={{...S.btn(dark?"#252836":"#e0e3ea",tx),flex:1,height:36,borderRadius:8}}>Cancel</button>
      <button onClick={()=>{if(!canSave)return;onSave(pid,baseColor,mapping)}} disabled={!canSave} style={{...S.btn(okC),flex:1,height:36,borderRadius:8,opacity:canSave?1:.5}}>💾 Save Recipe</button>
    </div>
  </div>);
}

          <CBadge color={vk} CLR={CLR} size={9}/>
          <div style={{fontSize:18,fontWeight:900,color:mx>0?okC:dnC,marginTop:2}}>{mx}</div>
          <div style={{fontSize:8,fontWeight:800,color:txd}}>can make</div>
        </div>)})}
      </div>
    </div>)}
    <button onClick={()=>onEdit({pid,variantKey:"",profile:null})} style={{...S.btn(acc),width:"100%",height:34,borderRadius:7,fontSize:12,marginBottom:6}}>+ Create Variant Recipe</button>
    {profileKeys.map(vk=>{
      const prof=profiles[vk];const isExp=bomExpanded[`${pid}_${vk}`];const mx=calcMax(pid,vk,stock);
      let bottleneck=null,bottleneckQty=Infinity;
      pp.forEach(p=>{const mc=prof[p.id];if(mc){const av=Math.floor((stock[p.id]?.[mc]||0)/(p.per||1));if(av<bottleneckQty){bottleneckQty=av;bottleneck=p}}});
      return(<div key={vk} style={{padding:"8px",marginBottom:4,background:dark?"#13162088":"#ffffffcc",borderRadius:8,border:`1.5px solid ${CLR[vk]?.bg||"#888"}30`}}>
        <div onClick={()=>setBomExpanded(e=>({...e,[`${pid}_${vk}`]:!isExp}))} style={{cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <CBadge color={vk} CLR={CLR} size={11}/>
            <span style={{fontWeight:900,fontSize:13}}>{PRODUCTS[pid]?.name}</span>
            <span style={{fontSize:16,fontWeight:900,color:mx>0?okC:dnC}}>{mx}</span>
          </div>
          <span style={{fontSize:14,color:txd,transform:isExp?"rotate(90deg)":"none",transition:"transform .2s"}}>›</span>
        </div>
        {isExp&&(<div style={{marginTop:8}}>
          {pp.map(p=>{const mc=prof[p.id]||"?";const stk=stock[p.id]?.[mc]||0;const isBottle=p===bottleneck;
            return(<div key={p.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"4px 6px",marginBottom:1,background:dark?"#0e1019":"#f5f6f9",borderRadius:5,border:isBottle?`1.5px solid ${dnC}44`:`1px solid ${dark?"#1a1d2e":"#eceef3"}`}}>
              <div style={{flex:1}}><span style={{fontWeight:800,fontSize:11}}>{p.n}</span>
                {p.products&&<span style={{fontSize:7,background:acc+"22",color:acc,padding:"1px 3px",borderRadius:3,fontWeight:800,marginLeft:3}}>CROSS</span>}
                {isBottle&&<span style={{fontSize:7,background:dnC+"22",color:dnC,padding:"1px 3px",borderRadius:3,fontWeight:800,marginLeft:3}}>BOTTLENECK</span>}
              </div>
              <div style={{display:"flex",alignItems:"center",gap:4}}>
                <CBadge color={mc} CLR={CLR} size={8}/>
                <span style={{fontSize:11,fontWeight:900,color:stk<=threshold?dnC:okC,minWidth:26,textAlign:"right"}}>{stk}</span>
              </div>
            </div>)
          })}
          <div style={{display:"flex",gap:4,marginTop:6}}>
            <button onClick={()=>onEdit({pid,variantKey:vk,profile:prof})} style={{...S.btn(acc),flex:1,height:32,fontSize:11,borderRadius:6}}>✏️ Edit</button>
            <button onClick={()=>onDelete(pid,vk)} style={{...S.btn("transparent",dnC),border:`1.5px solid ${dnC}44`,flex:1,height:32,fontSize:11,borderRadius:6}}>🗑️ Delete</button>
          </div>
        </div>)}
      </div>);
    })}
    {profileKeys.length===0&&<div style={{textAlign:"center",color:txd,padding:12,fontSize:12}}>No recipes yet. Create one to define which color each part uses.</div>}
  </div>);
}


// ═══════════════ MAIN APP ═══════════════
function App(){
  const[dark,setDark]=useState(()=>{const s=localStorage.getItem(THEME_KEY);return s!==null?JSON.parse(s):true});
  
  const[CLR,setCLR]=useState(DEF_COLORS);
  const[PRODUCTS,setProducts]=useState(DEF_PRODUCTS);
  const[PARTS,setParts]=useState(DEF_PARTS);
  const[CROSS,setCross]=useState(DEF_CROSS);
  const[asmRules,setAsmRules]=useState(DEF_ASM);
  const[bomProfiles,setBomProfiles]=useState(DEF_BOM);
  
  const[mainTab,setMainTab]=useState("dashboard");
  const[prodTab,setProdTab]=useState("sprinter");
  const[stock,setStock]=useState({});
  const[logs,setLogs]=useState([]);
  const[confirmed,setConfirmed]=useState({});
  const[notes,setNotes]=useState("");
  const[productNotes,setProductNotes]=useState({});
  const[threshold,setThreshold]=useState(600);
  const[productThresholds,setProductThresholds]=useState({});
  const[loaded,setLoaded]=useState(false);
  const[syncing,setSyncing]=useState(false);
  const[dirty,setDirty]=useState(false);
  const[lastSync,setLastSync]=useState(null);
  const[toast,setToast]=useState(null);
  const[toastAnim,setToastAnim]=useState("enter");
  const[editing,setEditing]=useState(null);
  const[editVal,setEditVal]=useState("");
  const[asmColor,setAsmColor]=useState({});
  const[asmQty,setAsmQty]=useState({});
  const[confirmAsm,setConfirmAsm]=useState(null);
  const[showClear,setShowClear]=useState(false);
  const[logFilter,setLogFilter]=useState("all");
  const[stockFilter,setStockFilter]=useState("all");
  const[editLogId,setEditLogId]=useState(null);
  const[editLogText,setEditLogText]=useState("");
  const[partAdjust,setPartAdjust]=useState({});
  const[searchQuery,setSearchQuery]=useState("");
  const[showManage,setShowManage]=useState(null);
  const[bomEditing,setBomEditing]=useState(null);
  const[stockVerify,setStockVerify]=useState(false);
  const[dashExpanded,setDashExpanded]=useState({});

  const toastTimerRef=useRef(null);const notesRef=useRef(null);const productNotesRef=useRef({});
  const dirtyRef=useRef(false);const modalOpenRef=useRef(false);
  useEffect(()=>{modalOpenRef.current=!!showManage||!!bomEditing},[showManage,bomEditing]);
  useEffect(()=>{localStorage.setItem(THEME_KEY,JSON.stringify(dark))},[dark]);

  const allParts=useMemo(()=>[...PARTS,...CROSS],[PARTS,CROSS]);
  const getProductParts=useCallback(pid=>[...PARTS.filter(p=>p.p===pid),...CROSS.filter(cp=>cp.products&&cp.products.includes(pid))],[PARTS,CROSS]);
  
  // ═══ BOM-AWARE COLOR RESOLUTION ═══
  const getPartColorForAsm=useCallback((part,color,pid)=>{
    const bp=bomProfiles[pid]?.[color];
    if(bp&&bp[part.id])return bp[part.id];
    if(part.c.length===1)return part.c[0];
    if(part.c.includes(color))return color;
    const r=asmRules[pid];
    if(r&&r[color]){for(const[,to]of Object.entries(r[color])){if(part.c.includes(to))return to}}
    return null;
  },[asmRules,bomProfiles]);

  const getAsmColors=useCallback(pid=>{
    const pp=getProductParts(pid);
    const bpKeys=Object.keys(bomProfiles[pid]||{});
    if(bpKeys.length>0){
      return bpKeys.filter(c=>{
        const bp=bomProfiles[pid][c];
        return pp.every(p=>bp[p.id]&&p.c.includes(bp[p.id]));
      });
    }
    const ac=new Set();
    pp.forEach(p=>p.c.forEach(c=>{if(c!=="universal"&&c!=="black"&&c!=="abs"&&c!=="purecrystal"&&c!=="orangecrystal"&&c!=="random"&&c!=="white")ac.add(c)}));
    return[...ac].filter(c=>pp.every(p=>getPartColorForAsm(p,c,pid)!==null));
  },[getProductParts,getPartColorForAsm,bomProfiles]);

  const calcMax=useCallback((pid,color,stk)=>{
    const pp=getProductParts(pid);let m=Infinity;
    for(const p of pp){
      const mp=getPartColorForAsm(p,color,pid);
      if(!mp)return 0;
      m=Math.min(m,Math.floor((stk[p.id]?.[mp]||0)/(p.per||1)));
    }
    return m===Infinity?0:m;
  },[getProductParts,getPartColorForAsm]);

  const showToast=useCallback((msg,type="ok")=>{clearTimeout(toastTimerRef.current);setToastAnim("enter");setToast({msg,type});toastTimerRef.current=setTimeout(()=>{setToastAnim("exit");setTimeout(()=>setToast(null),250)},2200)},[]);

  const serialize=useCallback(()=>({stock,logs:logs.slice(0,2000),confirmed,notes,productNotes,productThresholds,threshold,colors:CLR,products:PRODUCTS,parts:PARTS,crossParts:CROSS,asmRules,bomProfiles,updatedAt:Date.now()}),[stock,logs,confirmed,notes,productNotes,productThresholds,threshold,CLR,PRODUCTS,PARTS,CROSS,asmRules,bomProfiles]);
  const serializeRef=useRef(serialize);serializeRef.current=serialize;

  const loadData=useCallback((d)=>{
    if(d.colors)setCLR(p=>({...DEF_COLORS,...d.colors}));
    if(d.products)setProducts(d.products);if(d.parts)setParts(d.parts);
    if(d.crossParts!==undefined)setCross(d.crossParts||[]);if(d.asmRules)setAsmRules(d.asmRules||{});
    if(d.bomProfiles!==undefined)setBomProfiles(d.bomProfiles||{});
    const ap=[...(d.parts||DEF_PARTS),...(d.crossParts||DEF_CROSS)];
    const mg={};ap.forEach(p=>{mg[p.id]={};p.c.forEach(c=>{mg[p.id][c]=0})});
    Object.keys(d.stock||{}).forEach(k=>{if(mg[k]||ap.find(p=>p.id===k))mg[k]={...(mg[k]||{}),...d.stock[k]}});
    setStock(mg);setLogs(d.logs||[]);setConfirmed(d.confirmed||{});
    if(d.threshold)setThreshold(d.threshold);if(d.productThresholds)setProductThresholds(d.productThresholds);
    if(d.notes!=null)setNotes(d.notes);if(d.productNotes)setProductNotes(d.productNotes);
    return mg;
  },[]);

  // --- FIREBASE PULL ---
  const pullCloud=useCallback(async()=>{
    if(modalOpenRef.current)return false;
    setSyncing(true);
    try{
      const r=await fetch(`${FB_URL}${FB_PATH}.json?_t=${Date.now()}`,{cache:"no-store"});
      if(!r.ok){console.error("Pull Error:",r.status);setSyncing(false);return false}
      const d=await r.json();
      if(d&&(d.stock||d.products)){
        loadData(d);localStorage.setItem(STORE_KEY,JSON.stringify(d));
        setLastSync(new Date());setDirty(false);dirtyRef.current=false;setSyncing(false);return true;
      }
    }catch(e){console.error("Pull Error:",e)}
    setSyncing(false);return false;
  },[loadData]);

  // --- FIREBASE PUSH ---
  const pushCloud=useCallback(async data=>{
    setSyncing(true);
    try{
      const payload=data||serializeRef.current();
      const r=await fetch(`${FB_URL}${FB_PATH}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      if(r.ok){localStorage.setItem(STORE_KEY,JSON.stringify(payload));setLastSync(new Date());setDirty(false);dirtyRef.current=false;showToast("☁️ Synced!")}
      else{console.error("Push Error:",r.status,await r.text());showToast("Save failed","err")}
    }catch(e){console.error("Push Error:",e);showToast("Offline","wrn")}
    setSyncing(false);
  },[showToast]);

  const markDirty=useCallback((ov={})=>{
    setDirty(true);dirtyRef.current=true;
    const d={stock:ov.stock||stock,logs:(ov.logs||logs).slice(0,2000),confirmed:ov.confirmed||confirmed,
      notes:ov.notes!==undefined?ov.notes:notes,productNotes:ov.productNotes||productNotes,
      productThresholds:ov.productThresholds||productThresholds,threshold:ov.threshold!==undefined?ov.threshold:threshold,
      colors:ov.colors||CLR,products:ov.products||PRODUCTS,parts:ov.parts||PARTS,crossParts:ov.crossParts||CROSS,
      asmRules:ov.asmRules||asmRules,bomProfiles:ov.bomProfiles||bomProfiles,updatedAt:Date.now()};
    localStorage.setItem(STORE_KEY,JSON.stringify(d));pushCloud(d);
  },[stock,logs,confirmed,notes,productNotes,productThresholds,threshold,CLR,PRODUCTS,PARTS,CROSS,asmRules,bomProfiles,pushCloud]);

  // --- REAL-TIME EVENT SOURCE ---
  useEffect(()=>{
    let es=null;let reconnectTimer=null;
    const connect=()=>{
      try{
        es=new EventSource(`${FB_URL}${FB_PATH}.json`);
        es.addEventListener("put",(ev)=>{
          try{const payload=JSON.parse(ev.data);const d=payload.data;if(!d)return;if(dirtyRef.current)return;
            if(payload.path==="/"){if(d.stock||d.products){loadData(d);localStorage.setItem(STORE_KEY,JSON.stringify(d));setLastSync(new Date());setDirty(false);dirtyRef.current=false}}
            else{if(!dirtyRef.current)pullCloud()}
          }catch(e){}
        });
        es.addEventListener("patch",()=>{if(!dirtyRef.current)pullCloud()});
        es.onerror=()=>{es.close();reconnectTimer=setTimeout(connect,3000)};
      }catch(e){reconnectTimer=setTimeout(connect,5000)}
    };
    connect();
    const onWake=()=>{if(document.visibilityState==="visible"&&es&&es.readyState!==1){es.close();pullCloud();connect()}};
    document.addEventListener("visibilitychange",onWake);
    return()=>{if(es)es.close();clearTimeout(reconnectTimer);document.removeEventListener("visibilitychange",onWake)};
  },[pullCloud,loadData]);

  useEffect(()=>{const iv=setInterval(()=>{if(dirtyRef.current&&!modalOpenRef.current)pushCloud()},30000);return()=>clearInterval(iv)},[pushCloud]);
  useEffect(()=>{
    const save=()=>{const d=serializeRef.current();localStorage.setItem(STORE_KEY,JSON.stringify(d));
      try{fetch(`${FB_URL}${FB_PATH}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(d),keepalive:true})}catch(e){}};
    const v=()=>{if(document.visibilityState==="hidden")save()};
    document.addEventListener("visibilitychange",v);window.addEventListener("pagehide",save);window.addEventListener("beforeunload",save);
    return()=>{document.removeEventListener("visibilitychange",v);window.removeEventListener("pagehide",save);window.removeEventListener("beforeunload",save)};
  },[]);
  
  useEffect(()=>{(async()=>{const l=localStorage.getItem(STORE_KEY);if(l){try{loadData(JSON.parse(l))}catch(e){}}setLoaded(true);await pullCloud()})()},[pullCloud,loadData]);

  const mkLog=(a,d,p)=>({id:genId(),ts:Date.now(),a,d,p});
  const handleSetPA=useCallback((k,v)=>setPartAdjust(p=>({...p,[k]:v})),[]);

  const doAssemble=pid=>{const ac=getAsmColors(pid);const c=asmColor[pid]||ac[0];const q=parseInt(asmQty[pid])||0;if(!c){showToast("No color","err");return}if(q<=0){showToast("Enter qty","err");return}setConfirmAsm({pid,color:c,qty:q})};
  const confirmDoAssemble=()=>{const{pid,color,qty}=confirmAsm;const pp=getProductParts(pid);const ns={...stock};
    pp.forEach(p=>{const m=getPartColorForAsm(p,color,pid);if(!m)return;if(!ns[p.id])ns[p.id]={};ns[p.id][m]=Math.max(0,(ns[p.id][m]||0)-qty*(p.per||1))});
    const nm=PRODUCTS[pid]?.name||pid;const e=mkLog("assemble",`${qty} ${CLR[color]?.lb||color} ${nm}${qty>1?"s":""}`,pid);
    const nl=[e,...logs].slice(0,2000);setStock(ns);setLogs(nl);setAsmQty(q=>({...q,[pid]:""}));setConfirmAsm(null);markDirty({stock:ns,logs:nl});showToast(`Assembled ${qty} ${CLR[color]?.lb} ${nm}!`)};

  const saveStock=(id,c)=>{const v=parseInt(editVal);if(isNaN(v)){showToast("Enter number","err");return}const ns={...stock};if(!ns[id])ns[id]={};const o=ns[id][c]||0;const nv=Math.max(0,v);ns[id]={...ns[id],[c]:nv};const p=allParts.find(x=>x.id===id);const e=mkLog("stock_edit",`${p?.n||id} [${CLR[c]?.lb||c}]: ${o} → ${nv}`,p?.p||"cross");const nl=[e,...logs].slice(0,2000);setStock(ns);setLogs(nl);setEditing(null);setEditVal("");markDirty({stock:ns,logs:nl});showToast("Updated")};
  const adjustStock=(id,c,d)=>{const iv=partAdjust[`${id}_${c}`];const amt=iv?parseInt(iv):Math.abs(d);if(isNaN(amt))return;const ad=d>0?amt:-amt;const ns={...stock};if(!ns[id])ns[id]={};const o=ns[id][c]||0;const nv=Math.max(0,o+ad);ns[id]={...ns[id],[c]:nv};const p=allParts.find(x=>x.id===id);const e=mkLog("adjust",`${p?.n||id} [${CLR[c]?.lb||c}]: ${o} → ${nv} (${nv>o?"+":""}${nv-o})`,p?.p||"cross");const nl=[e,...logs].slice(0,2000);setStock(ns);setLogs(nl);markDirty({stock:ns,logs:nl});setPartAdjust(p=>({...p,[`${id}_${c}`]:""}))};
  const toggleConfirm=id=>{const nc={...confirmed};if(nc[id])delete nc[id];else nc[id]=Date.now();setConfirmed(nc);markDirty({confirmed:nc})};
  const resetConfirm=()=>{setConfirmed({});markDirty({confirmed:{}});showToast("Reset")};
  const confirmAll=()=>{const nc={};allParts.forEach(p=>nc[p.id]=Date.now());setConfirmed(nc);markDirty({confirmed:nc});showToast("All confirmed")};
  const deleteLog=id=>{const nl=logs.filter(l=>l.id!==id);setLogs(nl);markDirty({logs:nl})};
  const clearLogs=()=>{setLogs([]);markDirty({logs:[]});showToast("Cleared")};
  const saveLogEdit=id=>{const nl=logs.map(l=>l.id===id?{...l,d:editLogText,editedAt:Date.now()}:l);setLogs(nl);setEditLogId(null);markDirty({logs:nl})};
  const handleNotes=v=>{setNotes(v);clearTimeout(notesRef.current);notesRef.current=setTimeout(()=>markDirty({notes:v}),800)};
  const handlePN=(pid,v)=>{const n={...productNotes,[pid]:v};setProductNotes(n);clearTimeout(productNotesRef.current[pid]);productNotesRef.current[pid]=setTimeout(()=>markDirty({productNotes:n}),800)};

  const addColor=(k,l,h)=>{const nc={...CLR,[k]:{bg:h,fg:"#fff",lb:l,gw:h+"4d"}};setCLR(nc);markDirty({colors:nc})};
  const editColor=(k,l,h)=>{const nc={...CLR,[k]:{...CLR[k],bg:h,lb:l,gw:h+"4d"}};setCLR(nc);markDirty({colors:nc})};
  const deleteColor=k=>{if(k==="universal")return;const nc={...CLR};delete nc[k];setCLR(nc);markDirty({colors:nc})};
  const addProduct=(k,n,i)=>{const np={...PRODUCTS,[k]:{name:n,icon:i}};setProducts(np);markDirty({products:np});setProdTab(k)};
  const editProduct=(k,n,i)=>{const np={...PRODUCTS,[k]:{...PRODUCTS[k],name:n,icon:i}};setProducts(np);markDirty({products:np})};
  const deleteProduct=k=>{const np={...PRODUCTS};delete np[k];setProducts(np);const fp=PARTS.filter(p=>p.p!==k);setParts(fp);const fc=CROSS.map(cp=>({...cp,products:(cp.products||[]).filter(x=>x!==k)}));setCross(fc);const nb={...bomProfiles};delete nb[k];setBomProfiles(nb);if(prodTab===k)setProdTab(Object.keys(np)[0]||"");markDirty({products:np,parts:fp,crossParts:fc,bomProfiles:nb})};
  const addPart=(n,pid,c,per)=>{const id=`${pid.slice(0,2)}_${genId()}`;const np=[...PARTS,{id,n,p:pid,c,per:per||1}];setParts(np);const ns={...stock};ns[id]={};c.forEach(k=>{ns[id][k]=0});setStock(ns);markDirty({parts:np,stock:ns})};
  const editPart=(id,n,c,per)=>{const np=PARTS.map(p=>p.id===id?{...p,n,c,per:per||1}:p);setParts(np);const ns={...stock};if(!ns[id])ns[id]={};c.forEach(k=>{if(ns[id][k]===undefined)ns[id][k]=0});setStock(ns);markDirty({parts:np,stock:ns})};
  const deletePart=id=>{const np=PARTS.filter(p=>p.id!==id);setParts(np);const ns={...stock};delete ns[id];setStock(ns);markDirty({parts:np,stock:ns})};
  const addCross=(n,pids,c,per)=>{const id=`cx_${genId()}`;const nc=[...CROSS,{id,n,c,per:per||1,products:pids}];setCross(nc);const ns={...stock};ns[id]={};c.forEach(k=>{ns[id][k]=0});setStock(ns);markDirty({crossParts:nc,stock:ns})};
  const editCross=(id,n,pids,c,per)=>{const nc=CROSS.map(p=>p.id===id?{...p,n,products:pids,c,per:per||1}:p);setCross(nc);const ns={...stock};if(!ns[id])ns[id]={};c.forEach(k=>{if(ns[id][k]===undefined)ns[id][k]=0});setStock(ns);markDirty({crossParts:nc,stock:ns})};
  const deleteCross=id=>{const nc=CROSS.filter(p=>p.id!==id);setCross(nc);const ns={...stock};delete ns[id];setStock(ns);markDirty({crossParts:nc,stock:ns})};

  const saveBomProfile=(pid,variantKey,mapping)=>{
    const nb={...bomProfiles,[pid]:{...(bomProfiles[pid]||{}),[variantKey]:mapping}};
    setBomProfiles(nb);markDirty({bomProfiles:nb});setBomEditing(null);showToast(`💾 ${CLR[variantKey]?.lb||variantKey} ${PRODUCTS[pid]?.name} recipe saved!`);
  };
  const deleteBomProfile=(pid,variantKey)=>{
    const nb={...bomProfiles};if(nb[pid]){delete nb[pid][variantKey];if(Object.keys(nb[pid]).length===0)delete nb[pid]}
    setBomProfiles(nb);markDirty({bomProfiles:nb});showToast("Deleted","wrn");
  };

  const doExportJSON=()=>{const p=serialize();p.exportedAt=new Date().toISOString();dlFile(new Blob([JSON.stringify(p,null,2)],{type:"application/json"}),`littlestar_${new Date().toISOString().slice(0,10)}.json`)};
  const doExportCSV=()=>{let csv="Product,Part,Color,Stock\n";allParts.forEach(p=>{const pr=p.products?"Cross":(PRODUCTS[p.p]?.name||p.p);p.c.forEach(c=>{csv+=`"${pr}","${p.n}","${CLR[c]?.lb||c}",${stock[p.id]?.[c]||0}\n`})});dlFile(new Blob([csv],{type:"text/csv"}),`littlestar_${new Date().toISOString().slice(0,10)}.csv`)};
  const handleImport=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.stock||d.products){const mg=loadData(d);markDirty({stock:mg,logs:d.logs||[],confirmed:d.confirmed||{},colors:d.colors||CLR,products:d.products||PRODUCTS,parts:d.parts||PARTS,crossParts:d.crossParts||CROSS,asmRules:d.asmRules||asmRules,bomProfiles:d.bomProfiles||bomProfiles});showToast("Imported!")}else showToast("Invalid","err")}catch(err){showToast("Error","err")}};rd.readAsText(f);e.target.value=""};
  const wipeData=()=>{const es={};allParts.forEach(p=>{es[p.id]={};p.c.forEach(c=>{es[p.id][c]=0})});setStock(es);setLogs([]);setConfirmed({});setNotes("");setProductNotes({});setProductThresholds({});markDirty({stock:es,logs:[],confirmed:{},notes:"",productNotes:{},productThresholds:{}});showToast("Wiped","err")};
  const dataSize=useMemo(()=>(new Blob([JSON.stringify(serialize())]).size/1024).toFixed(1),[serialize]);

  const bg=dark?"#0a0c14":"#f0f2f7",card=dark?"#13162088":"#ffffffcc",cb=dark?"#1e2235":"#dfe2ea",tx=dark?"#e8eaf0":"#1a1a2e",txd=dark?"#6b7194":"#7c7f96",acc="#4f8cff",okC="#22c55e",dnC="#ef4444",wnC="#f59e0b";

    </div>)};

  // ═══ RENDER: LOG TAB ═══
  const renderLog=()=>{const fl=logFilter==="all"?logs:logs.filter(l=>l.p===logFilter);return(<div><div style={{padding:"8px 8px 3px",fontSize:14,fontWeight:900}}>📋 Log</div><div style={{display:"flex",gap:3,padding:"0 6px 6px",overflowX:"auto"}}>{["all",...Object.keys(PRODUCTS),"cross"].map(f=>(<button key={f} onClick={()=>setLogFilter(f)} style={{...S.btn(logFilter===f?acc:"transparent",logFilter===f?"#fff":txd),padding:"3px 8px",fontSize:11,border:`1px solid ${logFilter===f?acc:cb}`,whiteSpace:"nowrap"}}>{f==="all"?"All":f==="cross"?"Cross":PRODUCTS[f]?.name||f}</button>))}</div>{!fl.length&&<div style={{...S.crd,textAlign:"center",color:txd,padding:12,fontSize:12}}>No activity</div>}{fl.slice(0,100).map(l=>(<div key={l.id} style={{...S.crd,padding:"7px 9px",marginBottom:1}}><div style={{display:"flex",alignItems:"flex-start",gap:6}}><div style={{paddingTop:4,flexShrink:0}}><div style={{width:7,height:7,borderRadius:"50%",background:l.a==="assemble"?okC:l.a==="adjust"||l.a==="stock_edit"?acc:wnC}}/></div><div style={{flex:1,minWidth:0}}><div style={{display:"flex",alignItems:"center",gap:4,flexWrap:"wrap",marginBottom:1}}><span style={S.tag(l.a==="assemble"?okC:l.a==="adjust"||l.a==="stock_edit"?acc:wnC)}>{l.a}</span>{l.p&&<span style={{fontSize:9,color:txd,fontWeight:800}}>{PRODUCTS[l.p]?.name||l.p}</span>}</div>{editLogId===l.id?(<div style={{marginTop:3}}><input value={editLogText} onChange={e=>setEditLogText(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")saveLogEdit(l.id);if(e.key==="Escape")setEditLogId(null)}} autoFocus style={{...S.inp,marginBottom:3,fontSize:12}}/><div style={{display:"flex",gap:3}}><button onClick={()=>saveLogEdit(l.id)} style={{...S.bSm(okC),flex:1}}>Save</button><button onClick={()=>setEditLogId(null)} style={{...S.bSm(dark?"#444":"#ccc",tx),flex:1}}>Cancel</button></div></div>):(<div style={{fontSize:12,fontWeight:800,lineHeight:1.3}}>{l.d}</div>)}<div style={{fontSize:9,color:txd,marginTop:1,fontWeight:600}}>{fmtTS(l.ts)}</div></div><div style={{display:"flex",flexDirection:"column",gap:3}}><button onClick={()=>{setEditLogId(l.id);setEditLogText(l.d)}} style={S.iBtn}>✏️</button><button onClick={()=>deleteLog(l.id)} style={{...S.iBtn,color:dnC+"aa"}}>🗑️</button></div></div></div>))}{logs.length>0&&<div style={{padding:"6px 8px"}}><button onClick={clearLogs} style={{...S.btn("transparent",dnC),border:`1px solid ${dnC}`,width:"100%",fontSize:11}}>🗑️ Clear All</button></div>}</div>)};

  // ═══ RENDER: SETTINGS ═══
  const renderSettings=()=>(<div>
    <div style={{padding:"8px 8px 3px",fontSize:14,fontWeight:900}}>⚙️ Settings</div>
    <div style={{padding:"6px 8px 2px",fontSize:9,fontWeight:900,color:acc,letterSpacing:.5}}>🔧 MANAGE</div>
    <div style={S.crd}><div style={{display:"flex",flexDirection:"column",gap:5}}>
      {[{k:"bom",i:"📋",l:"BOM / Recipes",d:Object.values(bomProfiles).reduce((s,p)=>s+Object.keys(p).length,0)+" recipes"},{k:"colors",i:"🎨",l:"Colors",d:Object.keys(CLR).length+" items"},{k:"products",i:"📦",l:"Products",d:Object.keys(PRODUCTS).length+" items"},{k:"parts",i:"🔩",l:"Parts",d:PARTS.length+" items"},{k:"links",i:"🔗",l:"Cross-Links",d:CROSS.length+" items"}].map(m=>(<button key={m.k} onClick={()=>setShowManage(m.k)} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",background:dark?"#0e1019":"#f5f6f9",borderRadius:8,border:`1px solid ${dark?"#1a1d2e":"#eceef3"}`,cursor:"pointer",textAlign:"left",fontFamily:"'Nunito',sans-serif"}}><span style={{fontSize:18}}>{m.i}</span><div style={{flex:1}}><div style={{fontWeight:900,fontSize:13,color:tx}}>{m.l}</div><div style={{fontSize:10,color:txd,fontWeight:700}}>{m.d}</div></div><span style={{color:txd,fontSize:14}}>›</span></button>))}
    </div></div>
    <div style={S.crd}><label style={S.lbl}>Cloud Sync</label><button onClick={pullCloud} disabled={syncing} style={{...S.btn(acc),width:"100%",height:34,borderRadius:8}}>{syncing?"Syncing...":"⬇️ Pull from Cloud"}</button>{lastSync&&<div style={{fontSize:9,color:txd,marginTop:4,textAlign:"center",fontWeight:700}}>Last: {fmtTS(lastSync.getTime())}</div>}</div>
    <div style={S.crd}><label style={S.lbl}>Export</label><div style={{display:"flex",gap:5}}><button onClick={doExportJSON} style={{...S.btn(acc),flex:1,height:34,borderRadius:8}}>📥 JSON</button><button onClick={doExportCSV} style={{...S.btn(okC),flex:1,height:34,borderRadius:8}}>📊 CSV</button></div></div>
    <div style={S.crd}><label style={S.lbl}>Import</label><label style={{...S.btn(wnC),cursor:"pointer",width:"100%",height:34,justifyContent:"center",borderRadius:8}}>📤 Import JSON<input type="file" accept=".json" onChange={handleImport} style={{display:"none"}}/></label></div>
    <div style={S.crd}><label style={S.lbl}>Low Stock Threshold</label><input type="number" inputMode="numeric" value={threshold} onChange={e=>{const v=parseInt(e.target.value)||0;setThreshold(v);markDirty({threshold:v})}} style={{...S.inp,fontSize:15,fontWeight:900,textAlign:"center",height:38}}/></div>
    <div style={S.crd}><label style={S.lbl}>Product Thresholds</label><div style={{display:"flex",flexDirection:"column",gap:4}}>{[...Object.keys(PRODUCTS),"cross"].map(p=>(<div key={p} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:dark?"#0e1019":"#f5f6f9",padding:"6px 8px",borderRadius:7,border:`1px solid ${dark?"#1a1d2e":"#eceef3"}`}}><div style={{fontSize:12,fontWeight:800}}>{p==="cross"?"🔗 Cross":`${PRODUCTS[p]?.icon||""} ${PRODUCTS[p]?.name||p}`}</div><input type="number" placeholder={`${threshold}`} value={productThresholds[p]!==undefined?productThresholds[p]:""} onChange={e=>{const v=e.target.value===""?undefined:parseInt(e.target.value);const n={...productThresholds};if(v===undefined)delete n[p];else n[p]=v;setProductThresholds(n);markDirty({productThresholds:n})}} style={{...S.inp,width:64,fontSize:12,fontWeight:800,textAlign:"center",height:28,padding:"2px"}}/></div>))}</div></div>
    <div style={S.crd}><label style={S.lbl}>Notes</label><textarea rows={3} value={notes} onChange={e=>handleNotes(e.target.value)} placeholder="Shared notes..." style={{...S.inp,minHeight:50,resize:"vertical",lineHeight:1.4,borderRadius:8,fontSize:12}}/></div>
    <div style={S.crd}><label style={S.lbl}>Theme</label><div style={{display:"flex",gap:5}}><button onClick={()=>setDark(true)} style={{...S.btn(dark?acc:cb,dark?"#fff":tx),flex:1,height:34,borderRadius:8}}>🌙 Dark</button><button onClick={()=>setDark(false)} style={{...S.btn(!dark?acc:cb,!dark?"#fff":tx),flex:1,height:34,borderRadius:8}}>☀️ Light</button></div></div>
    <div style={S.crd}><label style={S.lbl}>Data</label><span style={{fontSize:11,fontWeight:800}}>{dataSize} KB</span></div>
    <div style={{padding:"8px 8px 2px",fontSize:9,fontWeight:900,color:dnC}}>DANGER ZONE</div>
    <div style={{...S.crd,borderColor:dnC+"33"}}><button onClick={()=>setShowClear(true)} style={{...S.btn(dnC),width:"100%",height:36,borderRadius:8}}>🚨 Clear All Data</button></div>
  </div>);

  // ═══ MAIN RENDER ═══
  return(<div style={S.app}>
    {toast&&<div className={toastAnim==="enter"?"toast-enter":"toast-exit"} style={S.toast}>{toast.msg}</div>}
    {showClear&&(<div className="modal-bg" style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,.8)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:16,backdropFilter:"blur(6px)"}}><div className="modal-card" style={{...S.crd,margin:0,maxWidth:280,width:"100%",textAlign:"center",padding:"20px 16px",borderRadius:14}}><div style={{fontSize:40,marginBottom:6}}>⚠️</div><h2 style={{marginTop:0,color:dnC,fontSize:18,fontWeight:900}}>CLEAR ALL?</h2><p style={{color:txd,marginBottom:14,fontSize:12,fontWeight:700}}>Deletes stock, logs, notes.</p><div style={{display:"flex",flexDirection:"column",gap:6}}><button onClick={()=>setShowClear(false)} style={{...S.btn(okC),width:"100%",height:38,fontSize:13,borderRadius:8}}>✅ Cancel</button><button onClick={()=>{wipeData();setShowClear(false)}} style={{...S.btn("transparent",dnC),border:`2px solid ${dnC}`,width:"100%",height:38,fontSize:13,borderRadius:8}}>🚨 Delete</button></div></div></div>)}
    {confirmAsm&&(<div className="modal-bg" style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,.75)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16,backdropFilter:"blur(6px)"}}><div className="modal-card" style={{...S.crd,margin:0,maxWidth:320,width:"100%",textAlign:"center",padding:"18px 14px",borderRadius:14}}>
      <div style={{fontSize:36,marginBottom:6}}>{PRODUCTS[confirmAsm.pid]?.icon}</div>
      <div style={{fontSize:15,fontWeight:900,marginBottom:4}}>Confirm Assembly</div>
      <div style={{fontSize:12,color:txd,marginBottom:8,lineHeight:1.3}}>Make <strong style={{color:CLR[confirmAsm.color]?.bg}}>{confirmAsm.qty} {CLR[confirmAsm.color]?.lb}</strong> {PRODUCTS[confirmAsm.pid]?.name}{confirmAsm.qty>1?"s":""}?{calcMax(confirmAsm.pid,confirmAsm.color,stock)<confirmAsm.qty&&(<div style={{color:wnC,fontSize:10,marginTop:3,fontWeight:900}}>⚠️ Parts will go below 0</div>)}</div>
      <div style={{textAlign:"left",maxHeight:"28vh",overflowY:"auto",marginBottom:10}}>
        {getProductParts(confirmAsm.pid).map(p=>{
          const mc=getPartColorForAsm(p,confirmAsm.color,confirmAsm.pid);
          if(!mc)return null;
          const cur=stock[p.id]?.[mc]||0;
          const aft=Math.max(0,cur-confirmAsm.qty*(p.per||1));
          return(<div key={p.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"2px 4px",fontSize:10,fontWeight:700}}>
            <span style={{flex:1}}>{p.n}</span>
            <CBadge color={mc} CLR={CLR} size={7}/>
            <span style={{minWidth:50,textAlign:"right",color:aft<=0?dnC:txd}}>{cur}→{aft}</span>
          </div>);
        })}
      </div>
      <div style={{display:"flex",gap:6}}><button onClick={()=>setConfirmAsm(null)} style={{...S.btn(dark?"#252836":"#e0e3ea",tx),flex:1,height:36,fontSize:12,borderRadius:8}}>Cancel</button><button onClick={confirmDoAssemble} style={{...S.btn(okC),flex:1,height:36,fontSize:12,borderRadius:8}}>Confirm</button></div>
    </div></div>)}

    {/* BOM Editor Modal */}
    <Modal show={!!bomEditing} onClose={()=>setBomEditing(null)} title={`📋 ${bomEditing?((bomEditing.variantKey?'Edit':'New')+' Recipe — '+(PRODUCTS[bomEditing.pid]?.name||'')):''}`} theme={theme}>
      {bomEditing&&<BomEditor pid={bomEditing.pid} variantKey={bomEditing.variantKey} profile={bomEditing.profile} PRODUCTS={PRODUCTS} PARTS={PARTS} CROSS={CROSS} CLR={CLR} onSave={saveBomProfile} onClose={()=>setBomEditing(null)} theme={theme}/>}
    </Modal>

    <Modal show={showManage==="colors"} onClose={()=>setShowManage(null)} title="🎨 Colors" theme={theme}><MgrColors CLR={CLR} onAdd={addColor} onEdit={editColor} onDel={deleteColor} theme={theme} toast={showToast}/></Modal>
    <Modal show={showManage==="products"} onClose={()=>setShowManage(null)} title="📦 Products" theme={theme}><MgrProducts PRODUCTS={PRODUCTS} PARTS={PARTS} onAdd={addProduct} onEdit={editProduct} onDel={deleteProduct} theme={theme} toast={showToast}/></Modal>
    <Modal show={showManage==="parts"} onClose={()=>setShowManage(null)} title="🔩 Parts" theme={theme}><MgrParts PRODUCTS={PRODUCTS} PARTS={PARTS} CLR={CLR} onAdd={addPart} onEdit={editPart} onDel={deletePart} theme={theme} toast={showToast}/></Modal>
    <Modal show={showManage==="links"} onClose={()=>setShowManage(null)} title="🔗 Cross-Links" theme={theme}><MgrCross PRODUCTS={PRODUCTS} CROSS={CROSS} CLR={CLR} onAdd={addCross} onEdit={editCross} onDel={deleteCross} theme={theme} toast={showToast}/></Modal>
    <Modal show={showManage==="bom"} onClose={()=>setShowManage(null)} title="📋 BOM / Recipes" theme={theme}>
      <BomPanel PRODUCTS={PRODUCTS} PARTS={PARTS} CROSS={CROSS} CLR={CLR} stock={stock} bomProfiles={bomProfiles} threshold={threshold} calcMax={calcMax} onEdit={e=>{setShowManage(null);setBomEditing(e)}} onDelete={(pid,vk)=>{if(window.confirm(`Delete ${CLR[vk]?.lb} ${PRODUCTS[pid]?.name} recipe?`))deleteBomProfile(pid,vk)}} theme={theme}/>
    </Modal>

    <div style={{background:dark?"#0d0f18ee":"#ffffffee",borderBottom:`1px solid ${dark?"#1a1d2e":"#e0e3ea"}`,position:"sticky",top:0,zIndex:95,backdropFilter:"blur(16px)"}}>
      <div style={{padding:"5px 10px",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:`1px solid ${dark?"#ffffff08":"#00000008"}`}}>
        <div style={{display:"flex",alignItems:"center"}}><SDot syncing={syncing} dirty={dirty} okC={okC} wnC={wnC} acc={acc}/><span style={{fontSize:10,fontWeight:800,color:syncing?acc:dirty?wnC:okC,letterSpacing:.4}}>{syncing?"SYNCING":dirty?"SAVING":"SYNCED"}</span></div>
        <button onClick={()=>pushCloud()} disabled={syncing||!dirty} style={{...S.bSm(dirty?wnC+"22":acc+"15",dirty?wnC:acc),padding:"3px 10px",fontSize:10,opacity:(!dirty&&!syncing)?.4:1,border:`1px solid ${dirty?wnC+"44":acc+"33"}`,borderRadius:6}}>{syncing?"⏳":"☁️"} {dirty?"Save":"Synced"}</button>
      </div>
      <div style={{padding:"6px 10px 5px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{fontSize:15,fontWeight:900,display:"flex",alignItems:"center",gap:5}}>🏭 Little Star</div>
        <button onClick={()=>setDark(!dark)} style={{background:dark?"#ffffff10":"#0000000a",border:"none",color:txd,fontSize:14,cursor:"pointer",padding:"3px 6px",borderRadius:6}}>{dark?"☀️":"🌙"}</button>
      </div>
    </div>

    {/* Sub-nav for Assembly */}
    {mainTab==="products"&&(<div style={S.subNav}>{Object.keys(PRODUCTS).map(pid=>(<button key={pid} onClick={()=>{setProdTab(pid);setSearchQuery("")}} style={S.subNI(prodTab===pid)}><span style={{fontSize:12}}>{PRODUCTS[pid].icon}</span>{PRODUCTS[pid].name}</button>))}<button onClick={()=>{setProdTab("cross");setSearchQuery("")}} style={S.subNI(prodTab==="cross")}><span style={{fontSize:12}}>🔗</span>Cross</button></div>)}

    {/* Search bar */}
    {["products","stock"].includes(mainTab)&&(<div style={{padding:"6px 8px 0",position:"relative"}}><input type="text" placeholder="Search parts..." value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} style={{...S.inp,height:34,fontSize:12,fontWeight:700,paddingLeft:30}}/><span style={{position:"absolute",left:16,top:"50%",transform:"translateY(-30%)",fontSize:12,opacity:.5,pointerEvents:"none"}}>🔍</span>{searchQuery&&<span onClick={()=>setSearchQuery("")} style={{position:"absolute",right:16,top:"50%",transform:"translateY(-30%)",fontSize:14,cursor:"pointer",opacity:.5}}>✕</span>}</div>)}

    <div style={{paddingBottom:6}}>
      {mainTab==="dashboard"&&renderDashboard()}
      {mainTab==="products"&&prodTab!=="cross"&&PRODUCTS[prodTab]&&renderProd(prodTab)}
      {mainTab==="products"&&prodTab==="cross"&&renderCross()}
      {mainTab==="stock"&&renderStock()}
      {mainTab==="log"&&renderLog()}
      {mainTab==="settings"&&renderSettings()}
    </div>

    <nav style={S.nav}>{[{k:"dashboard",i:"🏠",l:"Home"},{k:"products",i:"🏭",l:"Assembly"},{k:"stock",i:"📦",l:"Stock"},{k:"log",i:"📝",l:"Logs"},{k:"settings",i:"⚙️",l:"Settings"}].map(n=>(<button key={n.k} onClick={()=>{setMainTab(n.k);setSearchQuery("")}} style={S.nI(mainTab===n.k)}>{mainTab===n.k&&<div style={{position:"absolute",top:-1,left:"25%",right:"25%",height:2.5,borderRadius:2,background:acc,boxShadow:`0 0 8px ${acc}66`}}/>}<span style={{fontSize:18,marginBottom:1}}>{n.i}</span>{n.l}</button>))}</nav>
  </div>);
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);

</script>
</body>
</html>
