const CROSS_PARTS=[
  {id:"cx_pipe",n:"Stroller & Tolo Pipe",c:["universal"],per:1,products:["stroller","tolo"]}
];

const ALL_PARTS=[...PARTS,...CROSS_PARTS];

function getProductParts(pid){
  const own=PARTS.filter(p=>p.p===pid);
  const cross=CROSS_PARTS.filter(cp=>cp.products.includes(pid));
  return[...own,...cross];
}

function getPartColorForAsm(part,asmColor){
  if(part.c.includes("universal"))return "universal";
  if(part.c.includes(asmColor))return asmColor;
  if(asmColor==="red"&&part.c.includes("darkblue"))return "darkblue";
  return null;
}

function getAssemblableColors(pid){
  const pp=getProductParts(pid);
  const allC=new Set();
  pp.forEach(p=>p.c.forEach(c=>{if(c!=="universal")allC.add(c)}));
  if(pid==="stroller"){
    return["pink","blue","red"].filter(color=>
      pp.every(p=>getPartColorForAsm(p,color)!==null)
    );
  }
  return[...allC].filter(color=>pp.every(p=>p.c.includes(color)||p.c.includes("universal")));
}

function initStock(){
  const s={};
  ALL_PARTS.forEach(p=>{s[p.id]={};p.c.forEach(c=>{s[p.id][c]=0})});
  return s;
}

function calcMax(pid,color,stock){
  const pp=getProductParts(pid);
  let m=Infinity;
  for(const p of pp){
    const mapped=getPartColorForAsm(p,color);
    if(!mapped)return 0;
    m=Math.min(m,Math.floor((stock[p.id]?.[mapped]||0)/(p.per||1)));
  }
  return m===Infinity?0:m;
}

function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function fmtTS(ts){
  const d=new Date(ts);
  const dd=String(d.getDate()).padStart(2,"0"),mm=String(d.getMonth()+1).padStart(2,"0"),yy=String(d.getFullYear()).slice(2);
  let h=d.getHours();const ap=h>=12?"PM":"AM";h=h%12||12;
  return`${dd}/${mm}/${yy} ${h}:${String(d.getMinutes()).padStart(2,"0")} ${ap}`;
}

function downloadFile(blob,filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},150);
}

function ColorBadge({color,size=12}){
  const c=CLR[color]||CLR.universal;
  return <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",minWidth:size*3.2,height:size*1.7,borderRadius:5,background:c.bg,color:c.fg,fontSize:size*0.85,fontWeight:900,letterSpacing:.5,padding:"0 7px",flexShrink:0,boxShadow:`0 2px 8px ${c.gw||"transparent"}`}}>{c.lb}</span>;
}

function SyncDot({syncing,dirty,okC,wnC,acc}){
  const color=syncing?acc:dirty?wnC:okC;
  return <span style={{display:"inline-block",width:7,height:7,borderRadius:"50%",background:color,marginRight:6,flexShrink:0,animation:syncing?"syncPulse .8s ease infinite":dirty?"pulse 1.5s ease infinite":"none",boxShadow:`0 0 6px ${color}`}}/>;
}

function PartRow({part,showProduct,showConfirm,stock,confirmed,editing,editVal,partAdjust,
  onSetEditing,onSetEditVal,onSetPartAdjust,onSaveStock,onAdjustStock,onToggleConfirm,theme, threshold, productThresholds}){
  
  const{dark,tx,txd,acc,okC,dnC,cb,card,S}=theme;
  
  const s=stock[part.id]||{};
  const isConf=!!confirmed[part.id];
  const isCross=!!part.products;
  const prodKey = isCross ? "cross" : part.p;
  const activeThreshold = productThresholds[prodKey] !== undefined ? productThresholds[prodKey] : threshold;

  return(
    <div style={{...S.crd, padding: "8px 10px", border: isConf ? `1.5px solid ${okC}` : `1px solid ${cb}`, background: isConf ? (dark ? okC+"15" : okC+"08") : card}}>
      
      {/* COMPACT HEADER: Title and tags on the same line */}
      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
        {showConfirm&&<span onClick={()=>onToggleConfirm(part.id)} style={{cursor:"pointer",fontSize:20, flexShrink:0}}>{isConf?"✅":"⬜"}</span>}
        {isConf&&!showConfirm&&<span style={{fontSize:14, flexShrink:0}}>✅</span>}
        <div style={{display:"flex", alignItems:"center", flexWrap:"wrap", gap:6, flex:1}}>
          <span style={{fontWeight:900,fontSize:18, lineHeight:1.1}}>{part.n}</span>
          {isCross&&<span style={{fontSize:10,background:acc+"22",color:acc,padding:"2px 6px",borderRadius:6,fontWeight:800}}>CROSS</span>}
          {showProduct&&<span style={{fontSize:10,background:txd+"33",color:txd,padding:"2px 6px",borderRadius:6,fontWeight:800}}>{part.products?"Cross":PRODUCTS[part.p]?.name||part.p}</span>}
          <span style={{fontSize:11,color:txd,fontWeight:800}}>×{part.per}/u</span>
        </div>
      </div>

      {part.c.map(c=>{
        const val=s[c]||0;
        const adjKey=`${part.id}_${c}`;
        const isEdit=editing===adjKey;
        const stockColor = val <= activeThreshold ? dnC : okC;
        
        return(
          <div key={c} style={{marginBottom:6, padding:"6px 8px", background: dark ? "#1f222e" : "#f8f9fa", borderRadius:6, border:`1px solid ${dark?"#2d3142":"#e9ecef"}`}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom: isEdit ? 0 : 4}}>
              <ColorBadge color={c} size={12}/>
              {isEdit?(
                <div style={{display:"flex", gap:4}}>
                  <input type="number" inputMode="numeric" autoFocus value={editVal}
                    onChange={e=>onSetEditVal(e.target.value)}
                    onKeyDown={e=>{if(e.key==="Enter")onSaveStock(part.id,c);if(e.key==="Escape")onSetEditing(null)}}
                    style={{...S.inp, width:70, fontSize:15, fontWeight:900, textAlign:"center", height: 32, padding:"4px"}}/>
                  <button onClick={()=>onSaveStock(part.id,c)} style={{...S.bSm(okC), padding:"0 12px", fontSize: 14}}>✓</button>
                </div>
              ):(
                <span onClick={()=>{onSetEditing(adjKey);onSetEditVal(String(val))}}
                  style={{fontWeight:900,fontSize:20,color:stockColor,cursor:"pointer",borderBottom:`2px dashed ${txd}`,paddingBottom:1}}>
                  {val.toLocaleString()}
                </span>
              )}
            </div>

            {/* COMPACT CONTROLS: All on one line */}
            {!isEdit&&(
              <div style={{display:"flex", gap:4, alignItems:"center"}}>
                <button onClick={()=>onAdjustStock(part.id,c,-1)} style={{...S.btn(dnC), flex:0.7, height:32, fontSize:18, fontWeight:900, padding:0}}>−</button>
                <input type="number" inputMode="numeric" placeholder="Qty"
                  value={partAdjust[adjKey]||""}
                  onChange={e=>onSetPartAdjust(adjKey,e.target.value)}
                  style={{...S.inp, width:55, height: 32, fontSize:13, textAlign:"center", fontWeight:800, padding:"0 2px"}}/>
                <button onClick={()=>onAdjustStock(part.id,c,1)} style={{...S.btn(okC), flex:0.7, height:32, fontSize:18, fontWeight:900, padding:0}}>+</button>
                
                <button onClick={()=>onSetPartAdjust(adjKey, String((parseInt(partAdjust[adjKey])||0) + 100))} style={{...S.bSm(acc), flex:1, height:32, fontSize:12, fontWeight:800, padding:0}}>+100</button>
                <button onClick={()=>onSetPartAdjust(adjKey, String((parseInt(partAdjust[adjKey])||0) + 200))} style={{...S.bSm(acc), flex:1, height:32, fontSize:12, fontWeight:800, padding:0}}>+200</button>
                <button onClick={()=>onSetPartAdjust(adjKey, String((parseInt(partAdjust[adjKey])||0) + 500))} style={{...S.bSm(acc), flex:1, height:32, fontSize:12, fontWeight:800, padding:0}}>+500</button>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function App(){
  const [dark, setDark] = useState(() => {
    const saved = localStorage.getItem(THEME_KEY);
    return saved !== null ? JSON.parse(saved) : true;
  });
  
  const[mainTab,setMainTab]=useState("products");
  const[prodTab,setProdTab]=useState("sprinter");
  const[stock,setStock]=useState(initStock);
  const[logs,setLogs]=useState([]);
  const[confirmed,setConfirmed]=useState({});
  
  const[notes,setNotes]=useState("");
  const[productNotes,setProductNotes]=useState({});
  
  const[threshold,setThreshold]=useState(600);
  const[productThresholds,setProductThresholds]=useState({});
  
  const[loaded,setLoaded]=useState(false);
  const[syncing,setSyncing]=useState(false);
  const[dirty,setDirty]=useState(false);
  const[lastSync,setLastSync]=useState(null);
  const[toast,setToast]=useState(null);
  const[toastAnim,setToastAnim]=useState("enter");
  const[editing,setEditing]=useState(null);
  const[editVal,setEditVal]=useState("");
  const[asmColor,setAsmColor]=useState({});
  const[asmQty,setAsmQty]=useState({});
  const[confirmAsm,setConfirmAsm]=useState(null);
  const[showClear,setShowClear]=useState(false);
  const[logFilter,setLogFilter]=useState("all");
  const[stockFilter,setStockFilter]=useState("all");
  const[editLogId,setEditLogId]=useState(null);
  const[editLogText,setEditLogText]=useState("");
  const[partAdjust,setPartAdjust]=useState({});
  const[searchQuery,setSearchQuery]=useState("");
  
  const debounceRef=useRef(null);
  const notesRef=useRef(null);
  const productNotesRef=useRef({});
  const toastTimerRef=useRef(null);

  useEffect(() => {
    localStorage.setItem(THEME_KEY, JSON.stringify(dark));
  }, [dark]);

  const showToast=useCallback((msg,type="ok")=>{
    clearTimeout(toastTimerRef.current);setToastAnim("enter");setToast({msg,type});
    toastTimerRef.current=setTimeout(()=>{setToastAnim("exit");setTimeout(()=>setToast(null),250);},2200);
  },[]);

  const serialize=useCallback(()=>({
    stock,logs:logs.slice(0,2000),confirmed,notes,productNotes,productThresholds,threshold,updatedAt:Date.now()
  }),[stock,logs,confirmed,notes,productNotes,productThresholds,threshold]);

  const pullCloud=useCallback(async()=>{
    setSyncing(true);
    try{
      const r=await fetch(`${FB_URL}${FB_PATH}.json`);
      const j=await r.json();
      if(j&&j.stock){
        const d=j;
        
        const localRaw = localStorage.getItem(STORE_KEY);
        let localD = null;
        if(localRaw) { try { localD = JSON.parse(localRaw); } catch(e){} }
        
        if (localD && localD.updatedAt && d.updatedAt && localD.updatedAt > d.updatedAt) {
            setDirty(true);
            setSyncing(false);
            showToast("Local offline changes found. Please save.");
            return true;
        }

        const merged={...initStock()};
        Object.keys(d.stock||{}).forEach(k=>{if(merged[k]||ALL_PARTS.find(p=>p.id===k))merged[k]={...(merged[k]||{}),...d.stock[k]}});
        
        setStock(merged);
        setLogs(d.logs||[]);
        setConfirmed(d.confirmed||{});
        if(d.threshold) setThreshold(d.threshold);
        if(d.productThresholds) setProductThresholds(d.productThresholds);
        if(d.notes!=null) setNotes(d.notes);
        if(d.productNotes) setProductNotes(d.productNotes);
        
        localStorage.setItem(STORE_KEY,JSON.stringify({...d,stock:merged}));
        setLastSync(new Date());setDirty(false);setSyncing(false);return true;
      }
    }catch(e){console.error("Pull err:",e)}
    setSyncing(false);return false;
  },[]);

  const autoSyncRef=useRef(null);
  const dirtyRef=useRef(false);
  const serializeRef=useRef(serialize);
  serializeRef.current=serialize;

  const pushCloud=useCallback(async(data)=>{
    setSyncing(true);
    try{
      const payload=data||serialize();
      const r=await fetch(`${FB_URL}${FB_PATH}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      if(r.ok){localStorage.setItem(STORE_KEY,JSON.stringify(payload));setLastSync(new Date());setDirty(false);dirtyRef.current=false;showToast("☁️ Synced!")}
      else{const errText=await r.text();showToast(`Save failed: ${r.status} - ${errText.slice(0,80)}`,"err");console.error("Firebase error:",r.status,errText)}
    }catch(e){showToast(`Offline: ${e.message}`,"wnC");console.error("Push error:",e)}
    setSyncing(false);
  },[serialize,showToast]);

  const markDirty=useCallback(()=>{
    setDirty(true);
    dirtyRef.current=true;
    // Save to localStorage immediately
    const data=serialize();
    localStorage.setItem(STORE_KEY,JSON.stringify(data));
    // Push to Firebase IMMEDIATELY — no delay
    pushCloud(data);
  },[serialize,pushCloud]);

  // Periodic backup sync every 30s as safety net
  useEffect(()=>{
    const interval=setInterval(()=>{
      if(dirtyRef.current){
        pushCloud();
      }
    },30000);
    return()=>clearInterval(interval);
  },[pushCloud]);

  // Emergency save when user switches tabs, minimizes, or closes browser
  useEffect(()=>{
    const emergencySave=()=>{
      const data=serializeRef.current();
      localStorage.setItem(STORE_KEY,JSON.stringify(data));
      try{fetch(`${FB_URL}${FB_PATH}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(data),keepalive:true})}catch(e){}
    };
    const onVisChange=()=>{if(document.visibilityState==="hidden")emergencySave()};
    document.addEventListener("visibilitychange",onVisChange);
    window.addEventListener("pagehide",emergencySave);
    window.addEventListener("beforeunload",emergencySave);
    return()=>{
      document.removeEventListener("visibilitychange",onVisChange);
      window.removeEventListener("pagehide",emergencySave);
      window.removeEventListener("beforeunload",emergencySave);
    };
  },[]);

  useEffect(()=>{
    const init=async()=>{
      const local=localStorage.getItem(STORE_KEY);
      if(local){try{
        const d=JSON.parse(local);
        const merged={...initStock()};
        Object.keys(d.stock||{}).forEach(k=>{if(merged[k]||ALL_PARTS.find(p=>p.id===k))merged[k]={...(merged[k]||{}),...d.stock[k]}});
        setStock(merged);setLogs(d.logs||[]);setConfirmed(d.confirmed||{});
        setThreshold(d.threshold||600);
        setProductThresholds(d.productThresholds||{});
        setNotes(d.notes||"");
        setProductNotes(d.productNotes||{});
      }catch(e){}}
      setLoaded(true);await pullCloud();
    };init();
  },[pullCloud]);

  // === REAL-TIME LISTENER: Firebase SSE for instant cross-device sync ===
  useEffect(()=>{
    let es=null;let reconnectTimer=null;let lastApplied=0;
    const connect=()=>{
      try{
        es=new EventSource(`${FB_URL}${FB_PATH}.json`);
        es.addEventListener("put",(ev)=>{
          try{
            const payload=JSON.parse(ev.data);
            const d=payload.data;
            if(!d||!d.stock)return;
            // Don't overwrite if we have unsaved local changes
            if(dirtyRef.current)return;
            // Don't re-apply the same update
            if(d.updatedAt && d.updatedAt<=lastApplied)return;
            lastApplied=d.updatedAt||Date.now();
            const merged={...initStock()};
            Object.keys(d.stock||{}).forEach(k=>{if(merged[k]||ALL_PARTS.find(p=>p.id===k))merged[k]={...(merged[k]||{}),...d.stock[k]}});
            setStock(merged);
            setLogs(d.logs||[]);
            setConfirmed(d.confirmed||{});
            if(d.threshold) setThreshold(d.threshold);
            if(d.productThresholds) setProductThresholds(d.productThresholds);
            if(d.notes!=null) setNotes(d.notes);
            if(d.productNotes) setProductNotes(d.productNotes);
            localStorage.setItem(STORE_KEY,JSON.stringify({...d,stock:merged}));
            setLastSync(new Date());setDirty(false);dirtyRef.current=false;
          }catch(e){console.warn("SSE parse error:",e)}
        });
        es.addEventListener("patch",(ev)=>{
          // On patch events, just do a full pull to stay consistent
          if(!dirtyRef.current) pullCloud();
        });
        es.onerror=()=>{
          es.close();
          // Reconnect after 3 seconds
          reconnectTimer=setTimeout(connect,3000);
        };
      }catch(e){console.warn("SSE connect error:",e);reconnectTimer=setTimeout(connect,5000)}
    };
    connect();
    return()=>{if(es)es.close();clearTimeout(reconnectTimer)};
  },[pullCloud]);

  const mkLog=(action,detail,product)=>({id:genId(),ts:Date.now(),a:action,d:detail,p:product});

  const doAssemble=(pid)=>{
    const aColors=getAssemblableColors(pid);
    const color=asmColor[pid]||aColors[0];const qty=parseInt(asmQty[pid])||0;
    if(!color){showToast("No assemblable color","err");return}
    if(qty<=0){showToast("Enter quantity","err");return}
    setConfirmAsm({pid,color,qty});
  };

  const confirmDoAssemble=()=>{
    const{pid,color,qty}=confirmAsm;
    const pp=getProductParts(pid);const ns={...stock};
    pp.forEach(p=>{
      const mapped=getPartColorForAsm(p,color);
      if(!mapped)return;
      if(!ns[p.id])ns[p.id]={};
      ns[p.id][mapped]=Math.max(0,(ns[p.id][mapped]||0)-qty*(p.per||1));
    });
    const pName=PRODUCTS[pid]?.name||pid;
    const entry=mkLog("assemble",`${qty} ${CLR[color]?.lb||color} ${pName}${qty>1?"s":""}`,pid);
    const nl=[entry,...logs].slice(0,2000);
    setStock(ns);setLogs(nl);setAsmQty(q=>({...q,[pid]:""}));setConfirmAsm(null);markDirty();
    showToast(`Assembled ${qty} ${CLR[color]?.lb} ${pName}!`);
  };

  const saveStock=(partId,color)=>{
    const val=parseInt(editVal);if(isNaN(val)){showToast("Enter number","err");return}
    const ns={...stock};if(!ns[partId])ns[partId]={};
    const old=ns[partId][color]||0;const nv=Math.max(0,val);
    ns[partId]={...ns[partId],[color]:nv};
    const part=ALL_PARTS.find(p=>p.id===partId);
    const entry=mkLog("stock_edit",`${part?.n||partId} [${CLR[color]?.lb||color}]: ${old} \u2192 ${nv}`,part?.p||"cross");
    const nl=[entry,...logs].slice(0,2000);
    setStock(ns);setLogs(nl);setEditing(null);setEditVal("");markDirty();showToast("Stock updated");
  };

  const adjustStock=(pid,ck,delta)=>{
    const iv=partAdjust[`${pid}_${ck}`];
    const amt=iv?parseInt(iv):Math.abs(delta);
    if(isNaN(amt))return;
    const ad=delta>0?amt:-amt;
    const ns={...stock};if(!ns[pid])ns[pid]={};
    const old=ns[pid][ck]||0;const nv=Math.max(0,old+ad);
    ns[pid]={...ns[pid],[ck]:nv};
    const part=ALL_PARTS.find(p=>p.id===pid);
    const entry=mkLog("adjust",`${part?.n||pid} [${CLR[ck]?.lb||ck}]: ${old} \u2192 ${nv} (${nv>old?"+":""}${nv-old})`,part?.p||"cross");
    const nl=[entry,...logs].slice(0,2000);
    setStock(ns);setLogs(nl);markDirty();
    setPartAdjust(prev=>({...prev,[`${pid}_${ck}`]:""}));
  };

  const toggleConfirm=(partId)=>{
    const nc={...confirmed};
    if(nc[partId])delete nc[partId];else nc[partId]=Date.now();
    setConfirmed(nc);markDirty();
  };
  
  const resetConfirm=()=>{setConfirmed({});markDirty();showToast("Confirmations reset")};
  
  const confirmAll=()=>{
    const nc={};
    ALL_PARTS.forEach(p=>nc[p.id]=Date.now());
    setConfirmed(nc);
    markDirty();
    showToast("All parts confirmed");
  };

  const deleteLog=(lid)=>{setLogs(logs.filter(l=>l.id!==lid));markDirty()};
  const clearLogs=()=>{setLogs([]);markDirty();showToast("Logs cleared")};
  const saveLogEdit=(lid)=>{
    const nl=logs.map(l=>l.id===lid?{...l,d:editLogText,editedAt:Date.now()}:l);
    setLogs(nl);setEditLogId(null);markDirty();showToast("Log updated");
  };

  const handleNotes=(val)=>{
    setNotes(val);clearTimeout(notesRef.current);
    notesRef.current=setTimeout(()=>markDirty(),800);
  };
  
  const handleProductNotes=(pid, val)=>{
    setProductNotes(prev => ({...prev, [pid]: val}));
    clearTimeout(productNotesRef.current[pid]);
    productNotesRef.current[pid] = setTimeout(() => markDirty(), 800);
  };

  const doExportJSON=()=>{
    const payload=serialize();payload.exportedAt=new Date().toISOString();
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    downloadFile(blob,`littlestar_backup_${new Date().toISOString().slice(0,10)}.json`);
  };

  const doExportCSV=()=>{
    let csv="Product,Part,Color,Stock\n";
    ALL_PARTS.forEach(part=>{
      const prod=part.p==="cross"?"cross":(PRODUCTS[part.p]?.name||part.p);
      part.c.forEach(c=>{
        csv+=`"${prod}","${part.n}","${CLR[c]?.lb||c}",${stock[part.id]?.[c]||0}\n`;
      });
    });
    CROSS_PARTS.forEach(cp=>{
      cp.c.forEach(c=>{
        csv+=`"Cross (${cp.products.map(p=>PRODUCTS[p]?.name).join(' & ')})","${cp.n}","${CLR[c]?.lb||c}",${stock[cp.id]?.[c]||0}\n`;
      });
    });
    const blob=new Blob([csv],{type:"text/csv"});
    downloadFile(blob,`littlestar_stock_${new Date().toISOString().slice(0,10)}.csv`);
  };

  const handleImport=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(d.stock){
          const merged={...initStock()};
          Object.keys(d.stock).forEach(k=>{if(merged[k])merged[k]={...merged[k],...d.stock[k]}});
          setStock(merged);setLogs(d.logs||[]);setConfirmed(d.confirmed||{});
          if(d.threshold)setThreshold(d.threshold);
          if(d.productThresholds)setProductThresholds(d.productThresholds);
          if(d.notes!=null)setNotes(d.notes);
          if(d.productNotes)setProductNotes(d.productNotes);
          markDirty();showToast("Imported successfully!");
        }else showToast("Invalid format","err");
      }catch(err){showToast("Error reading file","err")}
    };reader.readAsText(file);e.target.value="";
  };

  const wipeData=()=>{setStock(initStock());setLogs([]);setConfirmed({});setNotes("");setProductNotes({});setProductThresholds({});markDirty();showToast("All data wiped","err")};

  const dataSize=useMemo(()=>{
    const j=JSON.stringify(serialize());return(new Blob([j]).size/1024).toFixed(1);
  },[serialize]);

  const bg=dark?"#0a0c14":"#f0f2f7";
  const card=dark?"#13162088":"#ffffffcc";
  const cb=dark?"#1e2235":"#dfe2ea";
  const tx=dark?"#e8eaf0":"#1a1a2e";
  const txd=dark?"#6b7194":"#7c7f96";
  const acc="#4f8cff";
  const okC="#22c55e";const dnC="#ef4444";const wnC="#f59e0b";

  const S={
    app:{fontFamily:"'Nunito',sans-serif",background:bg,color:tx,minHeight:"100vh",maxWidth:520,margin:"0 auto",paddingBottom:76,fontSize:14,WebkitFontSmoothing:"antialiased"},
    crd:{background:card,border:`1px solid ${dark?"#1e2235":"#e2e5ec"}`,borderRadius:12,margin:"6px 8px",padding:"10px 12px",backdropFilter:"blur(12px)",boxShadow:dark?"0 2px 12px rgba(0,0,0,.2)":"0 1px 6px rgba(0,0,0,.05)"},
    btn:(b,c="#fff")=>({background:b,color:c,border:"none",borderRadius:8,padding:"6px 12px",fontWeight:800,fontSize:14,fontFamily:"'Nunito',sans-serif",cursor:"pointer",display:"inline-flex",alignItems:"center",justifyContent:"center",gap:4,boxShadow:`0 2px 8px ${b}33`}),
    bSm:(b,c="#fff")=>({background:b,color:c,border:"none",borderRadius:6,padding:"4px 8px",fontWeight:800,fontSize:12,fontFamily:"'Nunito',sans-serif",cursor:"pointer",display:"inline-flex",alignItems:"center",justifyContent:"center"}),
    inp:{background:dark?"#0e1019":"#f5f6f9",border:`1.5px solid ${dark?"#252a40":"#dde0e8"}`,borderRadius:8,padding:"7px 10px",color:tx,fontSize:14,fontFamily:"'Nunito',sans-serif",width:"100%",boxSizing:"border-box",outline:"none",transition:"border-color .2s"},
    lbl:{fontSize:10,fontWeight:900,color:txd,marginBottom:5,display:"block",textTransform:"uppercase",letterSpacing:.8},
    tag:(c)=>({display:"inline-block",padding:"3px 8px",borderRadius:10,fontSize:10,fontWeight:800,background:c+"18",color:c}),
    iBtn:{background:"none",border:"none",color:txd,fontSize:16,cursor:"pointer",padding:"4px 6px",borderRadius:8},
    nav:{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:520,background:dark?"#0d0f18ee":"#ffffffee",borderTop:`1px solid ${dark?"#1a1d2e":"#e0e3ea"}`,display:"flex",zIndex:100,backdropFilter:"blur(16px)",paddingBottom:"env(safe-area-inset-bottom)"},
    nI:(a)=>({flex:1,padding:"8px 0 10px",textAlign:"center",background:"none",border:"none",color:a?acc:txd,fontSize:10,fontWeight:a?900:700,fontFamily:"'Nunito',sans-serif",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2,position:"relative"}),
    toast:{position:"fixed",top:16,left:"50%",background:dark?"#1a1d27ee":"#ffffffee",color:toast?.type==="err"?dnC:toast?.type==="wrn"?wnC:okC,padding:"10px 20px",borderRadius:12,fontWeight:800,fontSize:13,zIndex:9999,boxShadow:dark?"0 8px 32px rgba(0,0,0,.5)":"0 8px 32px rgba(0,0,0,.12)",fontFamily:"'Nunito',sans-serif",maxWidth:"88%",textAlign:"center",border:`1.5px solid ${toast?.type==="err"?dnC+"44":toast?.type==="wrn"?wnC+"44":okC+"44"}`,backdropFilter:"blur(12px)"},
    subNav:{display:"flex",overflowX:"auto",gap:0,background:dark?"#0d0f18ee":"#ffffffee",backdropFilter:"blur(12px)",borderBottom:`1px solid ${dark?"#1a1d2e":"#e0e3ea"}`,position:"sticky",top:0,zIndex:90},
    subNI:(a)=>({padding:"10px 14px",whiteSpace:"nowrap",background:"none",border:"none",borderBottom:a?`2.5px solid ${acc}`:"2.5px solid transparent",color:a?acc:txd,fontSize:13,fontWeight:a?900:700,fontFamily:"'Nunito',sans-serif",cursor:"pointer",display:"flex",alignItems:"center",gap:4,transition:"color .15s, border-color .15s"}),
  };

  const theme={dark,tx,txd,acc,okC,dnC,cb,card,S};

  const handleSetPartAdjust=useCallback((key,val)=>{
    setPartAdjust(prev=>({...prev,[key]:val}));
  },[]);

  if(!loaded)return(
    <div style={{...S.app,display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"}}>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:48,marginBottom:12,animation:"pulse 1.5s ease infinite"}}>🏭</div>
        <div style={{fontSize:22,fontWeight:900,letterSpacing:-.5}}>Little Star</div>
        <div style={{color:txd,marginTop:6,fontSize:12,fontWeight:700}}>Loading Inventory...</div>
        <div style={{width:40,height:3,borderRadius:2,background:acc,margin:"12px auto 0",animation:"shimmer 1.5s ease infinite",backgroundSize:"200% 100%",backgroundImage:`linear-gradient(90deg,${acc}44,${acc},${acc}44)`}}/>
      </div>
    </div>
  );

  const partRowProps={
    stock,confirmed,editing,editVal,partAdjust,
    onSetEditing:setEditing,onSetEditVal:setEditVal,onSetPartAdjust:handleSetPartAdjust,
    onSaveStock:saveStock,onAdjustStock:adjustStock,onToggleConfirm:toggleConfirm,theme,threshold,productThresholds
  };

  const renderProductView=(pid)=>{
    let pp=getProductParts(pid);
    if(searchQuery) {
        pp = pp.filter(p => p.n.toLowerCase().includes(searchQuery.toLowerCase()));
    }
    const aColors=getAssemblableColors(pid);
    const colored=pp.filter(p=>!p.c.includes("universal"));
    const univ=pp.filter(p=>p.c.includes("universal"));
    const selColor=asmColor[pid]||aColors[0]||"";
    
    return(
      <div>
        <div style={{...S.crd,border:`1.5px solid ${acc}30`, padding:"12px 14px", background:dark?`linear-gradient(135deg,#131620 0%,${acc}08 100%)`:`linear-gradient(135deg,#fff 0%,${acc}06 100%)`}}>
          <div style={{fontSize:15,fontWeight:900,marginBottom:10,display:"flex",alignItems:"center",gap:6}}>⚙️ Assemble {PRODUCTS[pid]?.name}</div>
          <div style={{display:"flex",gap:5,marginBottom:10,flexWrap:"wrap"}}>
            {aColors.map(c=>(
              <button key={c} onClick={()=>setAsmColor(a=>({...a,[pid]:c}))}
                style={{...S.btn(selColor===c?CLR[c].bg:"transparent",selColor===c?"#fff":CLR[c].bg),border:`2px solid ${CLR[c].bg}`,padding:"7px 10px",fontSize:12,flex:1,minWidth:50,
                boxShadow:selColor===c?`0 3px 12px ${CLR[c].gw}`:"none"}}>
                {CLR[c].lb}
              </button>
            ))}
          </div>
          <div style={{display:"flex",gap:6,marginBottom:10}}>
            <input type="number" inputMode="numeric" placeholder="Qty..." value={asmQty[pid]||""} onChange={e=>setAsmQty(q=>({...q,[pid]:e.target.value}))}
              style={{...S.inp,flex:1,fontSize:15,height:38,fontWeight:800,textAlign:"center"}}/>
            <button onClick={()=>doAssemble(pid)} style={{...S.btn(okC),fontSize:14,padding:"0 18px",height:38,borderRadius:10}}>✅ Make</button>
          </div>
          <div style={{display:"flex",gap:6}}>
            {aColors.map(c=>{

      {["products", "stock", "confirm"].includes(mainTab) && (
        <div style={{padding: "8px 10px 0", position:"relative"}}>
           <input type="text" placeholder="Search parts..." value={searchQuery} onChange={(e)=>setSearchQuery(e.target.value)} 
             style={{...S.inp, height: 38, fontSize: 13, fontWeight: 700, paddingLeft:34, background: dark ? "#0e1019" : "#f5f6f9", border: `1.5px solid ${searchQuery?acc+"88":dark?"#252a40":"#dde0e8"}`}} />
           <span style={{position:"absolute",left:20,top:"50%",transform:"translateY(-30%)",fontSize:14,opacity:.5,pointerEvents:"none"}}>🔍</span>
           {searchQuery&&<span onClick={()=>setSearchQuery("")} style={{position:"absolute",right:20,top:"50%",transform:"translateY(-30%)",fontSize:16,cursor:"pointer",opacity:.5}}>✕</span>}
        </div>
      )}

      <div style={{paddingBottom:8}}>
        {mainTab==="products"&&prodTab!=="cross"&&renderProductView(prodTab)}
        {mainTab==="products"&&prodTab==="cross"&&renderCrossView()}
        {mainTab==="stock"&&renderStockView()}
        {mainTab==="log"&&renderLogView()}
        {mainTab==="confirm"&&renderConfirmView()}
        {mainTab==="settings"&&renderSettingsView()}
      </div>

      <nav style={S.nav}>
        {[
          {k:"products",i:"🏭",l:"Assembly"},
          {k:"stock",i:"📦",l:"Stock"},
          {k:"log",i:"📋",l:"Logs"},
          {k:"confirm",i:"✅",l:"Verify"},
          {k:"settings",i:"⚙️",l:"Settings"}
        ].map(n=>(
          <button key={n.k} onClick={()=>{setMainTab(n.k); setSearchQuery("")}} style={S.nI(mainTab===n.k)}>
            {mainTab===n.k&&<div style={{position:"absolute",top:-1,left:"25%",right:"25%",height:2.5,borderRadius:2,background:acc,boxShadow:`0 0 8px ${acc}66`}}/>}
            <span style={{fontSize:17, marginBottom:1}}>{n.i}</span>{n.l}
          </button>
        ))}
      </nav>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
